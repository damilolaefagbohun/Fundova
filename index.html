const TOUR_STEPS = [
  { id:'dash', title:'Your savings overview', body:'This is your total value — principal saved plus all interest earned. It updates every weekday automatically.' },
  { id:'goals', title:'Savings goals', body:'Set a target amount and watch your progress in real time. A great way to stay motivated and focused.' },
  { id:'bonus-section', title:'Cooperative bonuses', body:'Any surplus distributed by Fundova appears here. You can add it to your savings or request a withdrawal.' },
  { id:'explore-fundova', title:'Group savings (Ajo)', body:'Coordinate your own rotating savings group, or see your position in one you\'ve joined — right from here. Investments, the food scheme, and deals also have their own sections further down.' },
];

let tourStep = 0;
let tourOverlay = null;

function startTour(){
  if(localStorage.getItem('fundova_tour_seen')==='1'){return;}
  tourStep = 0;
  showTourStep();
}

function showTourStep(){
  clearTourOverlay();
  if(tourStep >= TOUR_STEPS.length){endTour();return;}
  const step = TOUR_STEPS[tourStep];
  const el = document.getElementById(step.id);

  tourOverlay = document.createElement('div');
  tourOverlay.style.cssText = 'position:fixed;inset:0;z-index:9000;pointer-events:none';

  const backdrop = document.createElement('div');
  backdrop.style.cssText = 'position:absolute;inset:0;background:rgba(0,0,0,.55);pointer-events:all';
  tourOverlay.appendChild(backdrop);

  // Tooltip
  const tip = document.createElement('div');
  tip.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);width:min(340px,90vw);background:#fff;border-radius:16px;padding:1.25rem;box-shadow:0 8px 32px rgba(0,0,0,.25);z-index:9001;pointer-events:all';
  tip.innerHTML = `
    <div style="font-size:10px;font-weight:700;color:#C9961A;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px">Step ${tourStep+1} of ${TOUR_STEPS.length}</div>
    <h3 style="font-size:15px;font-weight:700;color:#0D1F14;margin-bottom:6px">${step.title}</h3>
    <p style="font-size:13px;color:#666;line-height:1.6;margin-bottom:1rem">${step.body}</p>
    <div style="display:flex;gap:8px;align-items:center;justify-content:space-between">
      <button onclick="skipTour()" style="background:none;border:none;font-size:12px;color:#aaa;cursor:pointer;text-decoration:underline">Do not show me again</button>
      <div style="display:flex;gap:6px">
        ${tourStep > 0 ? '<button onclick="prevTourStep()" style="background:#f5f5f3;border:none;padding:8px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer">← Back</button>' : ''}
        <button onclick="nextTourStep()" style="background:#0D3D2A;color:#fff;border:none;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer">${tourStep < TOUR_STEPS.length-1 ? 'Next →' : 'Done ✓'}</button>
      </div>
    </div>`;

  tourOverlay.appendChild(tip);
  document.body.appendChild(tourOverlay);

  // Scroll to element
  if(el) el.scrollIntoView({behavior:'smooth', block:'center'});
}

function nextTourStep(){ tourStep++; showTourStep(); }
function prevTourStep(){ tourStep--; showTourStep(); }
function skipTour(){ localStorage.setItem('fundova_tour_seen','1'); endTour(); }
function endTour(){ clearTourOverlay(); localStorage.setItem('fundova_tour_seen','1'); }
function clearTourOverlay(){ if(tourOverlay){tourOverlay.remove();tourOverlay=null;} }

async function renderProfileCompletion(kyc){
  const fields = [
    { label:'Bank details', done: !!(kyc&&kyc.bank_name) },
    { label:'Savings goal', done: !!(currentUser.savings_goal) },
    { label:'Date of birth', done: !!(kyc&&kyc.date_of_birth) },
    { label:'Home address', done: !!(kyc&&kyc.home_address) },
    { label:'BVN', done: !!(kyc&&kyc.bvn) },
    { label:'NIN', done: !!(kyc&&kyc.nin) },
    { label:'Government ID', done: !!(kyc&&kyc.id_type) },
  ];

  const completed = fields.filter(f=>f.done).length;
  const total = fields.length;
  const pct = Math.round((completed/total)*100);

  // Once fully complete, this card has nothing left to prompt — hide it entirely rather
  // than keep showing a "you're done!" card taking up permanent space on the dashboard.
  // Profile & KYC stays reachable via the sidebar for anyone who wants to update it later.
  if(pct===100)return'';
  const allKycDone = fields.slice(1).filter(f=>!f.done).length === 0 && fields[0].done;

  return`<div class="card" style="margin-bottom:1rem">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <h3 style="margin:0;font-size:15px">Profile completion</h3>
      <span style="font-size:13px;font-weight:700;color:${pct===100?'#0F6E56':'#C9961A'}">${pct}%</span>
    </div>
    <div style="background:#e5e5e2;border-radius:6px;height:8px;overflow:hidden;margin-bottom:10px">
      <div style="height:100%;background:${pct===100?'#1D9E75':'#C9961A'};width:${pct}%;transition:width .5s"></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px">
      ${fields.map(f=>`<div style="display:flex;align-items:center;gap:6px;font-size:12px;color:${f.done?'#065F46':'#888'}">
        <span style="font-size:14px">${f.done?'✅':'⬜'}</span>${f.label}
      </div>`).join('')}
    </div>
    ${!allKycDone?`<div style="background:#FEF3C7;border-radius:8px;padding:8px 12px;font-size:12px;color:#92400E">
      <i class="ti ti-lock"></i> Complete all fields above to unlock withdrawals
    </div>`:'<div style="background:#D1FAE5;border-radius:8px;padding:8px 12px;font-size:12px;color:#065F46"><i class="ti ti-check"></i> Profile complete — withdrawals unlocked!</div>'}
    <button onclick="openKycForm()" style="width:100%;margin-top:10px;background:#0D3D2A;color:#fff;border:none;padding:10px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer"><i class="ti ti-edit"></i> Update profile & KYC</button>
  </div>`;
}

async function saveKyc(){
  const btn = document.getElementById('kyc-btn');
  const err = document.getElementById('kyc-err');
  btn.innerHTML='<span class="spinner"></span> Saving…';btn.disabled=true;

  try{
    const bankName = document.getElementById('kyc-bank').value.trim();
    const accountNumber = document.getElementById('kyc-anum').value.trim();
    const accountName = document.getElementById('kyc-aname').value.trim();
    const dateOfBirth = document.getElementById('kyc-dob').value;
    const homeAddress = document.getElementById('kyc-address').value.trim();
    const bvn = document.getElementById('kyc-bvn').value.trim();
    const nin = document.getElementById('kyc-nin').value.trim();
    const idType = document.getElementById('kyc-idtype').value;
    const idNumber = document.getElementById('kyc-idnum').value.trim();
    const nokName = document.getElementById('kyc-nok-name')?.value?.trim()||'';
    const nokRel = document.getElementById('kyc-nok-rel')?.value||'';
    const nokPhone = document.getElementById('kyc-nok-phone')?.value?.trim()||'';
    const nokWhatsapp = document.getElementById('kyc-nok-whatsapp')?.value?.trim()||'';
    const nokEmail = document.getElementById('kyc-nok-email')?.value?.trim()||'';
    const nokMailingList = document.getElementById('kyc-nok-mailinglist')?.checked||false;

    // Save bank details if provided
    if(bankName||accountNumber||accountName){
      const existing = await sb(`bank_details?user_id=eq.${currentUser.id}&select=id`);
      if(existing&&existing.length){
        await sb(`bank_details?user_id=eq.${currentUser.id}`,{method:'PATCH',body:JSON.stringify({bank_name:bankName,account_number:accountNumber,account_name:accountName})});
      } else {
        await sb('bank_details',{method:'POST',body:JSON.stringify({user_id:currentUser.id,bank_name:bankName,account_number:accountNumber,account_name:accountName})});
      }
    }

    // Save KYC details
    const kycData = {user_id:currentUser.id,date_of_birth:dateOfBirth||null,home_address:homeAddress||null,bvn:bvn||null,nin:nin||null,id_type:idType||null,id_number:idNumber||null,nok_name:nokName||null,nok_relationship:nokRel||null,nok_phone:nokPhone||null,nok_whatsapp:nokWhatsapp||null,nok_email:nokEmail||null,nok_mailing_list:nokMailingList};
    const existingKyc = await sb(`kyc_details?user_id=eq.${currentUser.id}&select=id`);
    if(existingKyc&&existingKyc.length){
      await sb(`kyc_details?user_id=eq.${currentUser.id}`,{method:'PATCH',body:JSON.stringify(kycData)});
    } else {
      await sb('kyc_details',{method:'POST',body:JSON.stringify(kycData)});
    }

    closeModal();
    toast('<i class="ti ti-check"></i> Profile details saved!');
    await renderContributor();
  }catch(e){
    err.textContent='Error saving: '+e.message;
    btn.innerHTML='<i class="ti ti-device-floppy"></i> Save details';
    btn.disabled=false;
  }
}

// ─── ANNIVERSARY & SAVINGS GOAL NOTIFICATIONS ─────────────

async function checkMilestones(totalSavings){
  try{
    const joinDate = new Date(currentUser.created_at);
    const now = new Date();
    const monthsElapsed = (now.getFullYear()-joinDate.getFullYear())*12+(now.getMonth()-joinDate.getMonth());

    // Anniversary check — every 6 months
    const anniversaryMonths = [6,12,18,24,30,36,42,48,54,60];
    for(const m of anniversaryMonths){
      if(monthsElapsed >= m){
        const key = `fundova_anniv_${currentUser.id}_${m}`;
        if(!localStorage.getItem(key)){
          localStorage.setItem(key,'1');
          const years = m/12;
          const label = m < 12 ? `${m} months` : years === 1 ? '1 year' : `${years} years`;
          await addNotification(currentUser.id,`🎉 Happy ${label} anniversary with Fundova! You have saved ${fmt(totalSavings)} since joining. Thank you for being part of our community!`);
        }
      }
    }

    // Savings goal milestone check
    if(currentUser.savings_goal && totalSavings > 0){
      const pct = (totalSavings / currentUser.savings_goal) * 100;
      const milestones = [{pct:25,label:'25%',msg:'You are a quarter of the way to your savings goal!'},{pct:50,label:'50%',msg:'Halfway there! Keep going!'},{pct:75,label:'75%',msg:'Almost there — you are 75% of the way to your goal!'},{pct:100,label:'100%',msg:'Congratulations! You have reached your savings goal! 🎉'}];
      for(const m of milestones){
        if(pct >= m.pct){
          const key = `fundova_goal_${currentUser.id}_${m.label}`;
          if(!localStorage.getItem(key)){
            localStorage.setItem(key,'1');
            await addNotification(currentUser.id,`🎯 ${m.msg} You have saved ${fmt(totalSavings)} of your ${fmt(currentUser.savings_goal)} goal.`);
          }
        }
      }
    }
  }catch(e){console.error('Milestone check error:',e);}
}

      sb(`bank_details?user_id=eq.${userId}&select=*`)
    ]);
    const k = kyc&&kyc.length?kyc[0]:{};
    const b = bank&&bank.length?bank[0]:{};

async function openContributorKyc(userId, userName){
  openModal(`<div style="text-align:center;padding:2rem;color:#888"><div class="spinner spinner-dark" style="width:18px;height:18px;margin:0 auto 10px"></div>Loading KYC...</div>`);
  try{
    const [kyc, bank, kycLog] = await Promise.all([
      sb(`kyc_details?user_id=eq.${userId}&select=*`),
      sb(`bank_details?user_id=eq.${userId}&select=*`),
      sb(`kyc_audit_log?user_id=eq.${userId}&select=*&order=changed_at.desc&limit=10`)
    ]);
    const k = kyc&&kyc.length?kyc[0]:{};
    const b = bank&&bank.length?bank[0]:{};
    const logs = kycLog||[];

    const SENSITIVE={'BVN':'bvn','NIN':'nin','ID number':'id_number'};
    const fields = [
      {label:'Bank name', val:b.bank_name},
      {label:'Account number', val:b.account_number},
      {label:'Account name', val:b.account_name},
      {label:'Date of birth', val:k.date_of_birth},
      {label:'Home address', val:k.home_address},
      {label:'BVN', val:k.bvn},
      {label:'NIN', val:k.nin},
      {label:'ID type', val:k.id_type},
      {label:'ID number', val:k.id_number},
    ];

    const completed = fields.filter(f=>f.val).length;
    const pct = Math.round((completed/fields.length)*100);

    openModal(`
    <h3>KYC details — ${userName}</h3>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
      <div style="flex:1;background:#e5e5e2;border-radius:6px;height:8px;overflow:hidden">
        <div style="height:100%;background:${pct===100?'#1D9E75':'#C9961A'};width:${pct}%"></div>
      </div>
      <span style="font-size:12px;font-weight:700;color:${pct===100?'#0F6E56':'#856404'}">${pct}% complete</span>
      ${k.kyc_verified?'<span class="status-pill pill-approved">Verified</span>':'<span class="status-pill pill-pending">Not verified</span>'}
    </div>

    <div style="display:grid;gap:6px;margin-bottom:14px">
      ${fields.map(f=>`<div style="display:flex;justify-content:space-between;padding:8px 12px;background:${f.val?'#F0FDF8':'#FEF2F2'};border-radius:8px;font-size:13px">
        <span style="color:#888">${f.label}</span>
        <span style="font-weight:500;color:${f.val?'#0D1F14':'#aaa'}">${f.val?(SENSITIVE[f.label]?maskedField(f.label,SENSITIVE[f.label],userId,f.val):f.val):'Not provided'}</span>
      </div>`).join('')}
    </div>

    ${logs.length?`
    <div style="margin-bottom:14px">
      <div style="font-size:11px;font-weight:700;color:#888;text-transform:uppercase;margin-bottom:8px">Edit history</div>
      ${logs.map(l=>{
        let detail = l.changed_fields||'Details updated';
        try{
          if(l.old_values||l.new_values){
            const ov = JSON.parse(l.old_values||'{}');
            const nv = JSON.parse(l.new_values||'{}');
            const parts = Object.keys(nv).map(k=>`${k.replace(/_/g,' ')}: "${ov[k]||'—'}" → "${nv[k]}"`);
            if(parts.length) detail = parts.join('<br>');
          }
        }catch(e){}
        return `<div style="font-size:11px;color:#888;padding:6px 10px;background:#f5f5f3;border-radius:6px;margin-bottom:4px">
        <div style="color:#aaa;margin-bottom:2px">${fmtDate(l.changed_at)}</div>${detail}
      </div>`;
      }).join('')}
    </div>`:''}

    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">Close</button>
      ${!k.kyc_verified&&pct===100?`<button class="btn btn-primary" onclick="verifyKyc('${userId}','${userName.replace(/'/g,"\'")}')"><i class="ti ti-shield-check"></i> Mark as verified</button>`:''}
      ${k.kyc_verified?`<button class="btn btn-warn" onclick="unverifyKyc('${userId}')"><i class="ti ti-shield-off"></i> Remove verification</button>`:''}
    </div>`);
  }catch(e){
    openModal(`<div style="color:#A32D2D;padding:1rem">Error loading KYC: ${e.message}</div>`);
  }
}

async function verifyKyc(userId, userName){
  try{
    await sb(`kyc_details?user_id=eq.${userId}`,{method:'PATCH',body:JSON.stringify({kyc_verified:true,verified_at:new Date().toISOString()})});
    // Notify contributor
    const userArr = await sb(`users?id=eq.${userId}&select=name,email`);
    if(userArr&&userArr.length){
      await addNotification(userId,'✅ Your KYC has been verified. Your withdrawals are now fully unlocked. Thank you for completing your profile.','kyc');
    }
    toast('<i class="ti ti-check"></i> KYC verified for '+userName);
    closeModal();
    await renderAdmin();
  }catch(e){alert('Error verifying KYC: '+e.message);}
}

async function unverifyKyc(userId){
  if(!confirm('Remove KYC verification? Member will need to be re-verified before withdrawals.'))return;
  try{
    await sb(`kyc_details?user_id=eq.${userId}`,{method:'PATCH',body:JSON.stringify({kyc_verified:false,verified_at:null})});
    toast('<i class="ti ti-check"></i> KYC verification removed.');
    closeModal();
    await renderAdmin();
  }catch(e){alert('Error: '+e.message);}
}

async function saveKycWithAudit(){
  const btn = document.getElementById('kyc-btn');
  const err = document.getElementById('kyc-err');
  btn.innerHTML='<span class="spinner"></span> Saving…';btn.disabled=true;

  try{
    const bankName = document.getElementById('kyc-bank').value.trim();
    const accountNumber = document.getElementById('kyc-anum').value.trim();
    const accountName = document.getElementById('kyc-aname').value.trim();
    const dateOfBirth = document.getElementById('kyc-dob').value;
    const homeAddress = document.getElementById('kyc-address').value.trim();
    const bvn = document.getElementById('kyc-bvn').value.trim();
    const nin = document.getElementById('kyc-nin').value.trim();
    const idType = document.getElementById('kyc-idtype').value;
    const idNumber = document.getElementById('kyc-idnum').value.trim();
    const nokName = document.getElementById('kyc-nok-name')?.value?.trim()||'';
    const nokRel = document.getElementById('kyc-nok-rel')?.value||'';
    const nokPhone = document.getElementById('kyc-nok-phone')?.value?.trim()||'';
    const nokWhatsapp = document.getElementById('kyc-nok-whatsapp')?.value?.trim()||'';
    const nokEmail = document.getElementById('kyc-nok-email')?.value?.trim()||'';
    const nokMailingList = document.getElementById('kyc-nok-mailinglist')?.checked||false;
    const gender = document.getElementById('kyc-gender')?.value || '';

    // Get existing KYC to detect changes
    const existingKyc = await sb(`kyc_details?user_id=eq.${currentUser.id}&select=*`);
    const existing = existingKyc&&existingKyc.length?existingKyc[0]:{};

    // Detect which fields changed — gender is intentionally excluded: it never affects
    // withdrawal eligibility or verification status
    const changedFields = [];
    const oldValues = {};
    const newValues = {};
    if(dateOfBirth && dateOfBirth !== existing.date_of_birth){ changedFields.push('Date of birth'); oldValues.date_of_birth=existing.date_of_birth||null; newValues.date_of_birth=dateOfBirth; }
    if(homeAddress && homeAddress !== existing.home_address){ changedFields.push('Home address'); oldValues.home_address=existing.home_address||null; newValues.home_address=homeAddress; }
    if(bvn && bvn !== existing.bvn){ changedFields.push('BVN'); oldValues.bvn=existing.bvn||null; newValues.bvn=bvn; }
    if(nin && nin !== existing.nin){ changedFields.push('NIN'); oldValues.nin=existing.nin||null; newValues.nin=nin; }
    if(idType && idType !== existing.id_type){ changedFields.push('ID type'); oldValues.id_type=existing.id_type||null; newValues.id_type=idType; }
    if(idNumber && idNumber !== existing.id_number){ changedFields.push('ID number'); oldValues.id_number=existing.id_number||null; newValues.id_number=idNumber; }

    // Save bank details
    if(bankName||accountNumber||accountName){
      const existingBank = await sb(`bank_details?user_id=eq.${currentUser.id}&select=id`);
      if(existingBank&&existingBank.length){
        await sb(`bank_details?user_id=eq.${currentUser.id}`,{method:'PATCH',body:JSON.stringify({bank_name:bankName,account_number:accountNumber,account_name:accountName})});
      } else {
        await sb('bank_details',{method:'POST',body:JSON.stringify({user_id:currentUser.id,bank_name:bankName,account_number:accountNumber,account_name:accountName})});
      }
    }

    // Save KYC — reset verification if fields changed
    const kycData = {
      user_id:currentUser.id,
      date_of_birth:dateOfBirth||existing.date_of_birth||null,
      home_address:homeAddress||existing.home_address||null,
      bvn:bvn||existing.bvn||null,
      nin:nin||existing.nin||null,
      id_type:idType||existing.id_type||null,
      id_number:idNumber||existing.id_number||null,
      gender:gender||existing.gender||null,
      kyc_verified: changedFields.length>0 ? false : (existing.kyc_verified||false),
      updated_at: new Date().toISOString()
    };

    if(existingKyc&&existingKyc.length){
      await sb(`kyc_details?user_id=eq.${currentUser.id}`,{method:'PATCH',body:JSON.stringify(kycData)});
    } else {
      await sb('kyc_details',{method:'POST',body:JSON.stringify(kycData)});
    }

    // Log changes for audit trail
    if(changedFields.length>0){
      await sb('kyc_audit_log',{method:'POST',body:JSON.stringify({
        user_id:currentUser.id,
        changed_fields:changedFields.join(', '),
        old_values:JSON.stringify(oldValues),
        new_values:JSON.stringify(newValues),
        changed_at:new Date().toISOString()
      })}).catch(()=>{});
      // Send welcome email to next of kin if opted in
    if(nokMailingList && nokEmail){
      notify({type:'nok_welcome',to:nokEmail,name:nokName,member_name:currentUser.name}).catch(e=>logSystemError('notify:nok_welcome',e));
    }
    // Notify admin of KYC update
      notify({type:'admin_kyc_update',to:'fundovamultipurposecooperative@gmail.com',
        name:currentUser.name,
        applicant_email:currentUser.email
      }).catch(e=>logSystemError('notify:kyc_update',e));
    }

    closeModal();
    toast(changedFields.length>0?
      '<i class="ti ti-check"></i> KYC updated. Admin will re-verify your details.':
      '<i class="ti ti-check"></i> Profile details saved!'
    );
    await renderContributor();
  }catch(e){
    err.textContent='Error saving: '+e.message;
    btn.innerHTML='<i class="ti ti-device-floppy"></i> Save details';
    btn.disabled=false;
  }
}

let adminNotifData = {};

async function loadAdminNotifications(){
  try{
    const [signups, withdrawals, kycPending, reservations, profiles, coordinators, deals, refunds, ajoPayouts] = await Promise.all([
      sb('signup_requests?status=eq.pending&select=id,name,created_at'),
      sb('withdrawal_requests?status=eq.pending&select=id,user_id,amount,created_at'),
      sb('kyc_details?kyc_verified=eq.false&select=id,user_id,updated_at'),
      sb('investment_reservations?status=eq.payment_made&select=id,user_id,investment_id,created_at'),
      sb('profile_update_requests?status=eq.pending&select=id,user_id,created_at'),
      sb('coordinator_applications?status=eq.pending&select=id,user_id,created_at'),
      sb('deals?status=eq.pending&select=id,user_id,title,created_at'),
      sb('investment_refund_requests?status=eq.pending&select=id,user_id,investment_id,created_at'),
      sb('group_payouts?status=eq.pending&select=id,group_id,recipient_id,amount,cycle,initiated_at'),
    ]);

    // Get user names for KYC items
    let kycUsers = {};
    if(kycPending&&kycPending.length){
      const ids = kycPending.map(k=>k.user_id).join(',');
      const users = await sb('users?id=in.('+ids+')&select=id,name');
      (users||[]).forEach(u=>{kycUsers[u.id]=u.name;});
    }

    // Get user names for reservation items
    let resUsers = {};
    let resInvs = {};
    if(reservations&&reservations.length){
      const uids = reservations.map(r=>r.user_id).join(',');
      const invids = reservations.map(r=>r.investment_id).join(',');
      const [users,invs] = await Promise.all([
        sb('users?id=in.('+uids+')&select=id,name'),
        sb('investments?id=in.('+invids+')&select=id,title')
      ]);
      (users||[]).forEach(u=>{resUsers[u.id]=u.name;});
      (invs||[]).forEach(i=>{resInvs[i.id]=i.title;});
    }

    adminNotifData = {
      signups: signups||[],
      withdrawals: withdrawals||[],
      kycPending: (kycPending||[]).map(k=>({...k,name:kycUsers[k.user_id]||'Unknown'})),
      reservations: (reservations||[]).map(r=>({...r,name:resUsers[r.user_id]||'Unknown',investment:resInvs[r.investment_id]||'Investment'})),
      profiles: profiles||[],
      coordinators: coordinators||[],
      deals: deals||[],
      refunds: refunds||[],
      ajoPayouts: ajoPayouts||[],
    };

    const total = adminNotifData.signups.length + adminNotifData.withdrawals.length +
      adminNotifData.kycPending.length + adminNotifData.reservations.length +
      adminNotifData.profiles.length + adminNotifData.coordinators.length +
      adminNotifData.deals.length + adminNotifData.refunds.length + adminNotifData.ajoPayouts.length;

    const badge = document.getElementById('admin-notif-badge');
    if(badge){
      badge.textContent = total > 99 ? '99+' : total;
      badge.style.display = total > 0 ? 'flex' : 'none';
    }

    return total;
  }catch(e){console.error('Admin notif error:',e);return 0;}
}

// ─── BIRTHDAY CONFETTI ──────────────────────────────────────
// A lightweight canvas particle celebration — runs once per calendar day even if the
// dashboard re-renders many times (e.g. after every action), guarded via localStorage.
function triggerBirthdayConfetti(){
  const todayKey = 'fundova_bday_shown_' + new Date().toDateString();
  if(localStorage.getItem(todayKey))return;
  localStorage.setItem(todayKey,'1');

  const canvas = document.createElement('canvas');
  canvas.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:9999';
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  document.body.appendChild(canvas);
  const ctx = canvas.getContext('2d');

  const colors = ['#C9961A','#0D3D2A','#1D9E75','#F7F5F0','#A32D2D','#3730A3'];
  const particles = [];
  for(let i=0;i<140;i++){
    particles.push({
      x: Math.random()*canvas.width,
      y: -20-Math.random()*canvas.height*0.5,
      w: 6+Math.random()*6,
      h: 8+Math.random()*8,
      color: colors[Math.floor(Math.random()*colors.length)],
      speedY: 2+Math.random()*3,
      speedX: (Math.random()-0.5)*2,
      rotation: Math.random()*360,
      rotSpeed: (Math.random()-0.5)*10,
      opacity: 1
    });
  }

  const startTime = Date.now();
  const duration = 4000;
  function animate(){
    const elapsed = Date.now()-startTime;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach(p=>{
      p.y += p.speedY;
      p.x += p.speedX;
      p.rotation += p.rotSpeed;
      if(elapsed>duration-800)p.opacity=Math.max(0,p.opacity-0.02);
      ctx.save();
      ctx.globalAlpha = p.opacity;
      ctx.translate(p.x,p.y);
      ctx.rotate(p.rotation*Math.PI/180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      ctx.restore();
    });
    if(elapsed<duration){
      requestAnimationFrame(animate);
    } else {
      canvas.remove();
    }
  }
  animate();
}

// ─── ADMIN CHART ──────────────────────────────────────────

function renderAdminChart(allPayments){
  const canvas = document.getElementById('admin-value-chart');
  if(!canvas) return;

  // Build monthly totals
  const months = {};
  (allPayments||[]).forEach(p=>{
    if(p.is_transfer)return; // internal relabeling, not real new value — would double-count
    const d = new Date(p.date);
    const key = d.getFullYear()+'-'+(d.getMonth()+1).toString().padStart(2,'0');
    months[key] = (months[key]||0) + Number(p.amount);
  });

  const sorted = Object.keys(months).sort();
  const last6 = sorted.slice(-6);
  const labels = last6.map(k=>{
    const [y,m] = k.split('-');
    return new Date(y,m-1,1).toLocaleDateString('en-GB',{month:'short'});
  });

  // Cumulative values — seed with everything before the displayed window so the
  // running total reflects true all-time value, not just the last 6 months
  const priorMonths = sorted.slice(0, -6);
  let running = priorMonths.reduce((sum,k)=>sum+months[k], 0);
  const vals = last6.map(k=>{ running += months[k]; return running; });

  const ctx = canvas.getContext('2d');
  const w = canvas.offsetWidth || 400;
  const h = 160;
  canvas.width = w;
  canvas.height = h;

  const pad = {top:10, right:10, bottom:30, left:55};
  const cw = w - pad.left - pad.right;
  const ch = h - pad.top - pad.bottom;

  const maxVal = Math.max(...vals, 1);
  const minVal = 0;

  ctx.clearRect(0,0,w,h);

  // Grid lines
  ctx.strokeStyle = '#f0f0ee';
  ctx.lineWidth = 1;
  for(let i=0; i<=4; i++){
    const y = pad.top + ch - (i/4)*ch;
    ctx.beginPath(); ctx.moveTo(pad.left,y); ctx.lineTo(w-pad.right,y); ctx.stroke();
    const val = (minVal + (i/4)*(maxVal-minVal));
    ctx.fillStyle = '#aaa';
    ctx.font = '10px sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText(val>=1000000?'₦'+(val/1000000).toFixed(1)+'M':val>=1000?'₦'+(val/1000).toFixed(0)+'K':'₦'+val.toFixed(0), pad.left-4, y+3);
  }

  // Area fill
  const grad = ctx.createLinearGradient(0, pad.top, 0, h-pad.bottom);
  grad.addColorStop(0, 'rgba(29,158,117,0.25)');
  grad.addColorStop(1, 'rgba(29,158,117,0)');

  ctx.beginPath();
  vals.forEach((v,i)=>{
    const x = pad.left + (i/(vals.length-1||1))*cw;
    const y = pad.top + ch - ((v-minVal)/(maxVal-minVal||1))*ch;
    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  });
  ctx.lineTo(pad.left+cw, h-pad.bottom);
  ctx.lineTo(pad.left, h-pad.bottom);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  // Line
  ctx.beginPath();
  ctx.strokeStyle = '#1D9E75';
  ctx.lineWidth = 2.5;
  ctx.lineJoin = 'round';
  vals.forEach((v,i)=>{
    const x = pad.left + (i/(vals.length-1||1))*cw;
    const y = pad.top + ch - ((v-minVal)/(maxVal-minVal||1))*ch;
    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  });
  ctx.stroke();

  // Dots + labels
  vals.forEach((v,i)=>{
    const x = pad.left + (i/(vals.length-1||1))*cw;
    const y = pad.top + ch - ((v-minVal)/(maxVal-minVal||1))*ch;
    ctx.beginPath();
    ctx.arc(x,y,4,0,Math.PI*2);
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#1D9E75';
    ctx.lineWidth = 2;
    ctx.fill(); ctx.stroke();

    ctx.fillStyle = '#888';
    ctx.font = '10px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(labels[i], x, h-pad.bottom+14);
  });

  // Last dot highlight
  if(vals.length > 0){
    const lx = pad.left + cw;
    const ly = pad.top + ch - ((vals[vals.length-1]-minVal)/(maxVal-minVal||1))*ch;
    ctx.beginPath();
    ctx.arc(lx,ly,6,0,Math.PI*2);
    ctx.fillStyle = '#1D9E75';
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.fill(); ctx.stroke();
  }
}

let realtimeChannel = null;
function startAdminRealtime(){
  // Stop any existing polling
  stopAdminRealtime();

  // Poll every 30 seconds for new notifications
  // Much more responsive than the old 25-minute refresh
  let lastCounts = {};

  async function pollForUpdates(){
    if(!currentUser||(currentUser.role!=='admin'&&currentUser.role!=='admin_view'&&currentUser.role!=='super_admin')) return;
    try{
      const [signups, withdrawals, kyc, reservations] = await Promise.all([
        sb('signup_requests?status=eq.pending&select=id'),
        sb('withdrawal_requests?status=eq.pending&select=id'),
        sb('kyc_details?kyc_verified=eq.false&select=id'),
        sb('investment_reservations?status=eq.payment_made&select=id'),
      ]);

      const counts = {
        signups: (signups||[]).length,
        withdrawals: (withdrawals||[]).length,
        kyc: (kyc||[]).length,
        reservations: (reservations||[]).length,
      };

      // Show toast if any count increased since last poll
      if(Object.keys(lastCounts).length){
        if(counts.signups > lastCounts.signups) showRealtimeToast('📋 New application received!');
        if(counts.withdrawals > lastCounts.withdrawals) showRealtimeToast('💸 New withdrawal request!');
        if(counts.kyc > lastCounts.kyc) showRealtimeToast('🔐 KYC submitted — awaiting verification!');
        if(counts.reservations > lastCounts.reservations) showRealtimeToast('📊 New investment payment!');
      }

      lastCounts = counts;
      loadAdminNotifications().catch(()=>{});
    }catch(e){}
  }

  // Poll immediately then every 30 seconds
  pollForUpdates();
  adminRefreshTimer = setInterval(pollForUpdates, 30*1000);
}

function stopAdminRealtime(){
  if(realtimeChannel){
    try{ realtimeChannel.unsubscribe(); }catch(e){}
    realtimeChannel = null;
  }
  if(adminRefreshTimer){ clearInterval(adminRefreshTimer); adminRefreshTimer=null; }
}

async function processReferralBonus(newUserId){
  try{
    // Get the new user's referred_by code
    const userArr = await sb(`users?id=eq.${newUserId}&select=referred_by,referral_bonus_paid,name`);
    if(!userArr||!userArr.length) return;
    const user = userArr[0];
    if(!user.referred_by || user.referral_bonus_paid) return;

    // Find the referrer by matching their generated referral code
    // Code = first 4 chars of name + first 4 chars of id (no hyphens), uppercase
    const allUsers = await sb('users?role=eq.contributor&select=id,name');
    const referrer = (allUsers||[]).find(u => {
      const code = generateReferralCode(u.name, u.id);
      return code === user.referred_by.toUpperCase();
    });

    if(!referrer) return;

    // Credit ₦500 to referrer as cooperative bonus
    await sb('cooperative_bonuses', {method:'POST', body:JSON.stringify({
      user_id: referrer.id,
      amount: 500,
      description: 'Referral bonus — '+user.name+' joined via your referral link',
      date: new Date().toISOString().split('T')[0],
      status: 'available'
    })});

    // Mark referral bonus as paid on new user
    await sb(`users?id=eq.${newUserId}`, {method:'PATCH', body:JSON.stringify({referral_bonus_paid:true})});

    // Notify referrer
    const referrerFull = await sb(`users?id=eq.${referrer.id}&select=name,email`);
    if(referrerFull&&referrerFull[0]){
      await addNotification(referrer.id, '🎉 You earned a ₦500 referral bonus! '+user.name+' just made their first contribution via your referral link.','referral');
    }
  }catch(e){ console.error('Referral bonus error:', e); }
}

let _foodRunning=false;
async function triggerFoodSchemeDeduction(skippedOnly=false){
  if(_foodRunning)return;
  const label=skippedOnly?'the skipped members':'everyone who is pending (opted in or skipped)';
  if(!confirm('Run the food scheme deduction for '+label+'?\n\nEach member is charged once only. Capital is used first, then interest if the capital runs out.'))return;
  _foodRunning=true;
  const result={charged:[],skipped:[],already:[],review:[],failed:[]};
  try{
    try{await sb('food_scheme_history?select=id&limit=1');}
    catch(e){alert('Nothing was charged. The food scheme history table is not set up yet. Run food_scheme_history.sql in Supabase first.');return;}
    const query=skippedOnly?'food_scheme_enrollments?status=eq.skipped&select=*':'food_scheme_enrollments?status=in.(opted_in,skipped)&select=*';
    const [enrollments,options]=await Promise.all([sb(query),sb('food_scheme_options?select=*')]);
    const optionMap={};(options||[]).forEach(o=>{optionMap[o.id]=o;});
    const ids=[...new Set((enrollments||[]).map(e=>e.user_id))];
    const users=ids.length?await sb('users?id=in.('+ids.join(',')+')&select=id,name,email'):[];
    const userMap={};(users||[]).forEach(u=>{userMap[u.id]=u;});
    const money=n=>'₦'+Number(n).toLocaleString('en-NG',{maximumFractionDigits:2});
    for(const e of (enrollments||[])){
      const u=userMap[e.user_id]||{name:'Unknown',email:''};
      const opt=optionMap[e.option_id];
      if(!opt){result.failed.push({name:u.name,why:'Their package no longer exists'});continue;}
      const price=Number(opt.price);
      const ref=e.id+'|'+(e.enrolled_at||'');
      try{
        // Never charge twice: check the history for this same enrolment first
        const prior=await sb('food_scheme_history?user_id=eq.'+encodeURIComponent(e.user_id)+'&ref=eq.'+encodeURIComponent(ref)+'&event=in.(deduction_started,deducted)&select=event');
        const evs=(prior||[]).map(x=>x.event);
        if(evs.includes('deducted')){
          await sb('food_scheme_enrollments?id=eq.'+e.id,{method:'PATCH',body:JSON.stringify({status:'deducted',deducted_at:e.deducted_at||new Date().toISOString()})});
          result.already.push({name:u.name});continue;
        }
        if(evs.includes('deduction_started')){
          result.review.push({name:u.name,why:'A deduction was started earlier but never confirmed. Check their statement before running it again.'});continue;
        }
        const pays=await sb('payments?user_id=eq.'+e.user_id+'&withdrawn=eq.false&goal_id=is.null&moved_at=is.null&select=*&order=date.asc');
        const parts=(pays||[]).map(p=>lotParts(p,null));
        const capital=+parts.reduce((a,l)=>a+l.P,0).toFixed(2);
        const interest=+parts.reduce((a,l)=>a+l.I,0).toFixed(2);
        const available=+(capital+interest).toFixed(2);
        if(available+0.005>=price){
          await foodLog(e.user_id,'deduction_started',opt,{amount:price,ref,note:'Capital '+capital.toFixed(2)+', interest '+interest.toFixed(2)});
          await deductCapitalFirst(e.user_id,pays,price,'Balance carried forward after Food Scheme ('+opt.name+')');
          await foodLog(e.user_id,'deducted',opt,{amount:price,ref,note:'Capital before '+capital.toFixed(2)+', interest before '+interest.toFixed(2)+(price>capital+0.005?'; interest used '+(price-capital).toFixed(2):'')});
          await sb('food_scheme_enrollments?id=eq.'+e.id,{method:'PATCH',body:JSON.stringify({status:'deducted',deducted_at:new Date().toISOString()})});
          result.charged.push({name:u.name,pkg:opt.name,price,usedInterest:price>capital+0.005?+(price-capital).toFixed(2):0});
          try{
            await addNotification(e.user_id,'🧺 Your food scheme payment of '+money(price)+' ('+opt.name+') has been deducted from your savings. Admin will be in touch with pickup details.','food');
          }catch(_n){}
        } else {
          const firstTime=e.status!=='skipped';
          if(firstTime){
            await sb('food_scheme_enrollments?id=eq.'+e.id,{method:'PATCH',body:JSON.stringify({status:'skipped'})});
            foodLogSafe(e.user_id,'skipped',opt,{amount:price,ref,note:'Available '+available.toFixed(2)+' (capital '+capital.toFixed(2)+', interest '+interest.toFixed(2)+')'});
            try{
              await addNotification(e.user_id,'⚠️ Your food scheme deduction could not be processed — your available savings of '+money(available)+' is not enough for the '+opt.name+' ('+money(price)+'). Please top up your savings to qualify.','food');
            }catch(_n){}
          }
          result.skipped.push({name:u.name,pkg:opt.name,price,available});
        }
      }catch(err){
        result.failed.push({name:u.name,why:(err&&err.message)||'Unknown error'});
        foodLogSafe(e.user_id,'deduction_failed',opt,{amount:price,ref,note:String((err&&err.message)||'').slice(0,300)});
      }
    }
    const li=(arr,fn)=>arr.length?'<ul style="margin:4px 0 10px 18px;padding:0;font-size:13px">'+arr.map(x=>'<li>'+fn(x)+'</li>').join('')+'</ul>':'';
    const sec=(title,color,arr,fn)=>arr.length?`<div style="font-weight:600;color:${color};margin-top:8px">${title} (${arr.length})</div>${li(arr,fn)}`:'';
    openModal(`
    <h3>Food scheme deduction finished</h3>
    <div style="font-size:13px;color:#555;margin-bottom:6px">Charged ${result.charged.length} · Skipped ${result.skipped.length} · Already done ${result.already.length}${result.review.length?` · Need checking ${result.review.length}`:''}${result.failed.length?` · Failed ${result.failed.length}`:''}</div>
    ${sec('Charged','#0F6E56',result.charged,x=>_stEsc(x.name)+' — '+_stEsc(x.pkg)+' '+money(x.price)+(x.usedInterest?' (including '+money(x.usedInterest)+' of interest, as capital ran out)':''))}
    ${sec('Skipped: not enough savings','#A32D2D',result.skipped,x=>_stEsc(x.name)+' — needs '+money(x.price)+' for '+_stEsc(x.pkg)+', has '+money(x.available)+' available')}
    ${sec('Already deducted earlier (not charged again)','#555',result.already,x=>_stEsc(x.name))}
    ${sec('Need checking, nothing was charged','#856404',result.review,x=>_stEsc(x.name)+' — '+_stEsc(x.why))}
    ${sec('Failed, nothing further was charged','#A32D2D',result.failed,x=>_stEsc(x.name)+' — '+_stEsc(x.why))}
    <div class="modal-footer"><button class="btn btn-primary" onclick="closeModal();renderAdmin()">Close</button></div>`);
  }catch(e){ alert('Error: '+e.message); }
  finally{ _foodRunning=false; }
}

        <div style="font-size:12px;color:#666;margin-bottom:10px">${pkg.description||''}</div>
        <div style="display:flex;gap:6px">
          <button class="btn btn-sm btn-primary" onclick="openEditFoodPackage('${pkg.id}')" style="flex:1"><i class="ti ti-pencil"></i> Edit</button>
          <button class="btn btn-sm" onclick="uploadFoodPackageImage('${pkg.id}')" style="flex:1"><i class="ti ti-photo"></i> Upload image</button>
        </div>
      </div>`;
    }).join('');
    return `<div>
      <div class="card" style="margin-bottom:1rem">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem">
          <h3 style="margin:0">Food Scheme Packages</h3>
          <button class="btn btn-sm btn-primary" onclick="openAddFoodPackage()"><i class="ti ti-plus"></i> Add package</button>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem">
          ${pkgCards||'<div class="empty">No packages yet. Add one above.</div>'}
        </div>
      </div>

      <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:8px">
        <h3 style="margin:0">Enrollments & Deductions</h3>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-sm" onclick="openFoodSchemeSettings()"><i class="ti ti-clock"></i> Set deadline</button>
          <button class="btn btn-sm" onclick="downloadFoodList()"><i class="ti ti-download"></i> Download list (CSV)</button>
          <button class="btn btn-sm" onclick="openFoodHistory()"><i class="ti ti-history"></i> History</button>
          ${pending.length?`<button class="btn btn-sm btn-primary" onclick="triggerFoodSchemeDeduction(false)"><i class="ti ti-bolt"></i> Trigger deduction (${pending.length})</button>`:''}
          ${nSkipped>0?`<button class="btn btn-sm btn-warn" onclick="triggerFoodSchemeDeduction(true)"><i class="ti ti-refresh"></i> Retrigger skipped (${nSkipped})</button>`:''}
        </div>
      </div>
      ${deadline?`<div style="background:#FEF3C7;border-radius:8px;padding:8px 12px;font-size:12px;color:#856404;margin-bottom:12px"><i class="ti ti-clock"></i> Opt-in deadline: <strong>${deadline.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}</strong></div>`:''}
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem;margin-bottom:.4rem">
        <div style="background:#E8F5EE;border-radius:10px;padding:12px;text-align:center"><div style="font-size:22px;font-weight:800;color:#065F46">${nWaiting}</div><div style="font-size:12px;color:#065F46">Waiting to be charged</div></div>
        <div style="background:#FEE2E2;border-radius:10px;padding:12px;text-align:center"><div style="font-size:22px;font-weight:800;color:#A32D2D">${nSkipped}</div><div style="font-size:12px;color:#A32D2D">Skipped (not enough)</div></div>
        <div style="background:#D1FAE5;border-radius:10px;padding:12px;text-align:center"><div style="font-size:22px;font-weight:800;color:#0F6E56">${done.length}</div><div style="font-size:12px;color:#0F6E56">Deducted</div></div>
      </div>
      <div style="font-size:12px;color:#888;text-align:center;margin-bottom:1rem">${(enrollments||[]).length} contributor${(enrollments||[]).length!==1?'s':''} in the scheme. Deducted members move to the Completed list below and are never charged again.</div>

      <div style="font-size:13px;font-weight:700;color:#0D1F14;margin:6px 0">Pending (${pending.length})</div>
      ${pendRows?`<div class="table-wrap"><table>
        <tr><th>Contributor</th><th>Package</th><th>Cost</th><th>Capital</th><th>Interest</th><th>Available</th><th>Status</th></tr>
        ${pendRows}
      </table></div><div style="font-size:11px;color:#888;margin-top:6px">Available = capital plus interest. Capital is used first, and interest only if capital runs out.</div>`:'<div class="empty">Nobody is waiting. Everyone has been charged.</div>'}

      <details style="margin-top:1.2rem" ${pending.length?'':'open'}>
        <summary style="cursor:pointer;font-size:13px;font-weight:700;color:#0D1F14">Completed (${done.length})</summary>
        ${doneRows?`<div class="table-wrap" style="margin-top:8px"><table>
          <tr><th>Contributor</th><th>Package</th><th>Deducted</th><th>Date</th><th>Balance now</th><th>Status</th></tr>
          ${doneRows}
        </table></div>`:'<div class="empty" style="margin-top:8px">Nobody has been deducted yet.</div>'}
      </details>
    </div>
    </div>`;
  }catch(e){ return `<div class="card"><div class="empty">Error loading food scheme: ${e.message}</div></div>`; }
}

async function openFoodSchemeSettings(){
  const settings = await sb('food_scheme_settings?select=*&order=created_at.desc&limit=1');
  const s = settings&&settings.length?settings[0]:null;
  const current = s&&s.opt_in_deadline?s.opt_in_deadline.substring(0,16):'';
  openModal(`
  <h3>Food Scheme Settings</h3>
  <div class="field">
    <label>Opt-in deadline</label>
    <input id="fs-deadline" type="datetime-local" value="${current}">
    <div style="font-size:11px;color:#888;margin-top:4px">After this date, contributors cannot opt in or change their package.</div>
  </div>
  <div class="modal-footer">
    <button class="btn" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" onclick="saveFoodSchemeSettings()"><i class="ti ti-device-floppy"></i> Save settings</button>
  </div>`);
}

async function saveFoodSchemeSettings(){
  const deadline = document.getElementById('fs-deadline').value;
  try{
    const existing = await sb('food_scheme_settings?select=id');
    if(existing&&existing.length){
      await sb('food_scheme_settings?id=eq.'+existing[0].id, {method:'PATCH', body:JSON.stringify({opt_in_deadline:deadline||null})});
    } else {
      await sb('food_scheme_settings', {method:'POST', body:JSON.stringify({opt_in_deadline:deadline||null})});
    }
    closeModal();
    toast('<i class="ti ti-check"></i> Settings saved!');
    renderAdmin();
  }catch(e){ alert('Error: '+e.message); }
}

// ─── FOOD SCHEME PACKAGE MANAGEMENT ─────────────────────

async function openEditFoodPackage(pkgId){
  const opts = await sb('food_scheme_options?id=eq.'+pkgId+'&select=*');
  const pkg = opts&&opts[0]?opts[0]:{};
  openModal(`
  <h3>Edit package</h3>
  <div class="field"><label>Package name</label><input id="fp-name" value="${pkg.name||''}" placeholder="e.g. Basic Basket"></div>
  <div class="field"><label>Price (₦)</label><input id="fp-price" type="number" value="${pkg.price||''}" placeholder="e.g. 15000"></div>
  <div class="field"><label>Description</label><textarea id="fp-desc" rows="3" placeholder="Describe what's in this package">${pkg.description||''}</textarea></div>
  <div class="field">
    <label>Active</label>
    <select id="fp-active" style="width:100%;padding:10px;border:1.5px solid #e5e5e2;border-radius:8px;font-size:14px">
      <option value="true" ${pkg.active?'selected':''}>Active — visible to contributors</option>
      <option value="false" ${!pkg.active?'selected':''}>Hidden — not visible</option>
    </select>
  </div>
  <div class="error" id="fp-err"></div>
  <div class="modal-footer">
    <button class="btn btn-danger" onclick="deleteFoodPackage('${pkgId}')">Delete</button>
    <button class="btn" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" onclick="saveFoodPackage('${pkgId}')"><i class="ti ti-device-floppy"></i> Save</button>
  </div>`);
}

async function openAddFoodPackage(){
  openModal(`
  <h3>Add new package</h3>
  <div class="field"><label>Package name</label><input id="fp-name" placeholder="e.g. Premium Basket"></div>
  <div class="field"><label>Price (₦)</label><input id="fp-price" type="number" placeholder="e.g. 40000"></div>
  <div class="field"><label>Description</label><textarea id="fp-desc" rows="3" placeholder="Describe what's in this package"></textarea></div>
  <div class="error" id="fp-err"></div>
  <div class="modal-footer">
    <button class="btn" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" onclick="saveFoodPackage(null)"><i class="ti ti-plus"></i> Add package</button>
  </div>`);
}

async function saveFoodPackage(pkgId){
  const name = document.getElementById('fp-name').value.trim();
  const price = parseFloat(document.getElementById('fp-price').value);
  const desc = document.getElementById('fp-desc').value.trim();
  const active = document.getElementById('fp-active')?.value !== 'false';
  const err = document.getElementById('fp-err');

  if(!name){err.textContent='Please enter a package name.';return;}
  if(!price||price<=0){err.textContent='Please enter a valid price.';return;}

  try{
    if(pkgId){
      await sb('food_scheme_options?id=eq.'+pkgId, {method:'PATCH', body:JSON.stringify({name,price,description:desc,active})});
      toast('<i class="ti ti-check"></i> Package updated!');
    } else {
      await sb('food_scheme_options', {method:'POST', body:JSON.stringify({name,price,description:desc,active:true})});
      toast('<i class="ti ti-check"></i> Package added!');
    }
    closeModal();
    renderAdmin();
  }catch(e){ err.textContent='Error saving: '+e.message; }
}

async function deleteFoodPackage(pkgId){
  if(!confirm('Delete this package? This cannot be undone.')) return;
  try{
    await sb('food_scheme_options?id=eq.'+pkgId, {method:'DELETE'});
    closeModal();
    toast('<i class="ti ti-check"></i> Package deleted.');
    renderAdmin();
  }catch(e){ alert('Error: '+e.message); }
}

function uploadFoodPackageImage(pkgId){
  // Create a hidden file input and trigger it
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.onchange = async (e) => {
    const file = e.target.files[0];
    if(!file) return;
    if(file.size > 2*1024*1024){ alert('Image must be under 2MB.'); return; }

    const reader = new FileReader();
    reader.onload = async (ev) => {
      try{
        // Upload to Supabase Storage
        const fileName = 'food-scheme/'+pkgId+'-'+Date.now()+'.'+file.name.split('.').pop();
        const res = await fetch(SB_URL+'/storage/v1/object/fundova-media/'+fileName, {
          method:'POST',
          headers:{'Authorization':'Bearer '+SB_KEY,'apikey':SB_KEY,'Content-Type':file.type,'x-upsert':'true'},
          body:file
        });

        if(res.ok){
          const imageUrl = SB_URL+'/storage/v1/object/public/fundova-media/'+fileName;
          await sb('food_scheme_options?id=eq.'+pkgId, {method:'PATCH', body:JSON.stringify({image_url:imageUrl})});
          toast('<i class="ti ti-check"></i> Image uploaded!');
          renderAdmin();
        } else {
          // If storage fails, use base64 preview stored differently
          // Fall back to just showing a success toast and note
          alert('Image upload requires Supabase Storage to be configured. Contact your developer to set up the storage bucket.');
        }
      }catch(err){ alert('Error uploading: '+err.message); }
    };
    reader.readAsDataURL(file);
  };
  input.click();
}


// ─── BIRTHDAY WISHES ─────────────────────────────────────

async function checkBirthday(){
  try{
    const kycArr = await sb('kyc_details?user_id=eq.'+currentUser.id+'&select=date_of_birth');
    if(!kycArr||!kycArr.length||!kycArr[0].date_of_birth) return;

    const dob = new Date(kycArr[0].date_of_birth);
    const today = new Date();

    // Check if today is their birthday (day and month match)
    if(dob.getDate() !== today.getDate() || dob.getMonth() !== today.getMonth()) return;

    // Check if we already wished them this year
    const key = 'fundova_bday_'+currentUser.id+'_'+today.getFullYear();
    if(localStorage.getItem(key)) return;

    // Mark as done for this year
    localStorage.setItem(key, '1');

    // Send notification
    await addNotification(currentUser.id,
      '🎂 Happy Birthday, '+currentUser.name.split(' ')[0]+'! Wishing you a wonderful day filled with joy. From all of us at Fundova — thank you for being part of our community! 💚'
    );

    // Send birthday email
    notify({
      type:'birthday',
      to:currentUser.email,
      name:currentUser.name
    }).catch(()=>{});

    // Show birthday toast
    setTimeout(()=>{
      toast('🎂 Happy Birthday, '+currentUser.name.split(' ')[0]+'! 🎉');
    }, 2000);

  }catch(e){ console.error('Birthday check error:', e); }
}
