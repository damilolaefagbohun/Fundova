let surplusContributors = [];
let surplusTotalSavings = 0;

async function previewSurplus(){
  const amount = parseFloat(document.getElementById('sd-amount')?.value || 0);
  const preview = document.getElementById('sd-preview');
  const totalEl = document.getElementById('sd-total');
  const countEl = document.getElementById('sd-count');
  if(!preview)return;

  if(!surplusContributors.length){
    try{
      const [contributors, payments] = await Promise.all([
        sb('users?role=eq.contributor&select=id,name,email'),
        sb('payments?withdrawn=eq.false&moved_at=is.null&select=user_id,amount')
      ]);
      surplusContributors = contributors || [];
      // Calculate each contributor's savings
      surplusContributors = surplusContributors.map(c => {
        const cPayments = (payments||[]).filter(p => p.user_id === c.id);
        const savings = cPayments.reduce((a,p) => a + Number(p.amount), 0);
        return {...c, savings};
      }).filter(c => c.savings > 0);
      surplusTotalSavings = surplusContributors.reduce((a,c) => a + c.savings, 0);
    }catch(e){}
  }

  if(amount > 0 && preview){
    totalEl.textContent = fmt(amount);
    countEl.textContent = surplusContributors.length;
    preview.style.display = 'block';
  }
}

async function processSurplusDistribution(){
  const amount = parseFloat(document.getElementById('sd-amount').value);
  const description = document.getElementById('sd-desc').value.trim();
  const err = document.getElementById('sd-err');
  const btn = document.getElementById('sd-btn');

  if(!amount||amount<=0){err.textContent='Please enter a valid amount.';return;}
  if(!description){err.textContent='Please enter a description.';return;}
  if(!surplusContributors.length){err.textContent='No eligible contributors found.';return;}
  if(!confirm(`Distribute ${fmt(amount)} to ${surplusContributors.length} contributors? This cannot be undone.`))return;

  btn.innerHTML='<span class="spinner"></span> Distributing…';btn.disabled=true;

  try{
    const today = new Date().toISOString().split('T')[0];
    let distributed = 0;

    for(const c of surplusContributors){
      const share = +((c.savings / surplusTotalSavings) * amount).toFixed(2);
      if(share > 0){
        await sb('cooperative_bonuses', {method:'POST', body:JSON.stringify({
          user_id: c.id,
          amount: share,
          description,
          date: today,
          status: 'available'
        })});
        distributed++;
      }
      btn.innerHTML = `<span class="spinner"></span> Distributing… ${distributed}/${surplusContributors.length}`;
    }

    surplusContributors = [];
    surplusTotalSavings = 0;
    closeModal();
    toast(`<i class="ti ti-check"></i> Surplus distributed to ${distributed} contributors!`);
    await renderAdmin();
  }catch(e){
    err.textContent = 'Error distributing: '+e.message;
    btn.innerHTML = '<i class="ti ti-gift"></i> Distribute surplus';
    btn.disabled = false;
  }
}

async function rollBonusToSavings(){
  if(!confirm('Add your cooperative bonus to your savings balance? It will start earning 10% interest immediately.'))return;
  try{
    const bonuses = await sb(`cooperative_bonuses?user_id=eq.${currentUser.id}&status=eq.available&select=*`);
    const total = (bonuses||[]).reduce((a,b)=>a+Number(b.amount),0);
    const today = new Date().toISOString().split('T')[0];
    // Credit to savings
    await sb('payments',{method:'POST',body:JSON.stringify({user_id:currentUser.id,amount:total,date:today,withdrawn:false})});
    // Mark bonuses as used
    for(const b of bonuses){
      await sb(`cooperative_bonuses?id=eq.${b.id}`,{method:'PATCH',body:JSON.stringify({status:'rolled_to_savings'})});
    }
    toast('<i class="ti ti-check"></i> Bonus added to your savings and now earning interest!');
    await renderContributor();
  }catch(e){alert('Error: '+e.message);}
}

async function withdrawBonus(){
  try{
    const bonuses = await sb(`cooperative_bonuses?user_id=eq.${currentUser.id}&status=eq.available&select=*`);
    const total = (bonuses||[]).reduce((a,b)=>a+Number(b.amount),0);
    if(total<5000){alert(`Minimum withdrawal amount is ₦5,000. Your available bonus total is currently ${fmt(total)}.`);return;}

    // Same KYC-completeness gate as a regular withdrawal — bonuses shouldn't bypass this
    const [kyc,bank]=await Promise.all([
      sb('kyc_details?user_id=eq.'+currentUser.id+'&select=*'),
      sb('bank_details?user_id=eq.'+currentUser.id+'&select=*')
    ]);
    const k=kyc&&kyc.length?kyc[0]:{};
    const b=bank&&bank.length?bank[0]:{};
    const complete=!!(b.bank_name&&k.date_of_birth&&k.home_address&&k.bvn&&k.nin&&k.id_type);
    if(!complete){
      openModal(`
      <h3>Complete your KYC first</h3>
      <p style="font-size:13px;color:#666;margin-top:-6px">You need to complete your profile and KYC before requesting a withdrawal — including a bonus withdrawal.</p>
      <div style="display:grid;gap:8px;margin:1rem 0">
        ${[
          {label:'Bank details',done:!!(b.bank_name)},
          {label:'Date of birth',done:!!(k.date_of_birth)},
          {label:'Home address',done:!!(k.home_address)},
          {label:'BVN',done:!!(k.bvn)},
          {label:'NIN',done:!!(k.nin)},
          {label:'Government ID',done:!!(k.id_type)},
        ].map(f=>`<div style="display:flex;align-items:center;gap:8px;font-size:13px;color:${f.done?'#065F46':'#888'}">
          <span>${f.done?'✅':'⬜'}</span>${f.label}
        </div>`).join('')}
      </div>
      <div class="modal-footer">
        <button class="btn" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="closeModal();openKycForm()"><i class="ti ti-edit"></i> Complete KYC now</button>
      </div>`);
      return;
    }

    if(!confirm('Request withdrawal of your cooperative bonus? Admin will process the transfer.'))return;
    // Create withdrawal request
    await sb('withdrawal_requests',{method:'POST',body:JSON.stringify({user_id:currentUser.id,amount:total,note:'Cooperative bonus withdrawal',status:'pending'})});
    notify({type:'admin_withdrawal_request',name:currentUser.name,amount:total,note:'Cooperative bonus withdrawal'}).catch(e=>logSystemError('notify:bonus_withdrawal_request',e));
    // Mark bonuses as pending withdrawal
    for(const b of bonuses){
      await sb(`cooperative_bonuses?id=eq.${b.id}`,{method:'PATCH',body:JSON.stringify({status:'withdrawal_requested'})});
    }
    toast('<i class="ti ti-check"></i> Withdrawal request submitted. Admin will process shortly.');
    await renderContributor();
  }catch(e){alert('Error: '+e.message);}
}


// ─── COORDINATOR INTEREST BONUS ───────────────────────────

async function calculateAndCreditCoordinatorBonus(groupId, coordinatorId, payoutAmount, daysHeld){
  try{
    // Calculate interest the payout amount would have generated
    const weekdays = Math.round(daysHeld * 5/7); // approximate weekdays
    const interestGenerated = payoutAmount * 0.10 * (weekdays / 261);
    const coordinatorBonus = +(interestGenerated * 0.50).toFixed(2);

    if(coordinatorBonus <= 0)return;

    const today = new Date().toISOString().split('T')[0];
    // Credit to coordinators savings
    await sb('payments',{method:'POST',body:JSON.stringify({
      user_id: coordinatorId,
      amount: coordinatorBonus,
      date: today,
      withdrawn: false
    })});

    // Record in coordinator earnings table
    await sb('coordinator_earnings',{method:'POST',body:JSON.stringify({
      group_id: groupId,
      coordinator_id: coordinatorId,
      payout_amount: payoutAmount,
      days_held: daysHeld,
      interest_generated: +interestGenerated.toFixed(2),
      bonus_amount: coordinatorBonus,
      date: today
    })});

    console.log('Coordinator bonus credited:', coordinatorBonus);
  }catch(e){console.error('Coordinator bonus error:',e);}
}

// Update initiateGroupPayout to calculate and credit bonus
async function initiateGroupPayout(groupId,memberId,memberName,amount,cycle,override){
  const confirmMsg=override
    ?`This member is not next in the payout order. Override and pay ${fmt(amount)} to ${memberName} out of turn for Cycle ${cycle}?`
    :`Initiate payout of ${fmt(amount)} to ${memberName} for Cycle ${cycle}?`;
  if(!confirm(confirmMsg))return;
  try{
    const today = new Date().toISOString().split('T')[0];

    // Find when this members contribution was recorded to calculate days held
    const contributions = await sb(`group_contributions?group_id=eq.${groupId}&member_id=eq.${memberId}&cycle=eq.${cycle}&status=eq.paid&select=*`);
    let daysHeld = 5; // default 5 days if no contribution record
    if(contributions && contributions.length){
      const contribDate = new Date(contributions[0].date);
      const payoutDate = new Date(today);
      const diffTime = Math.abs(payoutDate - contribDate);
      daysHeld = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
    }

    await sb('group_payouts',{method:'POST',body:JSON.stringify({
      group_id:groupId,recipient_id:memberId,amount,cycle,
      status:'completed',initiated_at:today,processed_at:today
    })});

    // Get group to find coordinator
    const groups = await sb(`savings_groups?id=eq.${groupId}&select=coordinator_id`);
    if(groups && groups.length){
      await calculateAndCreditCoordinatorBonus(groupId, groups[0].coordinator_id, amount, daysHeld);
    }

    toast('<i class="ti ti-check"></i> Payout recorded for '+memberName+'. Please process the bank transfer manually.');
    await (window.location.pathname==='/ajo'?renderAjoPage():renderContributor());
  }catch(e){alert('Error initiating payout: '+e.message);}
}

async function renderCoordinatorEarnings(){

    if(!earnings||!earnings.length)return'';

    const totalBonus = earnings.reduce((a,e)=>a+Number(e.bonus_amount),0);
    const thisMonth = new Date().toISOString().slice(0,7);
    const monthBonus = earnings.filter(e=>e.date.startsWith(thisMonth)).reduce((a,e)=>a+Number(e.bonus_amount),0);

async function inviteGroupMember(groupId){
  const name = document.getElementById('inv-name').value.trim();
  const email = document.getElementById('inv-email').value.trim().toLowerCase();
  const contribution_amount = parseFloat(document.getElementById('inv-amount').value);
  const payout_order = parseInt(document.getElementById('inv-order').value)||null;
  const err = document.getElementById('inv-err');
  const btn = document.getElementById('inv-btn');

  if(!name||!email||!contribution_amount){err.textContent='Name, email and contribution amount are required.';return;}
  btn.innerHTML='<span class="spinner"></span> Sending…';btn.disabled=true;

  try{
    const [groupArr,activeMembers]=await Promise.all([
      sb(`savings_groups?id=eq.${groupId}&select=name,max_members`),
      sb(`group_members?group_id=eq.${groupId}&status=eq.active&select=id`)
    ]);
    const maxMembers=groupArr&&groupArr.length?groupArr[0].max_members:null;
    if(maxMembers&&activeMembers&&activeMembers.length>=maxMembers){
      err.textContent=`This group is full (${activeMembers.length}/${maxMembers}). Edit the group to raise the member cap first.`;
      btn.innerHTML='<i class="ti ti-send"></i> Send invitation';btn.disabled=false;return;
    }
    // Check if already a contributor
    const existing = await sb(`users?email=eq.${email}&role=eq.contributor&select=id`);

    if(existing && existing.length){
      // Already a contributor — add directly to group
      await sb('group_members',{method:'POST',body:JSON.stringify({
        group_id:groupId, user_id:existing[0].id,
        contribution_amount, payout_order, status:'active'
      })});
      closeModal();
      toast('<i class="ti ti-check"></i> Member added to group directly — they are already a Fundova contributor!');
    } else {
      // Not a contributor — save pending invitation and send email
      const groupName = groupArr&&groupArr.length?groupArr[0].name:'your group';

      await sb('group_invitations',{method:'POST',body:JSON.stringify({
        group_id:groupId, coordinator_id:currentUser.id,
        invitee_name:name, invitee_email:email,
        contribution_amount, payout_order,
        referred_by:currentUser.name,
        status:'pending'
      })});

      // Send invitation email
      await fetch('/.netlify/functions/send-email',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          type:'group_invitation',
          to:email, name, coordinator_name:currentUser.name,
          group_name:groupName
        })
      });

      closeModal();
      toast('<i class="ti ti-check"></i> Invitation sent to '+name+'! They will receive an email to sign up on Fundova.');
    }
    await (window.location.pathname==='/ajo'?renderAjoPage():renderContributor());
  }catch(e){
    err.textContent='Error: '+e.message;
    btn.innerHTML='<i class="ti ti-send"></i> Send invitation';
    btn.disabled=false;
  }
}

function generateReferralCode(name, userId){
  const namepart = name.replace(/[^a-zA-Z]/g,'').substring(0,4).toUpperCase();
  const idpart = userId.replace(/-/g,'').substring(0,4).toUpperCase();
  return namepart + idpart;
}

function getRefFromUrl(){
  const params = new URLSearchParams(window.location.search);
  return params.get('ref') || '';
}

// ─── NOTIFICATION CENTRE ──────────────────────────────────

let notifCount = 0;

async function loadNotifications(){
  try{
    const notifs = await sb(`notifications?user_id=eq.${currentUser.id}&select=*&order=created_at.desc&limit=20`);
    notifCount = (notifs||[]).filter(n=>!n.read).length;
    updateNotifBadge();
    return notifs||[];
  }catch(e){return[];}
}

function updateNotifBadge(){
  const badge = document.getElementById('notif-badge');
  if(badge){
    badge.textContent = notifCount > 9 ? '9+' : notifCount;
    badge.style.display = notifCount > 0 ? 'flex' : 'none';
  }
}

async function openNotifications(){
  const panel = document.getElementById('notif-panel');
  if(!panel)return;
  const isOpen = panel.style.display !== 'none';
  panel.style.display = isOpen ? 'none' : 'block';
  if(!isOpen){
    panel.innerHTML = '<div style="padding:1rem;text-align:center;color:#888"><div class="spinner spinner-dark" style="width:16px;height:16px;display:inline-block"></div></div>';
    const notifs = await loadNotifications();
    if(!notifs.length){
      panel.innerHTML = '<div style="padding:2rem;text-align:center;color:#888"><i class="ti ti-bell-off" style="font-size:28px;display:block;margin-bottom:8px"></i>No notifications yet</div>';
      return;
    }
    panel.innerHTML = notifs.map(n=>`
      <div style="padding:12px 14px;border-bottom:1px solid #f0f0ee;display:flex;gap:10px;align-items:flex-start;background:${n.read?'#fff':'#F0FDF8'}">
        <div style="width:8px;height:8px;border-radius:50%;background:${n.read?'#ddd':'#1D9E75'};margin-top:5px;flex-shrink:0"></div>
        <div style="flex:1">
          <div style="font-size:13px;color:#1a1a1a;margin-bottom:2px">${n.message}</div>
          <div style="font-size:11px;color:#aaa">${fmtDate(n.created_at)}</div>
        </div>
      </div>`).join('');
    // Mark all as read
    await sb(`notifications?user_id=eq.${currentUser.id}&read=eq.false`,{method:'PATCH',body:JSON.stringify({read:true})}).catch(()=>{});
    notifCount = 0;
    updateNotifBadge();
  }
}

async function addNotification(userId, message){
  try{
    await sb('notifications',{method:'POST',body:JSON.stringify({user_id:userId,message,read:false})});
  }catch(e){console.error('Notification error:',e);}
}

async function buildAnalyticsTab(){
  try{
    const [contributors, allPayments, requests, investments, groups, groupMembers, foodEnrollments, foodOptions] = await Promise.all([
      sb('users?role=eq.contributor&select=id,created_at'),
      sb('payments?select=*&order=date.asc'),
      sb('withdrawal_requests?select=*'),
      sb('investments?select=*'),
      sb('savings_groups?select=*'),
      sb('group_members?select=*'),
      sb('food_scheme_enrollments?select=*'),
      sb('food_scheme_options?select=*')
    ]);

    const totalMembers = (contributors||[]).length;
    const activePayments = (allPayments||[]).filter(p=>!p.withdrawn && !p.moved_at);
    const totalSavings = activePayments.reduce((a,p)=>a+Number(p.amount),0);
    const lifetimeInflow = (allPayments||[]).filter(p=>!p.is_transfer).reduce((a,p)=>a+Number(p.amount),0);
    const totalWithdrawn = (requests||[]).filter(r=>r.status==='approved').reduce((a,r)=>a+Number(r.amount),0);
    const pendingWithdrawals = (requests||[]).filter(r=>r.status==='pending').length;
    const totalInterest = activePayments.reduce((a,p)=>a+calcAccruedInterest(p.amount,p.date),0);

    // Monthly inflow data (last 6 months)
    const months = [];
    for(let i=5;i>=0;i--){
      const d = new Date();
      d.setDate(1); // prevent month overflow
      d.setMonth(d.getMonth()-i);
      const year = d.getFullYear();
      const month = String(d.getMonth()+1).padStart(2,'0');
      const key = year+'-'+month;
      const label = d.toLocaleString('default',{month:'short'});
      const inflow = (allPayments||[]).filter(p=>!p.is_transfer&&p.date&&p.date.startsWith(key)).reduce((a,p)=>a+Number(p.amount),0);
      months.push({label,inflow,key});

    // Member growth (last 6 months)
    const memberGrowth = months.map(m=>{
      const count = (contributors||[]).filter(c=>c.created_at&&c.created_at.startsWith(m.key)).length;
      return{...m,count};
    });

    const maxInflow = Math.max(...months.map(m=>m.inflow),1);
    const maxCount = Math.max(...memberGrowth.map(m=>m.count),1);

    return`<div>
      <!-- Stats cards -->
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:1.5rem">
        ${[
          {label:'Total members',val:totalMembers,color:'#0D3D2A',icon:'ti-users'},
          {label:'Current savings',val:fmt(totalSavings),color:'#185FA5',icon:'ti-currency-naira'},
          {label:'Lifetime inflow',val:fmt(lifetimeInflow),color:'#065F46',icon:'ti-trending-up'},
          {label:'Interest accrued',val:fmt(totalInterest),color:'#856404',icon:'ti-percentage'},
          {label:'Total withdrawn',val:fmt(totalWithdrawn),color:'#991B1B',icon:'ti-cash'},
          {label:'Pending withdrawals',val:pendingWithdrawals,color:pendingWithdrawals>0?'#991B1B':'#065F46',icon:'ti-clock'},
        ].map(s=>`<div style="background:#fff;border-radius:14px;padding:1.25rem;box-shadow:0 1px 6px rgba(0,0,0,.06)">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
            <div style="font-size:11px;color:#888;font-weight:500;text-transform:uppercase;letter-spacing:.04em">${s.label}</div>
            <i class="ti ${s.icon}" style="color:${s.color};font-size:18px"></i>
          </div>
          <div style="font-size:22px;font-weight:800;color:${s.color}">${s.val}</div>
        </div>`).join('')}
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;margin-bottom:1.25rem">
        <!-- Monthly inflow chart -->
        <div style="background:#fff;border-radius:14px;padding:1.25rem;box-shadow:0 1px 6px rgba(0,0,0,.06)">
          <div style="font-size:13px;font-weight:600;color:#1a1a1a;margin-bottom:1rem">Monthly inflow (last 6 months)</div>
          <div style="display:flex;align-items:flex-end;gap:8px;height:120px">
            ${months.map(m=>{
              const h = Math.max(8,Math.round((m.inflow/maxInflow)*110));
              return`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px">
                <div style="font-size:9px;color:#888">${m.inflow>0?'₦'+Math.round(m.inflow/1000)+'k':''}</div>
                <div style="width:100%;background:#1D9E75;border-radius:4px 4px 0 0;height:${h}px;transition:height .3s"></div>
                <div style="font-size:10px;color:#888">${m.label}</div>
              </div>`;
            }).join('')}
          </div>
        </div>

        <!-- Member growth chart -->
        <div style="background:#fff;border-radius:14px;padding:1.25rem;box-shadow:0 1px 6px rgba(0,0,0,.06)">
          <div style="font-size:13px;font-weight:600;color:#1a1a1a;margin-bottom:1rem">New members (last 6 months)</div>
          <div style="display:flex;align-items:flex-end;gap:8px;height:120px">
            ${memberGrowth.map(m=>{
              const h = Math.max(8,Math.round((m.count/maxCount)*110));
              return`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px">
                <div style="font-size:9px;color:#888">${m.count>0?m.count:''}</div>
                <div style="width:100%;background:#0D3D2A;border-radius:4px 4px 0 0;height:${h}px"></div>
                <div style="font-size:10px;color:#888">${m.label}</div>
              </div>`;
            }).join('')}
          </div>
        </div>
      </div>

      <!-- Savings breakdown pie-style -->
      <div style="background:#fff;border-radius:14px;padding:1.25rem;box-shadow:0 1px 6px rgba(0,0,0,.06)">
        <div style="font-size:13px;font-weight:600;color:#1a1a1a;margin-bottom:1rem">Funds breakdown</div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px">
          ${[
            {label:'Current savings',amount:totalSavings,color:'#1D9E75',pct:lifetimeInflow>0?Math.round((totalSavings/lifetimeInflow)*100):0},
            {label:'Withdrawn',amount:totalWithdrawn,color:'#185FA5',pct:lifetimeInflow>0?Math.round((totalWithdrawn/lifetimeInflow)*100):0},
            {label:'Interest accrued',amount:totalInterest,color:'#C9961A',pct:lifetimeInflow>0?Math.round((totalInterest/lifetimeInflow)*100):0},

          </div>`).join('')}
        </div>
      </div>

      <!-- TOTAL MEMBER VALUE -->
      <div style="background:#fff;border-radius:16px;padding:1.25rem;border:1px solid #e5e5e2;margin-top:1.25rem">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem">
          <h3 style="margin:0">Total member value</h3>
          <div style="font-size:12px;color:#888">Principal + interest accrued</div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem">
          <div style="background:#E8F5EE;border-radius:12px;padding:1rem">
            <div style="font-size:11px;color:#065F46;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">Current savings (principal)</div>
            <div style="font-size:22px;font-weight:800;color:#065F46">${fmt(totalSavings)}</div>

// ─── INVESTMENT AUTO-REFUND ────────────────────────────────

async function refundFailedInvestment(invId){
  if(!confirm('Mark this investment as failed and refund all confirmed investors? This cannot be undone.'))return;
  try{
    const reservations = await sb(`investment_reservations?investment_id=eq.${invId}&status=eq.payment_confirmed&select=*`);
    const inv = await sb(`investments?id=eq.${invId}&select=*`);
    if(!inv||!inv.length)throw new Error('Investment not found');
    const today = new Date().toISOString().split('T')[0];
    let refunded = 0;

    for(const r of (reservations||[])){
      const refundAmount = +(r.units * inv[0].unit_price).toFixed(2);
      // Credit back to savings
      await sb('payments',{method:'POST',body:JSON.stringify({user_id:r.user_id,amount:refundAmount,date:today,withdrawn:false,is_transfer:true})});
      // Cancel reservation
      await sb(`investment_reservations?id=eq.${r.id}`,{method:'PATCH',body:JSON.stringify({status:'cancelled'})});
      // Notify investor
      const userArr = await sb(`users?id=eq.${r.user_id}&select=name,email`);
      if(userArr&&userArr.length){
        await notify({type:'investment_cancelled',to:userArr[0].email,name:userArr[0].name,investment:inv[0].title});
      }
      refunded++;
    }
    // Mark investment as closed/failed
    await sb(`investments?id=eq.${invId}`,{method:'PATCH',body:JSON.stringify({status:'closed'})});
    toast(`<i class="ti ti-check"></i> Investment closed. ${refunded} investor${refunded!==1?'s':''} refunded.`);
    await renderAdmin();
  }catch(e){alert('Error processing refund: '+e.message);}
}

function loadImageForCanvas(src){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.crossOrigin='anonymous';
    img.onload=()=>resolve(img);
    img.onerror=reject;
    img.src=src;
  });
}

function canvasRoundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function canvasDrawImageCover(ctx,img,x,y,w,h,radius){
  ctx.save();
  canvasRoundRect(ctx,x,y,w,h,radius);
  ctx.clip();
  const scale=Math.max(w/img.width,h/img.height);
  const dw=img.width*scale, dh=img.height*scale;
  ctx.drawImage(img, x+(w-dw)/2, y+(h-dh)/2, dw, dh);
  ctx.restore();
}

// Wraps text within maxWidth, returns the y position after the last line
function canvasWrapText(ctx,text,x,y,maxWidth,lineHeight){
  const words=(text||'').split(' ');
  let line='';
  for(let i=0;i<words.length;i++){
    const test=line+words[i]+' ';
    if(ctx.measureText(test).width>maxWidth && i>0){
      ctx.fillText(line,x,y);
      line=words[i]+' ';
      y+=lineHeight;
    } else {
      line=test;
    }
  }
  ctx.fillText(line,x,y);
  return y+lineHeight;
}

async function buildShareImage(type,data,referralLink){
  const canvas=document.createElement('canvas');
  canvas.width=1080; canvas.height=1920;
  const ctx=canvas.getContext('2d');

  // Background
  const grad=ctx.createLinearGradient(0,0,0,1920);
  grad.addColorStop(0,'#0D3D2A');
  grad.addColorStop(1,'#082017');
  ctx.fillStyle=grad;
  ctx.fillRect(0,0,1080,1920);

  // Header — logo + wordmark
  try{
    const logo=await loadImageForCanvas('/logo.png');
    canvasRoundRect(ctx,90,90,90,90,16); ctx.save(); ctx.clip(); ctx.drawImage(logo,90,90,90,90); ctx.restore();
  }catch(e){ /* no logo available — proceed text-only */ }
  ctx.fillStyle='#fff';
  ctx.font='bold 42px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif';
  ctx.fillText('FUNDOVA',200,150);
  ctx.fillStyle='#C9961A';
  ctx.font='24px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif';
  ctx.fillText('Money · Mindset · Growth',200,188);

  let y=380;

  if(type==='deal'){
    if(data.image_url){
      try{
        const img=await loadImageForCanvas(data.image_url);
        canvasDrawImageCover(ctx,img,90,300,900,620,24);
        y=1000;
      }catch(e){ y=380; }
    }
    ctx.fillStyle='#C9961A';
    ctx.font='bold 30px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif';
    ctx.fillText('DEAL OF THE WEEK',90,y);
    y+=64;
    ctx.fillStyle='#fff';
    ctx.font='bold 54px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif';
    y=canvasWrapText(ctx,data.title||'Exclusive member deal',90,y,900,64);
    if(data.discount){
      y+=10;
      ctx.fillStyle='#1D9E75';
      ctx.font='bold 46px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif';
      ctx.fillText(`${data.discount}% OFF`,90,y);
    }
  } else if(type==='investment'){
    ctx.fillStyle='#C9961A';
    ctx.font='bold 30px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif';
    ctx.fillText('INVESTMENT OPPORTUNITY',90,y);
    y+=70;
    ctx.fillStyle='#fff';
    ctx.font='bold 50px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif';
    y=canvasWrapText(ctx,'Fundova members get access to group investment opportunities.',90,y,900,64);
    y+=30;
    if(data.title){
      ctx.fillStyle='#ccc';
      ctx.font='34px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif';
      y=canvasWrapText(ctx,`This week: ${data.title}`,90,y,900,46);
    }
  } else if(type==='ajo'){
    ctx.fillStyle='#C9961A';
    ctx.font='bold 30px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif';
    ctx.fillText('GROUP SAVINGS (AJO)',90,y);
    y+=70;
    ctx.fillStyle='#fff';
    ctx.font='bold 50px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif';
    y=canvasWrapText(ctx,"I'm running a savings circle on Fundova — a trusted, transparent way to save together.",90,y,900,64);
  }

  // Bottom CTA panel
  const panelY=1650;
  ctx.fillStyle='rgba(255,255,255,.1)';
  canvasRoundRect(ctx,90,panelY,900,180,18); ctx.fill();
  ctx.fillStyle='#fff';
  ctx.font='bold 34px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif';
  ctx.fillText('Join me on Fundova',130,panelY+70);
  ctx.fillStyle='#C9961A';
  ctx.font='28px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif';
  ctx.fillText(referralLink.replace('https://',''),130,panelY+120);

  const dataUrl=canvas.toDataURL('image/png');
  const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));
  return {blob,dataUrl};
}

// Generic search — filters any table's rows by matching text in the first column.
// Reused across Transactions, Withdrawals, Credentials, Investments, etc.
function filterTableRows(searchInputId, tableId, countElId){
  const query = document.getElementById(searchInputId)?.value?.toLowerCase().trim() || '';
  const table = document.getElementById(tableId);
  if(!table)return;
  const rows = table.querySelectorAll('tr:not(:first-child)');
  let visible = 0;
  rows.forEach(row => {
    const name = row.querySelector('td')?.textContent?.toLowerCase() || '';
    const show = !query || name.includes(query);
    row.style.display = show ? '' : 'none';
    if(show) visible++;
  });
  const countEl = countElId ? document.getElementById(countElId) : null;
  if(countEl) countEl.textContent = query ? `${visible} of ${rows.length}` : `${rows.length}`;
}

const TOUR_STEPS = [
  { id:'dash', title:'Your savings overview', body:'This is your total value — principal saved plus all interest earned. It updates every weekday automatically.' },
  { id:'goals', title:'Savings goals', body:'Set a target amount and watch your progress in real time. A great way to stay motivated and focused.' },
  { id:'bonus-section', title:'Cooperative bonuses', body:'Any surplus distributed by Fundova appears here. You can add it to your savings or request a withdrawal.' },
  { id:'explore-fundova', title:'Group savings (Ajo)', body:'Coordinate your own rotating savings group, or see your position in one you\'ve joined — right from here. Investments, the food scheme, and deals also have their own sections further down.' },
];

let tourStep = 0;
let tourOverlay = null;

function startTour(){
  if(localStorage.getItem('fundova_tour_seen')==='1'){return;}
  tourStep = 0;
  showTourStep();
}

function showTourStep(){
  clearTourOverlay();
  if(tourStep >= TOUR_STEPS.length){endTour();return;}
  const step = TOUR_STEPS[tourStep];
  const el = document.getElementById(step.id);

  tourOverlay = document.createElement('div');
  tourOverlay.style.cssText = 'position:fixed;inset:0;z-index:9000;pointer-events:none';

  const backdrop = document.createElement('div');
  backdrop.style.cssText = 'position:absolute;inset:0;background:rgba(0,0,0,.55);pointer-events:all';
  tourOverlay.appendChild(backdrop);

  // Tooltip
  const tip = document.createElement('div');
  tip.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);width:min(340px,90vw);background:#fff;border-radius:16px;padding:1.25rem;box-shadow:0 8px 32px rgba(0,0,0,.25);z-index:9001;pointer-events:all';
  tip.innerHTML = `
    <div style="font-size:10px;font-weight:700;color:#C9961A;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px">Step ${tourStep+1} of ${TOUR_STEPS.length}</div>
    <h3 style="font-size:15px;font-weight:700;color:#0D1F14;margin-bottom:6px">${step.title}</h3>
    <p style="font-size:13px;color:#666;line-height:1.6;margin-bottom:1rem">${step.body}</p>
    <div style="display:flex;gap:8px;align-items:center;justify-content:space-between">
      <button onclick="skipTour()" style="background:none;border:none;font-size:12px;color:#aaa;cursor:pointer;text-decoration:underline">Do not show me again</button>
      <div style="display:flex;gap:6px">
        ${tourStep > 0 ? '<button onclick="prevTourStep()" style="background:#f5f5f3;border:none;padding:8px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer">← Back</button>' : ''}
        <button onclick="nextTourStep()" style="background:#0D3D2A;color:#fff;border:none;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer">${tourStep < TOUR_STEPS.length-1 ? 'Next →' : 'Done ✓'}</button>
      </div>
    </div>`;

  tourOverlay.appendChild(tip);
  document.body.appendChild(tourOverlay);

  // Scroll to element
  if(el) el.scrollIntoView({behavior:'smooth', block:'center'});
}

function nextTourStep(){ tourStep++; showTourStep(); }
function prevTourStep(){ tourStep--; showTourStep(); }
function skipTour(){ localStorage.setItem('fundova_tour_seen','1'); endTour(); }
function endTour(){ clearTourOverlay(); localStorage.setItem('fundova_tour_seen','1'); }
function clearTourOverlay(){ if(tourOverlay){tourOverlay.remove();tourOverlay=null;} }

async function renderProfileCompletion(kyc){

    { label:'NIN', done: !!(kyc&&kyc.nin) },

        await sb('bank_details',{method:'POST',body:JSON.stringify({user_id:currentUser.id,bank_name:bankName,account_number:accountNumber,account_name:accountName})});

// ─── ANNIVERSARY & SAVINGS GOAL NOTIFICATIONS ─────────────

async function checkMilestones(totalSavings){
  try{
    const joinDate = new Date(currentUser.created_at);
    const now = new Date();
    const monthsElapsed = (now.getFullYear()-joinDate.getFullYear())*12+(now.getMonth()-joinDate.getMonth());

    // Anniversary check — every 6 months
    const anniversaryMonths = [6,12,18,24,30,36,42,48,54,60];
    for(const m of anniversaryMonths){
      if(monthsElapsed >= m){
        const key = `fundova_anniv_${currentUser.id}_${m}`;
        if(!localStorage.getItem(key)){
          localStorage.setItem(key,'1');
          const years = m/12;
          const label = m < 12 ? `${m} months` : years === 1 ? '1 year' : `${years} years`;
          await addNotification(currentUser.id,`🎉 Happy ${label} anniversary with Fundova! You have saved ${fmt(totalSavings)} since joining. Thank you for being part of our community!`);
          notify({
            type:'broadcast',
            to:currentUser.email,
            name:currentUser.name,
            subject:`Happy ${label} anniversary with Fundova! 🎉`,
            body:`Congratulations on ${label} of saving with Fundova!

You have saved ${fmt(totalSavings)} since joining. That is something to be proud of.

Keep saving, keep growing. We are honoured to be part of your financial journey.

Helping you build wealth, one smart decision at a time.

Fundova Limited`
          }).catch(()=>{});
        }
      }
    }

    // Savings goal milestone check
    if(currentUser.savings_goal && totalSavings > 0){
      const pct = (totalSavings / currentUser.savings_goal) * 100;
      const milestones = [{pct:25,label:'25%',msg:'You are a quarter of the way to your savings goal!'},{pct:50,label:'50%',msg:'Halfway there! Keep going!'},{pct:75,label:'75%',msg:'Almost there — you are 75% of the way to your goal!'},{pct:100,label:'100%',msg:'Congratulations! You have reached your savings goal! 🎉'}];
      for(const m of milestones){
        if(pct >= m.pct){
          const key = `fundova_goal_${currentUser.id}_${m.label}`;
          if(!localStorage.getItem(key)){
            localStorage.setItem(key,'1');
            await addNotification(currentUser.id,`🎯 ${m.msg} You have saved ${fmt(totalSavings)} of your ${fmt(currentUser.savings_goal)} goal.`);
          }
        }
      }
    }
  }catch(e){console.error('Milestone check error:',e);}
}

async function getKycStatus(userId){
  try{
    const [kyc,bank] = await Promise.all([
      sb(`kyc_details?user_id=eq.${userId}&select=*`),
      sb(`bank_details?user_id=eq.${userId}&select=*`)
    ]);
    const k = kyc&&kyc.length?kyc[0]:{};
    const b = bank&&bank.length?bank[0]:{};
    const fields = [b.bank_name,k.date_of_birth,k.home_address,k.bvn,k.nin,k.id_type];

async function saveKycWithAudit(){
  const btn = document.getElementById('kyc-btn');
  const err = document.getElementById('kyc-err');
  btn.innerHTML='<span class="spinner"></span> Saving…';btn.disabled=true;

  try{
    const bankName = document.getElementById('kyc-bank').value.trim();
    const accountNumber = document.getElementById('kyc-anum').value.trim();
    const accountName = document.getElementById('kyc-aname').value.trim();
    const dateOfBirth = document.getElementById('kyc-dob').value;
    const homeAddress = document.getElementById('kyc-address').value.trim();
    const bvn = document.getElementById('kyc-bvn').value.trim();
    const nin = document.getElementById('kyc-nin').value.trim();
    const idType = document.getElementById('kyc-idtype').value;
    const idNumber = document.getElementById('kyc-idnum').value.trim();
    const nokName = document.getElementById('kyc-nok-name')?.value?.trim()||'';
    const nokRel = document.getElementById('kyc-nok-rel')?.value||'';
    const nokPhone = document.getElementById('kyc-nok-phone')?.value?.trim()||'';
    const nokWhatsapp = document.getElementById('kyc-nok-whatsapp')?.value?.trim()||'';
    const nokEmail = document.getElementById('kyc-nok-email')?.value?.trim()||'';
    const nokMailingList = document.getElementById('kyc-nok-mailinglist')?.checked||false;
    const gender = document.getElementById('kyc-gender')?.value || '';

    // Get existing KYC to detect changes
    const existingKyc = await sb(`kyc_details?user_id=eq.${currentUser.id}&select=*`);
    const existing = existingKyc&&existingKyc.length?existingKyc[0]:{};

    // Detect which fields changed — gender is intentionally excluded: it never affects
    // withdrawal eligibility or verification status
    const changedFields = [];
    const oldValues = {};
    const newValues = {};
    if(dateOfBirth && dateOfBirth !== existing.date_of_birth){ changedFields.push('Date of birth'); oldValues.date_of_birth=existing.date_of_birth||null; newValues.date_of_birth=dateOfBirth; }
    if(homeAddress && homeAddress !== existing.home_address){ changedFields.push('Home address'); oldValues.home_address=existing.home_address||null; newValues.home_address=homeAddress; }
    if(bvn && bvn !== existing.bvn){ changedFields.push('BVN'); oldValues.bvn=existing.bvn||null; newValues.bvn=bvn; }
    if(nin && nin !== existing.nin){ changedFields.push('NIN'); oldValues.nin=existing.nin||null; newValues.nin=nin; }
    if(idType && idType !== existing.id_type){ changedFields.push('ID type'); oldValues.id_type=existing.id_type||null; newValues.id_type=idType; }
    if(idNumber && idNumber !== existing.id_number){ changedFields.push('ID number'); oldValues.id_number=existing.id_number||null; newValues.id_number=idNumber; }

    // Save bank details
    if(bankName||accountNumber||accountName){
      const existingBank = await sb(`bank_details?user_id=eq.${currentUser.id}&select=id`);
      if(existingBank&&existingBank.length){
        await sb(`bank_details?user_id=eq.${currentUser.id}`,{method:'PATCH',body:JSON.stringify({bank_name:bankName,account_number:accountNumber,account_name:accountName})});
      } else {
        await sb('bank_details',{method:'POST',body:JSON.stringify({user_id:currentUser.id,bank_name:bankName,account_number:accountNumber,account_name:accountName})});
      }
    }

    // Save KYC — reset verification if fields changed
    const kycData = {
      user_id:currentUser.id,
      date_of_birth:dateOfBirth||existing.date_of_birth||null,
      home_address:homeAddress||existing.home_address||null,
      bvn:bvn||existing.bvn||null,
      nin:nin||existing.nin||null,
      id_type:idType||existing.id_type||null,
      id_number:idNumber||existing.id_number||null,
      gender:gender||existing.gender||null,
      kyc_verified: changedFields.length>0 ? false : (existing.kyc_verified||false),
      updated_at: new Date().toISOString()
    };

    if(existingKyc&&existingKyc.length){
      await sb(`kyc_details?user_id=eq.${currentUser.id}`,{method:'PATCH',body:JSON.stringify(kycData)});
    } else {
      await sb('kyc_details',{method:'POST',body:JSON.stringify(kycData)});
    }

    // Log changes for audit trail
    if(changedFields.length>0){
      await sb('kyc_audit_log',{method:'POST',body:JSON.stringify({
        user_id:currentUser.id,
        changed_fields:changedFields.join(', '),
        old_values:JSON.stringify(oldValues),
        new_values:JSON.stringify(newValues),
        changed_at:new Date().toISOString()
      })}).catch(()=>{});
      // Send welcome email to next of kin if opted in
    if(nokMailingList && nokEmail){
      notify({type:'nok_welcome',to:nokEmail,name:nokName,member_name:currentUser.name}).catch(e=>logSystemError('notify:nok_welcome',e));
    }
    // Notify admin of KYC update
      notify({type:'admin_kyc_update',to:'fundovamultipurposecooperative@gmail.com',
        name:currentUser.name,
        applicant_email:currentUser.email
      }).catch(e=>logSystemError('notify:kyc_update',e));
    }

    closeModal();
    toast(changedFields.length>0?
      '<i class="ti ti-check"></i> KYC updated. Admin will re-verify your details.':
      '<i class="ti ti-check"></i> Profile details saved!'
    );
    await renderContributor();
  }catch(e){
    err.textContent='Error saving: '+e.message;
    btn.innerHTML='<i class="ti ti-device-floppy"></i> Save details';
    btn.disabled=false;
  }
}

      (users||[]).forEach(u=>{kycUsers[u.id]=u.name;});
    }

    // Get user names for reservation items
    let resUsers = {};
    let resInvs = {};
    if(reservations&&reservations.length){
      const uids = reservations.map(r=>r.user_id).join(',');
      const invids = reservations.map(r=>r.investment_id).join(',');
      const [users,invs] = await Promise.all([
        sb('users?id=in.('+uids+')&select=id,name'),
        sb('investments?id=in.('+invids+')&select=id,title')
      ]);
      (users||[]).forEach(u=>{resUsers[u.id]=u.name;});
      (invs||[]).forEach(i=>{resInvs[i.id]=i.title;});
    }

    adminNotifData = {
      signups: signups||[],
      withdrawals: withdrawals||[],
      kycPending: (kycPending||[]).map(k=>({...k,name:kycUsers[k.user_id]||'Unknown'})),
      reservations: (reservations||[]).map(r=>({...r,name:resUsers[r.user_id]||'Unknown',investment:resInvs[r.investment_id]||'Investment'})),
      profiles: profiles||[],
      coordinators: coordinators||[],
      deals: deals||[],
      refunds: refunds||[],
    };

    const total = adminNotifData.signups.length + adminNotifData.withdrawals.length +
      adminNotifData.kycPending.length + adminNotifData.reservations.length +
      adminNotifData.profiles.length + adminNotifData.coordinators.length +
      adminNotifData.deals.length + adminNotifData.refunds.length;

    const badge = document.getElementById('admin-notif-badge');
    if(badge){
      badge.textContent = total > 99 ? '99+' : total;
      badge.style.display = total > 0 ? 'flex' : 'none';
    }

    return total;
  }catch(e){console.error('Admin notif error:',e);return 0;}
}

// ─── BIRTHDAY CONFETTI ──────────────────────────────────────
// A lightweight canvas particle celebration — runs once per calendar day even if the
// dashboard re-renders many times (e.g. after every action), guarded via localStorage.
function triggerBirthdayConfetti(){
  const todayKey = 'fundova_bday_shown_' + new Date().toDateString();
  if(localStorage.getItem(todayKey))return;
  localStorage.setItem(todayKey,'1');

  const canvas = document.createElement('canvas');
  canvas.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:9999';
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  document.body.appendChild(canvas);
  const ctx = canvas.getContext('2d');

  const colors = ['#C9961A','#0D3D2A','#1D9E75','#F7F5F0','#A32D2D','#3730A3'];
  const particles = [];
  for(let i=0;i<140;i++){
    particles.push({
      x: Math.random()*canvas.width,
      y: -20-Math.random()*canvas.height*0.5,
      w: 6+Math.random()*6,
      h: 8+Math.random()*8,
      color: colors[Math.floor(Math.random()*colors.length)],
      speedY: 2+Math.random()*3,
      speedX: (Math.random()-0.5)*2,
      rotation: Math.random()*360,
      rotSpeed: (Math.random()-0.5)*10,
      opacity: 1
    });
  }

  const startTime = Date.now();
  const duration = 4000;
  function animate(){
    const elapsed = Date.now()-startTime;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach(p=>{
      p.y += p.speedY;
      p.x += p.speedX;
      p.rotation += p.rotSpeed;
      if(elapsed>duration-800)p.opacity=Math.max(0,p.opacity-0.02);
      ctx.save();
      ctx.globalAlpha = p.opacity;
      ctx.translate(p.x,p.y);
      ctx.rotate(p.rotation*Math.PI/180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      ctx.restore();
    });
    if(elapsed<duration){
      requestAnimationFrame(animate);
    } else {
      canvas.remove();
    }
  }
  animate();
}

// ─── ADMIN CHART ──────────────────────────────────────────

function renderAdminChart(allPayments){
  const canvas = document.getElementById('admin-value-chart');
  if(!canvas) return;

  // Build monthly totals
  const months = {};
  (allPayments||[]).forEach(p=>{
    if(p.is_transfer)return; // internal relabeling, not real new value — would double-count
    const d = new Date(p.date);
    const key = d.getFullYear()+'-'+(d.getMonth()+1).toString().padStart(2,'0');
    months[key] = (months[key]||0) + Number(p.amount);
  });

  const sorted = Object.keys(months).sort();
  const last6 = sorted.slice(-6);
  const labels = last6.map(k=>{
    const [y,m] = k.split('-');
    return new Date(y,m-1,1).toLocaleDateString('en-GB',{month:'short'});
  });

  // Cumulative values — seed with everything before the displayed window so the
  // running total reflects true all-time value, not just the last 6 months
  const priorMonths = sorted.slice(0, -6);
  let running = priorMonths.reduce((sum,k)=>sum+months[k], 0);
  const vals = last6.map(k=>{ running += months[k]; return running; });

  const ctx = canvas.getContext('2d');
  const w = canvas.offsetWidth || 400;
  const h = 160;
  canvas.width = w;
  canvas.height = h;

  const pad = {top:10, right:10, bottom:30, left:55};
  const cw = w - pad.left - pad.right;
  const ch = h - pad.top - pad.bottom;

  const maxVal = Math.max(...vals, 1);
  const minVal = 0;

  ctx.clearRect(0,0,w,h);

  // Grid lines
  ctx.strokeStyle = '#f0f0ee';
  ctx.lineWidth = 1;
  for(let i=0; i<=4; i++){
    const y = pad.top + ch - (i/4)*ch;
    ctx.beginPath(); ctx.moveTo(pad.left,y); ctx.lineTo(w-pad.right,y); ctx.stroke();
    const val = (minVal + (i/4)*(maxVal-minVal));
    ctx.fillStyle = '#aaa';
    ctx.font = '10px sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText(val>=1000000?'₦'+(val/1000000).toFixed(1)+'M':val>=1000?'₦'+(val/1000).toFixed(0)+'K':'₦'+val.toFixed(0), pad.left-4, y+3);
  }

  // Area fill
  const grad = ctx.createLinearGradient(0, pad.top, 0, h-pad.bottom);
  grad.addColorStop(0, 'rgba(29,158,117,0.25)');
  grad.addColorStop(1, 'rgba(29,158,117,0)');

  ctx.beginPath();
  vals.forEach((v,i)=>{
    const x = pad.left + (i/(vals.length-1||1))*cw;
    const y = pad.top + ch - ((v-minVal)/(maxVal-minVal||1))*ch;
    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  });
  ctx.lineTo(pad.left+cw, h-pad.bottom);
  ctx.lineTo(pad.left, h-pad.bottom);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  // Line
  ctx.beginPath();
  ctx.strokeStyle = '#1D9E75';
  ctx.lineWidth = 2.5;
  ctx.lineJoin = 'round';
  vals.forEach((v,i)=>{
    const x = pad.left + (i/(vals.length-1||1))*cw;
    const y = pad.top + ch - ((v-minVal)/(maxVal-minVal||1))*ch;
    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  });
  ctx.stroke();

  // Dots + labels
  vals.forEach((v,i)=>{
    const x = pad.left + (i/(vals.length-1||1))*cw;
    const y = pad.top + ch - ((v-minVal)/(maxVal-minVal||1))*ch;
    ctx.beginPath();
    ctx.arc(x,y,4,0,Math.PI*2);
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#1D9E75';
    ctx.lineWidth = 2;
    ctx.fill(); ctx.stroke();

    ctx.fillStyle = '#888';
    ctx.font = '10px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(labels[i], x, h-pad.bottom+14);
  });

  // Last dot highlight
  if(vals.length > 0){
    const lx = pad.left + cw;
    const ly = pad.top + ch - ((vals[vals.length-1]-minVal)/(maxVal-minVal||1))*ch;
    ctx.beginPath();
    ctx.arc(lx,ly,6,0,Math.PI*2);
    ctx.fillStyle = '#1D9E75';
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.fill(); ctx.stroke();
  }
}

// ─── SUPABASE REALTIME ────────────────────────────────────

let realtimeChannel = null;
function startAdminRealtime(){
  // Stop any existing polling
  stopAdminRealtime();

  // Poll every 30 seconds for new notifications
  // Much more responsive than the old 25-minute refresh
  let lastCounts = {};

  async function pollForUpdates(){
    if(!currentUser||(currentUser.role!=='admin'&&currentUser.role!=='admin_view'&&currentUser.role!=='super_admin')) return;
    try{
      const [signups, withdrawals, kyc, reservations] = await Promise.all([
        sb('signup_requests?status=eq.pending&select=id'),
        sb('withdrawal_requests?status=eq.pending&select=id'),
        sb('kyc_details?kyc_verified=eq.false&select=id'),
        sb('investment_reservations?status=eq.payment_made&select=id'),
      ]);

      const counts = {
        signups: (signups||[]).length,
        withdrawals: (withdrawals||[]).length,
        kyc: (kyc||[]).length,
        reservations: (reservations||[]).length,
      };

      // Show toast if any count increased since last poll
      if(Object.keys(lastCounts).length){
        if(counts.signups > lastCounts.signups) showRealtimeToast('📋 New application received!');
        if(counts.withdrawals > lastCounts.withdrawals) showRealtimeToast('💸 New withdrawal request!');
        if(counts.kyc > lastCounts.kyc) showRealtimeToast('🔐 KYC submitted — awaiting verification!');
        if(counts.reservations > lastCounts.reservations) showRealtimeToast('📊 New investment payment!');
      }

      lastCounts = counts;
      loadAdminNotifications().catch(()=>{});
    }catch(e){}
  }

  // Poll immediately then every 30 seconds
  pollForUpdates();
  adminRefreshTimer = setInterval(pollForUpdates, 30*1000);
}

async function processReferralBonus(newUserId){
  try{
    // Get the new user's referred_by code
    const userArr = await sb(`users?id=eq.${newUserId}&select=referred_by,referral_bonus_paid,name`);
    if(!userArr||!userArr.length) return;
    const user = userArr[0];
    if(!user.referred_by || user.referral_bonus_paid) return;

    // Find the referrer by matching their generated referral code
    // Code = first 4 chars of name + first 4 chars of id (no hyphens), uppercase
    const allUsers = await sb('users?role=eq.contributor&select=id,name');
    const referrer = (allUsers||[]).find(u => {
      const code = generateReferralCode(u.name, u.id);
      return code === user.referred_by.toUpperCase();
    });

    if(!referrer) return;

    // Credit ₦500 to referrer as cooperative bonus
    await sb('cooperative_bonuses', {method:'POST', body:JSON.stringify({
      user_id: referrer.id,
      amount: 500,
      description: 'Referral bonus — '+user.name+' joined via your referral link',
      date: new Date().toISOString().split('T')[0],
      status: 'available'
    })});

    // Mark referral bonus as paid on new user
    await sb(`users?id=eq.${newUserId}`, {method:'PATCH', body:JSON.stringify({referral_bonus_paid:true})});

    // Notify referrer
    const referrerFull = await sb(`users?id=eq.${referrer.id}&select=name,email`);
    if(referrerFull&&referrerFull[0]){
      await addNotification(referrer.id, '🎉 You earned a ₦500 referral bonus! '+user.name+' just made their first contribution via your referral link.');
      notify({
        type:'broadcast',
        to:referrerFull[0].email,
        name:referrerFull[0].name,
        subject:'You earned a ₦500 referral bonus! 🎉',
        body:'Great news! '+user.name+' just made their first contribution on Fundova via your referral link. Your ₦500 referral bonus has been credited to your account and is already earning interest. Keep sharing your link to earn more! Fundova Limited'
      }).catch(()=>{});
    }
  }catch(e){ console.error('Referral bonus error:', e); }
}

async function triggerFoodSchemeDeduction(skippedOnly=false){
  const label = skippedOnly ? 'skipped members' : 'all opted-in members';
  if(!confirm('Trigger food scheme deduction for '+label+'? This cannot be undone.')) return;

  try{
    const query = skippedOnly
      ? 'food_scheme_enrollments?status=eq.skipped&select=*'
      : 'food_scheme_enrollments?status=in.(opted_in,skipped)&select=*';

    const enrollments = await sb(query);
    const options = await sb('food_scheme_options?select=*');
    const optionMap = {};
    (options||[]).forEach(o=>{ optionMap[o.id]=o; });

    let deducted=0, skipped=0;
    const today = new Date().toISOString().split('T')[0];

    for(const e of (enrollments||[])){
      const opt = optionMap[e.option_id];
      if(!opt) continue;
      // Check balance
      const pArr = await sb('payments?user_id=eq.'+e.user_id+'&withdrawn=eq.false&goal_id=is.null&moved_at=is.null&select=amount');
      const balance = (pArr||[]).reduce((a,p)=>a+Number(p.amount),0);

      if(balance >= opt.price){
        // Deduct from savings as a withdrawal-type payment (negative)
        await sb('payments', {method:'POST', body:JSON.stringify({
          user_id:e.user_id, amount:-opt.price, date:today, withdrawn:false, is_transfer:true,
          purpose:'Food Scheme deduction — '+opt.name
        })});
        await sb('food_scheme_enrollments?id=eq.'+e.id, {method:'PATCH', body:JSON.stringify({status:'deducted', deducted_at:new Date().toISOString()})});
        // Notify contributor
        const uArr = await sb('users?id=eq.'+e.user_id+'&select=name,email');
        if(uArr&&uArr[0]){
          await addNotification(e.user_id, '🧺 Your food scheme payment of ₦'+Number(opt.price).toLocaleString()+' ('+opt.name+') has been deducted from your savings. Admin will be in touch with pickup details.');
          notify({type:'broadcast', to:uArr[0].email, name:uArr[0].name,
            subject:'Food Scheme — Payment processed 🧺',
            body:'Your food scheme payment of ₦'+Number(opt.price).toLocaleString()+' for the '+opt.name+' has been successfully deducted from your savings balance. Our team will contact you separately with pickup details. Thank you for participating in the Fundova Food Scheme! Fundova Limited'
          }).catch(()=>{});
        }
        deducted++;
      } else {
        await sb('food_scheme_enrollments?id=eq.'+e.id, {method:'PATCH', body:JSON.stringify({status:'skipped'})});
        // Notify contributor they were skipped
        const uArr = await sb('users?id=eq.'+e.user_id+'&select=name,email');
        if(uArr&&uArr[0]){
          await addNotification(e.user_id, '⚠️ Your food scheme deduction could not be processed — your savings balance of ₦'+balance.toLocaleString()+' is insufficient for the '+opt.name+' (₦'+Number(opt.price).toLocaleString()+'). Please top up your savings to qualify.');
          notify({type:'broadcast', to:uArr[0].email, name:uArr[0].name,
            subject:'Food Scheme — Action needed ⚠️',
            body:'Unfortunately your food scheme payment could not be processed. Your current savings balance of ₦'+balance.toLocaleString()+' is insufficient to cover the cost of the '+opt.name+' (₦'+Number(opt.price).toLocaleString()+'). Please top up your Fundova savings as soon as possible. Once your balance is sufficient, the admin can retrigger the deduction for you. Fundova Limited'
          }).catch(()=>{});
        }
        skipped++;
      }
    }
    alert('Done! Deducted: '+deducted+' members. Skipped: '+skipped+' (insufficient balance).');
    renderAdmin();
  }catch(e){ alert('Error: '+e.message); }
}

async function openAddFoodPackage(){
  openModal(`

  <div class="field"><label>Package name</label><input id="fp-name" placeholder="e.g. Premium Basket"></div>
  <div class="field"><label>Price (₦)</label><input id="fp-price" type="number" placeholder="e.g. 40000"></div>

async function saveFoodPackage(pkgId){
  const name = document.getElementById('fp-name').value.trim();
  const price = parseFloat(document.getElementById('fp-price').value);
  const desc = document.getElementById('fp-desc').value.trim();
  const active = document.getElementById('fp-active')?.value !== 'false';
  const err = document.getElementById('fp-err');

  if(!name){err.textContent='Please enter a package name.';return;}
  if(!price||price<=0){err.textContent='Please enter a valid price.';return;}

  try{
    if(pkgId){
      await sb('food_scheme_options?id=eq.'+pkgId, {method:'PATCH', body:JSON.stringify({name,price,description:desc,active})});
      toast('<i class="ti ti-check"></i> Package updated!');
    } else {
      await sb('food_scheme_options', {method:'POST', body:JSON.stringify({name,price,description:desc,active:true})});
      toast('<i class="ti ti-check"></i> Package added!');
    }
    closeModal();
    renderAdmin();
  }catch(e){ err.textContent='Error saving: '+e.message; }
}

async function deleteFoodPackage(pkgId){
  if(!confirm('Delete this package? This cannot be undone.')) return;
  try{
    await sb('food_scheme_options?id=eq.'+pkgId, {method:'DELETE'});
    closeModal();
    toast('<i class="ti ti-check"></i> Package deleted.');
    renderAdmin();
  }catch(e){ alert('Error: '+e.message); }
}

function uploadFoodPackageImage(pkgId){
  // Create a hidden file input and trigger it
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.onchange = async (e) => {
    const file = e.target.files[0];
    if(!file) return;
    if(file.size > 2*1024*1024){ alert('Image must be under 2MB.'); return; }

    const reader = new FileReader();
    reader.onload = async (ev) => {
      try{
        // Upload to Supabase Storage
        const fileName = 'food-scheme/'+pkgId+'-'+Date.now()+'.'+file.name.split('.').pop();
        const res = await fetch(SB_URL+'/storage/v1/object/fundova-media/'+fileName, {
          method:'POST',
          headers:{'Authorization':'Bearer '+SB_KEY,'apikey':SB_KEY,'Content-Type':file.type,'x-upsert':'true'},
          body:file
        });

        if(res.ok){
          const imageUrl = SB_URL+'/storage/v1/object/public/fundova-media/'+fileName;
          await sb('food_scheme_options?id=eq.'+pkgId, {method:'PATCH', body:JSON.stringify({image_url:imageUrl})});
          toast('<i class="ti ti-check"></i> Image uploaded!');
          renderAdmin();
        } else {
          // If storage fails, use base64 preview stored differently
          // Fall back to just showing a success toast and note
          alert('Image upload requires Supabase Storage to be configured. Contact your developer to set up the storage bucket.');
        }
      }catch(err){ alert('Error uploading: '+err.message); }
    };
    reader.readAsDataURL(file);
  };
  input.click();
}


// ─── FORGOT PIN / RESET PIN ──────────────────────────────

function openForgotPin(){
  openModal(`
  <h3>Reset your PIN</h3>
  <p style="font-size:13px;color:#666;margin-top:-6px">Enter your registered email address and we will send you a 6-digit reset code.</p>
  <div class="field">
    <label>Email address</label>
    <input id="fp-email" type="email" placeholder="you@email.com" autocomplete="email">
  </div>
  <div class="error" id="fp-err"></div>
  <div class="modal-footer">
    <button class="btn" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" id="fp-btn" onclick="sendPinResetCode()">
      <i class="ti ti-send"></i> Send reset code
    </button>
  </div>`);
}

async function sendPinResetCode(){
  const email = document.getElementById('fp-email').value.trim().toLowerCase();
  const err = document.getElementById('fp-err');
  const btn = document.getElementById('fp-btn');

  if(!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    err.textContent = 'Please enter a valid email address.';
    return;
  }

  btn.innerHTML = '<span class="spinner"></span> Sending…';
  btn.disabled = true;

  try{
    // Check if email exists
    const users = await sb('users?email=eq.'+email+'&select=id,name,email');
    if(!users || !users.length){
      err.textContent = 'No account found with this email address.';
      btn.innerHTML = '<i class="ti ti-send"></i> Send reset code';
      btn.disabled = false;
      return;
    }

    // Generate 6-digit code
    const code = Math.floor(100000 + Math.random() * 900000).toString();
    const expiresAt = new Date(Date.now() + 15*60*1000).toISOString(); // 15 minutes

    // Clean up old codes for this email first
    await sb('password_resets?email=eq.'+email, {method:'DELETE'}).catch(()=>{});
    // Save reset code
    await sb('password_resets', {method:'POST', body:JSON.stringify({
      email, code, expires_at:expiresAt, used:false
    })});

    // Send email with code
    await notify({
      type:'pin_reset',
      to:email,
      name:users[0].name,
      code
    });

    // Show code entry form
    openModal(`
    <h3>Enter reset code</h3>
    <p style="font-size:13px;color:#666;margin-top:-6px">We sent a 6-digit code to <strong>${email}</strong>. It expires in 15 minutes.</p>
    <div class="field">
      <label>Reset code</label>
      <input id="pr-code" type="text" maxlength="6" placeholder="e.g. 482931" autocomplete="off" style="font-size:22px;letter-spacing:6px;text-align:center">
    </div>
    <div class="field">
      <label>New PIN</label>
      <input id="pr-pin" type="password" maxlength="6" placeholder="Choose a new PIN" autocomplete="new-password">
    </div>
    <div class="field">
      <label>Confirm new PIN</label>
      <input id="pr-pin2" type="password" maxlength="6" placeholder="Repeat your new PIN" autocomplete="new-password">
    </div>
    <div class="error" id="pr-err"></div>
    <div class="modal-footer">
      <button class="btn" onclick="openForgotPin()">← Back</button>
      <button class="btn btn-primary" id="pr-btn" onclick="confirmPinReset('${email}')">
        <i class="ti ti-lock"></i> Reset PIN
      </button>
    </div>`);

  }catch(e){
    err.textContent = 'Error sending code. Please try again.';
    btn.innerHTML = '<i class="ti ti-send"></i> Send reset code';
    btn.disabled = false;
  }
}

async function confirmPinReset(email){
  const code = document.getElementById('pr-code').value.trim();
  const pin = document.getElementById('pr-pin').value.trim();
  const pin2 = document.getElementById('pr-pin2').value.trim();
  const err = document.getElementById('pr-err');
  const btn = document.getElementById('pr-btn');

  if(!code || code.length !== 6){ err.textContent = 'Please enter the 6-digit code from your email.'; return; }
  if(!pin || pin.length < 4){ err.textContent = 'PIN must be at least 4 digits.'; return; }
  if(pin !== pin2){ err.textContent = 'PINs do not match. Please try again.'; return; }

  btn.innerHTML = '<span class="spinner"></span> Resetting…';
  btn.disabled = true;

  try{
    // Verify code - let the DATABASE check expiry to avoid browser timezone issues
    // expires_at filter means Supabase compares server UTC time to stored UTC expires_at
    const now = new Date().toISOString();
    const resets = await sb('password_resets?email=eq.'+email+'&code=eq.'+code+'&used=eq.false&expires_at=gt.'+now+'&select=*');
    if(!resets || !resets.length){
      // Check if code exists but expired vs wrong code
      const anyCode = await sb('password_resets?email=eq.'+email+'&code=eq.'+code+'&select=id');
      if(anyCode && anyCode.length){
        err.textContent = 'This code has expired. Please request a new one.';
      } else {
        err.textContent = 'Invalid code. Please check your email or request a new code.';
      }
      btn.innerHTML = '<i class="ti ti-lock"></i> Reset PIN';
      btn.disabled = false;
      return;
    }

    const reset = resets[0];

    // Update PIN
    await sb('users?email=eq.'+email, {method:'PATCH', body:JSON.stringify({pin})});

    // Mark reset code as used
    await sb('password_resets?id=eq.'+reset.id, {method:'PATCH', body:JSON.stringify({used:true})});

    // Send confirmation email
    const users = await sb('users?email=eq.'+email+'&select=name');
    if(users&&users[0]){
      notify({
        type:'pin_reset_confirm',
        to:email,
        name:users[0].name
      }).catch(()=>{});
    }

    closeModal();
    toast('<i class="ti ti-check"></i> PIN reset successfully! You can now sign in with your new PIN.');

  }catch(e){
    err.textContent = 'Error resetting PIN. Please try again.';
    btn.innerHTML = '<i class="ti ti-lock"></i> Reset PIN';
    btn.disabled = false;
  }
}


// ─── BIRTHDAY WISHES ─────────────────────────────────────

async function checkBirthday(){
  try{
    const kycArr = await sb('kyc_details?user_id=eq.'+currentUser.id+'&select=date_of_birth');
    if(!kycArr||!kycArr.length||!kycArr[0].date_of_birth) return;

    const dob = new Date(kycArr[0].date_of_birth);
    const today = new Date();

    // Check if today is their birthday (day and month match)
    if(dob.getDate() !== today.getDate() || dob.getMonth() !== today.getMonth()) return;

    // Check if we already wished them this year
    const key = 'fundova_bday_'+currentUser.id+'_'+today.getFullYear();
    if(localStorage.getItem(key)) return;

    // Mark as done for this year
    localStorage.setItem(key, '1');

    // Send notification
    await addNotification(currentUser.id,
      '🎂 Happy Birthday, '+currentUser.name.split(' ')[0]+'! Wishing you a wonderful day filled with joy. From all of us at Fundova — thank you for being part of our community! 💚'
    );

    // Send birthday email
    notify({
      type:'birthday',
      to:currentUser.email,
      name:currentUser.name
    }).catch(()=>{});

    // Show birthday toast
    setTimeout(()=>{
      toast('🎂 Happy Birthday, '+currentUser.name.split(' ')[0]+'! 🎉');
    }, 2000);

  }catch(e){ console.error('Birthday check error:', e); }
}
