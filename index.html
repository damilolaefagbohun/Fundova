async function approveProfileRequest(reqId,userId){
  try{
    const reqArr=await sb(`profile_update_requests?id=eq.${reqId}&select=*`);
    const req=reqArr[0];

    // Snapshot current values before they get overwritten, for the audit trail
    const [currentUserArr,currentBankArr]=await Promise.all([
      sb(`users?id=eq.${userId}&select=name,email,phone,whatsapp`),
      sb(`bank_details?user_id=eq.${userId}&select=bank_name,account_number,account_name`)
    ]);
    const prevUser=currentUserArr&&currentUserArr.length?currentUserArr[0]:{};
    const prevBank=currentBankArr&&currentBankArr.length?currentBankArr[0]:{};
    const oldValues={},newValues={};
    if(req.requested_name&&req.requested_name!==prevUser.name){oldValues.name=prevUser.name||null;newValues.name=req.requested_name;}
    if(req.requested_email&&req.requested_email!==prevUser.email){oldValues.email=prevUser.email||null;newValues.email=req.requested_email;}
    if(req.requested_phone&&req.requested_phone!==prevUser.phone){oldValues.phone=prevUser.phone||null;newValues.phone=req.requested_phone;}
    if(req.requested_whatsapp&&req.requested_whatsapp!==prevUser.whatsapp){oldValues.whatsapp=prevUser.whatsapp||null;newValues.whatsapp=req.requested_whatsapp;}
    if(req.requested_bank_name&&req.requested_bank_name!==prevBank.bank_name){oldValues.bank_name=prevBank.bank_name||null;newValues.bank_name=req.requested_bank_name;}
    if(req.requested_account_number&&req.requested_account_number!==prevBank.account_number){oldValues.account_number=prevBank.account_number||null;newValues.account_number=req.requested_account_number;}
    if(req.requested_account_name&&req.requested_account_name!==prevBank.account_name){oldValues.account_name=prevBank.account_name||null;newValues.account_name=req.requested_account_name;}

    // Update user record
    const userUpdate={name:req.requested_name,email:req.requested_email};
    if(req.requested_phone)userUpdate.phone=req.requested_phone;
    if(req.requested_whatsapp)userUpdate.whatsapp=req.requested_whatsapp;
    await sb(`users?id=eq.${userId}`,{method:'PATCH',body:JSON.stringify(userUpdate)});
    // Update bank details if provided
    if(req.requested_bank_name){
      const existing=await sb(`bank_details?user_id=eq.${userId}&select=id`);
      const bankData={bank_name:req.requested_bank_name,account_number:req.requested_account_number,account_name:req.requested_account_name};
      if(existing&&existing.length){
        await sb(`bank_details?id=eq.${existing[0].id}`,{method:'PATCH',body:JSON.stringify(bankData)});
      } else {
        await sb('bank_details',{method:'POST',body:JSON.stringify({user_id:userId,...bankData})});
      }
    }
    await updateProfileRequest(reqId,'approved',oldValues,newValues);
    // Notify contributor
    try{
      const userArr=await sb(`users?id=eq.${userId}&select=name,email`);
      if(userArr&&userArr.length)await notify({type:'profile_approved',to:userArr[0].email,name:userArr[0].name});
    }catch(e){console.error('Profile notify error:',e);}
    toast('<i class="ti ti-check"></i> Profile updated successfully.');
  }catch(e){alert('Error approving request: '+e.message);}
}

async function updateProfileRequest(reqId,status,oldValues,newValues){
  const body={status};
  if(oldValues)body.previous_values=JSON.stringify(oldValues);
  if(newValues)body.approved_values=JSON.stringify(newValues);
  try{
    await sb(`profile_update_requests?id=eq.${reqId}`,{method:'PATCH',body:JSON.stringify(body)});
  }catch(e){
    // If the audit-trail columns (previous_values/approved_values) don't exist on this
    // table yet, PostgREST rejects the whole PATCH and status never flips to
    // approved/rejected — the row just sits there looking "stuck" as pending even
    // though everything else (user update, email) already went through. Fall back to
    // updating just the status so the request actually clears, and surface the real
    // problem instead of silently swallowing it.
    console.error('Profile request status update failed, retrying with status only:',e);
    try{
      await sb(`profile_update_requests?id=eq.${reqId}`,{method:'PATCH',body:JSON.stringify({status})});
    }catch(e2){
      await renderAdmin();
      alert('Error updating request: '+e2.message);
      throw e2;
    }
  }
  await renderAdmin();
}

async function registerWebinar(webinarId){
  const name=document.getElementById('wr-name').value.trim();
  const email=document.getElementById('wr-email').value.trim().toLowerCase();
  const phone=document.getElementById('wr-phone').value.trim();
  const err=document.getElementById('wr-err');
  const btn=document.getElementById('wr-btn');
  if(!name||!email){err.textContent='Please enter your name and email.';return;}
  if(!email.includes('@')||!email.includes('.')){err.textContent='Please enter a valid email address.';return;}
  btn.innerHTML='<span class="spinner"></span> Registering…';btn.disabled=true;
  try{
    await sb('webinar_registrations',{method:'POST',body:JSON.stringify({name,email,phone:phone||null,webinar_id:webinarId})});
    setHTML(`
    <div style="min-height:100vh;background:#f5f5f3;display:flex;align-items:center;justify-content:center;padding:2rem">

        <p style="font-size:13px;color:#888;margin-bottom:20px">While you are here &mdash; join Fundova and start your savings journey today.</p>
        <a href="/" class="btn btn-primary" style="display:inline-flex;padding:12px 24px;text-decoration:none"><i class="ti ti-currency-naira"></i> Learn about Fundova savings</a>

  }catch(e){

}

async function uploadSpeakerPhoto(input,speakerNum){
  const file=input.files[0];
  if(!file)return;
  const urlEl=document.getElementById('wn-sp'+speakerNum+'-url');
  urlEl.textContent='Uploading…';
  try{
    const ext=file.name.split('.').pop();
    const path='speakers/'+Date.now()+'-'+speakerNum+'.'+ext;
    const res=await fetch(`${SB_URL}/storage/v1/object/fundova-media/${path}`,{
      method:'POST',headers:{'Authorization':'Bearer '+SB_KEY,'apikey':SB_KEY,'Content-Type':file.type,'x-upsert':'true'},body:file
    });
    if(!res.ok)throw new Error('Upload failed');
    const url=`${SB_URL}/storage/v1/object/public/fundova-media/${path}`;
    input.dataset.url=url;
    urlEl.textContent='Uploaded!';
    urlEl.style.color='#0F6E56';
  }catch(e){urlEl.textContent='Upload failed: '+e.message;urlEl.style.color='#A32D2D';}
}

async function uploadWebinarFlyer(input){

  if(!file)return;

}

async function saveWebinar(id){
  const isEdit=!!id;
  const title=document.getElementById('wn-title').value.trim();
  const subtitle=document.getElementById('wn-subtitle').value.trim();
  const description=document.getElementById('wn-desc').value.trim();
  const event_date=document.getElementById('wn-date').value||null;
  const event_time=document.getElementById('wn-time').value.trim()||null;
  const zoom_link=document.getElementById('wn-zoom').value.trim()||null;
  const topicsRaw=document.getElementById('wn-topics').value.trim();
  const topics=topicsRaw?JSON.stringify(topicsRaw.split('\n').filter(t=>t.trim())):null;
  const status=document.getElementById('wn-status').value;
  const flyer_url=document.getElementById('wn-flyer')?.dataset?.url||null;
  const err=document.getElementById('wn-err');
  const btn=document.getElementById('wn-btn');

  if(!title){err.textContent='Title is required.';return;}

  // Build speakers array
  const speakers=[];
  for(let i=1;i<=3;i++){
    const name=document.getElementById('wn-sp'+i+'-name')?.value?.trim();
    const spTitle=document.getElementById('wn-sp'+i+'-title')?.value?.trim();
    const photo_url=document.getElementById('wn-sp'+i+'-photo')?.dataset?.url||null;
    if(name)speakers.push({name,title:spTitle||'',photo_url});
  }

  btn.innerHTML='<span class="spinner"></span> Saving…';btn.disabled=true;

  // If setting to active, deactivate all others first
  if(status==='active'){
    await sb('webinars?status=eq.active',{method:'PATCH',body:JSON.stringify({status:'past'})});
  }

  try{
    const payload={title,subtitle,description,event_date,event_time,zoom_link,topics,speakers:JSON.stringify(speakers),flyer_url,status};
    if(isEdit){
      await sb(`webinars?id=eq.${id}`,{method:'PATCH',body:JSON.stringify(payload)});
    } else {
      await sb('webinars',{method:'POST',body:JSON.stringify(payload)});
    }
    closeModal();
    toast('<i class="ti ti-check"></i> Webinar '+(isEdit?'updated':'created')+'!');
    await renderAdmin();
  }catch(e){err.textContent='Error saving.';btn.innerHTML='<i class="ti ti-device-floppy"></i> '+(isEdit?'Save changes':'Create webinar');btn.disabled=false;}
}

// Admin-only: record Ajo contributions (coordinators and members can no longer self-record)
async function buildAdminAjoGroupsSection(){
  const groups=await sb('savings_groups?status=eq.active&select=*&order=created_at.asc');
  if(!groups||!groups.length){
    return`<div class="card"><h3>Ajo groups — record contributions</h3><div class="empty">No active Ajo groups yet.</div></div>`;
  }
  const groupIds=groups.map(g=>g.id);
  const [allMembers,allContribs,allPayouts,coords]=await Promise.all([
    sb(`group_members?group_id=in.(${groupIds.join(',')})&select=*`),
    sb(`group_contributions?group_id=in.(${groupIds.join(',')})&select=*`),
    sb(`group_payouts?group_id=in.(${groupIds.join(',')})&select=*`),
    sb(`users?id=in.(${[...new Set(groups.map(g=>g.coordinator_id))].join(',')})&select=id,name`)
  ]);
  const coordMap={};(coords||[]).forEach(c=>{coordMap[c.id]=c.name;});
  const memberUserIds=[...new Set((allMembers||[]).map(m=>m.user_id))];
  let usersMap={};
  if(memberUserIds.length){
    const users=await sb(`users?id=in.(${memberUserIds.join(',')})&select=id,name,email`);
    users.forEach(u=>{usersMap[u.id]=u;});
  }

  const groupBlocks=groups.map(g=>{
    const gMembers=(allMembers||[]).filter(m=>m.group_id===g.id&&m.status!=='removed').sort((a,b)=>(a.payout_order||999)-(b.payout_order||999));
    if(!gMembers.length)return'';
    const gPayouts=(allPayouts||[]).filter(p=>p.group_id===g.id);
    const gContribsAll=(allContribs||[]).filter(c=>c.group_id===g.id);
    // The open period is purely calendar-driven now — it doesn't wait for any previous
    // period's payout to be resolved. Past periods that collected contributions but
    // never got a completed payout just sit in the backlog list below.
    const openCycle=getOpenCycleKey(g);
    const completedCycleKeys=new Set(gPayouts.filter(p=>p.status==='completed').map(p=>p.cycle));
    const pendingCycleKeys=new Set(gPayouts.filter(p=>p.status==='pending').map(p=>p.cycle));
    const closedCycleKeys=[...new Set(gContribsAll.filter(c=>c.status==='paid'&&c.cycle!==openCycle).map(c=>c.cycle))]
      .filter(k=>!completedCycleKeys.has(k)).sort();

    // Figure out WHY a backlog period hasn't been paid out, so admin doesn't have to
    // dig for it: a request is already sitting with admin, the rotation's next member
    // hasn't had a payout requested for them yet, the group isn't fully set up (not
    // enough members, or some members have no payout order assigned), or the whole
    // rotation is actually done and just needs resetting.
    const completedPayoutIds=new Set(gPayouts.filter(p=>p.status==='completed').map(p=>p.recipient_id));
    const unpaidMembersSorted=gMembers.filter(m=>!completedPayoutIds.has(m.id)).sort((a,b)=>(a.payout_order||999)-(b.payout_order||999));
    const nextPayoutMember=unpaidMembersSorted.length?unpaidMembersSorted[0]:null;
    const membersMissingOrder=gMembers.some(m=>!m.payout_order);
    const groupIncomplete=gMembers.length<g.max_members||membersMissingOrder;

    const backlogHtml=closedCycleKeys.map(ck=>{
      const pooled=gContribsAll.filter(c=>c.cycle===ck&&c.status==='paid').reduce((a,c)=>a+Number(c.amount),0);
      let reason;
      if(pendingCycleKeys.has(ck)){
        reason='a payout has been requested for this period and is awaiting your approval';
      } else if(!nextPayoutMember){
        reason='every member has already received a payout this rotation — reset the group to start a new one';
      } else {
        const nextName=(usersMap[nextPayoutMember.user_id]||{}).name||'the next member';
        reason=groupIncomplete
          ?`group isn't fully set up yet (${gMembers.length}/${g.max_members} members${membersMissingOrder?', payout order not set for everyone':''}) — once ready, it's ${nextName}'s turn`
          :`it's ${nextName}'s turn — the coordinator hasn't requested this payout yet`;
      }
      return`<div style="background:#FFFBEB;border:1px solid #FEF3C7;border-radius:8px;padding:8px 12px;margin-bottom:6px;font-size:12px;color:#856404;display:flex;justify-content:space-between;align-items:center">
        <span><i class="ti ti-clock"></i> ${cycleLabel(ck,g.rotation_frequency)} — ${fmt(pooled)} pooled, awaiting payout — ${reason}</span>
      </div>`;
    }).join('');

    // A quick note for cycles that HAVE already been paid out, so admin can see at a
    // glance who got paid for which period without opening payout history separately.
    const completedPayoutsHtml=gPayouts.filter(p=>p.status==='completed')
      .sort((a,b)=>String(a.cycle).localeCompare(String(b.cycle)))
      .map(p=>{
        const recipMember=(allMembers||[]).find(m=>m.id===p.recipient_id);
        const recipName=recipMember?(usersMap[recipMember.user_id]||{}).name:null;
        return`<div style="background:#ECFDF5;border:1px solid #D1FAE5;border-radius:8px;padding:8px 12px;margin-bottom:6px;font-size:12px;color:#065F46">
          <i class="ti ti-check"></i> ${cycleLabel(p.cycle,g.rotation_frequency)} payout of ${fmt(p.amount)} made to ${recipName||'a member no longer on this list'}${p.processed_at?' on '+fmtDate(p.processed_at):''}
        </div>`;
      }).join('');

    const rows=gMembers.map(m=>{
      const u=usersMap[m.user_id]||{name:'Unknown'};
      const gContribs=gContribsAll.filter(c=>c.member_id===m.id&&c.cycle===openCycle);
      const hasPaid=gContribs.some(c=>c.status==='paid');
      return`<tr>
        <td style="font-weight:500">${u.name}</td>
        <td>${fmt(m.contribution_amount)}</td>
        <td>${hasPaid?'<span class="status-pill pill-approved">Recorded</span>':'<span class="status-pill pill-pending">Not yet</span>'}</td>
        <td>${!hasPaid?`<button class="btn btn-sm btn-primary"
              data-mid="${m.id}" data-gid="${g.id}" data-amt="${m.contribution_amount}" data-cycle="${openCycle}"
              data-uid="${m.user_id}" data-order="${m.payout_order||''}" data-total="${gMembers.length}"
              data-gname="${(g.name||'').replace(/"/g,'&quot;')}" data-coordid="${g.coordinator_id||''}"
              onclick="adminRecordGroupContribution(this.dataset.mid,this.dataset.gid,Number(this.dataset.amt),this.dataset.cycle,this.dataset.uid,this.dataset.order?Number(this.dataset.order):null,Number(this.dataset.total),this.dataset.gname,this.dataset.coordid)">
              <i class="ti ti-plus"></i> Record</button>`:'<span style="color:#aaa;font-size:12px">—</span>'}</td>
      </tr>`;
    }).join('');
    return`<div style="margin-bottom:1.25rem">
      <div style="font-size:13px;font-weight:600;margin-bottom:6px">${g.name} <span style="font-weight:400;color:#888;font-size:12px">· Coordinator: ${coordMap[g.coordinator_id]||'—'} · ${g.rotation_frequency==='weekly'?'Weekly':'Monthly'} rotation · Now collecting: ${cycleLabel(openCycle,g.rotation_frequency)}</span></div>
      ${completedPayoutsHtml}
      ${backlogHtml}
      <div class="table-wrap"><table>
        <tr><th>Member</th><th>Expected</th><th>This period</th><th></th></tr>
        ${rows}
      </table></div>
    </div>`;
  }).join('');

  // Pending payout requests — a coordinator's "Request payout" click lands here until
  // admin approves or rejects it. Nothing is paid or promised to the member before that.
  const groupMap={};groups.forEach(g=>{groupMap[g.id]=g;});
  const memberMap={};(allMembers||[]).forEach(m=>{memberMap[m.id]=m;});
  const pendingPayouts=(allPayouts||[]).filter(p=>p.status==='pending');
  let pendingPayoutsHtml='';
  if(pendingPayouts.length){
    const rows=pendingPayouts.map(p=>{
      const g=groupMap[p.group_id]||{};
      const m=memberMap[p.recipient_id]||{};
      const u=usersMap[m.user_id]||{name:'Unknown'};
      return`<tr>
        <td style="font-weight:500">${u.name}</td>
        <td>${g.name||'—'}</td>
        <td>${fmt(p.amount)}</td>
        <td>${cycleLabel(p.cycle,g.rotation_frequency)}</td>
        <td style="font-size:12px;color:#888">${fmtDate(p.initiated_at||p.created_at)}</td>
        <td><div style="display:flex;gap:5px">
          <button class="btn btn-sm btn-primary" onclick="approveGroupPayout('${p.id}','${p.group_id}','${p.recipient_id}','${m.user_id||''}',${p.amount},'${p.cycle}','${(g.name||'').replace(/'/g,"\\'")}','${(u.name||'').replace(/'/g,"\\'")}')"><i class="ti ti-check"></i> Approve</button>
          <button class="btn btn-sm btn-danger" onclick="rejectGroupPayout('${p.id}','${p.group_id}','${(u.name||'').replace(/'/g,"\\'")}','${(g.name||'').replace(/'/g,"\\'")}','${g.coordinator_id||''}')"><i class="ti ti-x"></i> Reject</button>
        </div></td>
      </tr>`;
    }).join('');
    pendingPayoutsHtml=`<div class="card" style="margin-bottom:1.25rem;border:1px solid #FEF3C7;background:#FFFBEB">
      <h3 style="display:flex;align-items:center;gap:8px"><i class="ti ti-clock" style="color:#856404"></i> Ajo payouts awaiting your approval (${pendingPayouts.length})</h3>
      <div class="table-wrap"><table>
        <tr><th>Member</th><th>Group</th><th>Amount</th><th>Period</th><th>Requested</th><th></th></tr>
        ${rows}
      </table></div>
    </div>`;
  }

  return`${pendingPayoutsHtml}<div class="card">
    <h3>Ajo groups — record contributions</h3>
    <p style="font-size:12px;color:#888;margin-top:-8px;margin-bottom:1rem">Only admin records member contributions. Each group's collection period opens automatically on the calendar — a new round starts even if a prior round's payout hasn't been resolved yet (see the amber "awaiting payout" rounds within each group below). Coordinators request payouts from their <code>/ajo</code> dashboard; admin approves them above before anything is paid.</p>
    ${groupBlocks||'<div class="empty">No active group members yet.</div>'}
  </div>`;
}

function ordinal(n){
  n=Number(n);
  if(!n||isNaN(n))return'';
  const s=['th','st','nd','rd'],v=n%100;
  return n+(s[(v-20)%10]||s[v]||s[0]);
}

// ─── AJO CALENDAR CYCLES ───────────────────────────────────
// A group's rotation period is now driven purely by the calendar, not by whether the
// previous period's payout has been completed. Monthly groups open a new period on the
// 1st of each month; weekly groups open a new period every Monday. Cycle keys are plain
// strings ("2026-10" / "2026-W40") so they sort correctly as text and compare cleanly
// against each other regardless of how far a group has advanced.

function isoWeekKey(date){
  const d=new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()));
  const day=(d.getUTCDay()+6)%7; // Mon=0..Sun=6
  d.setUTCDate(d.getUTCDate()-day+3); // nearest Thursday fixes ISO week/year edge cases
  const isoYear=d.getUTCFullYear();
  const jan4=new Date(Date.UTC(isoYear,0,4));
  const week=1+Math.round(((d-jan4)/86400000-3+((jan4.getUTCDay()+6)%7))/7);
  return `${isoYear}-W${String(week).padStart(2,'0')}`;
}
function monthKey(date){
  return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}`;
}
function getOpenCycleKey(group,atDate){
  const d=atDate||new Date();
  return group&&group.rotation_frequency==='weekly'?isoWeekKey(d):monthKey(d);
}
function cycleLabel(key,frequency){
  if(!key)return'—';
  key=String(key);
  if(/^\d{4}-W\d{2}$/.test(key)){
    const [y,w]=key.split('-W').map(Number);
    // Monday of that ISO week
    const jan4=new Date(Date.UTC(y,0,4));
    const jan4Day=(jan4.getUTCDay()+6)%7;
    const monday=new Date(jan4); monday.setUTCDate(jan4.getUTCDate()-jan4Day+(w-1)*7);
    const sunday=new Date(monday); sunday.setUTCDate(monday.getUTCDate()+6);
    const fmtOpt={month:'short',day:'numeric'};
    return `Week of ${monday.toLocaleDateString('en-GB',fmtOpt)}–${sunday.toLocaleDateString('en-GB',fmtOpt)}, ${y}`;
  }
  if(/^\d{4}-\d{2}$/.test(key)){
    const [y,m]=key.split('-').map(Number);
    return new Date(y,m-1,1).toLocaleDateString('en-GB',{month:'long',year:'numeric'});
  }
  // Legacy cycle value from before calendar-based cycles (a plain number like "1", "2")
  // — not a date at all, so just label it plainly instead of trying (and failing) to
  // parse it as one.
  return `Cycle ${key}`;
}

async function adminRecordGroupContribution(memberId,groupId,amount,cycle,userId,payoutOrder,totalMembers,groupName,coordinatorId){
  if(!confirm(`Record payment of ${fmt(amount)} for this member?`))return;
  try{
    const today=new Date().toISOString().split('T')[0];
    await sb('group_contributions',{method:'POST',body:JSON.stringify({group_id:groupId,member_id:memberId,amount,cycle,status:'paid',date:today})});
    toast('<i class="ti ti-check"></i> Contribution recorded!');
    await renderAdmin();

    const posText=payoutOrder?`You're ${ordinal(payoutOrder)} in line${totalMembers?' of '+totalMembers+' members':''} to collect the payout this cycle.`:'';

    // Notify the member whose contribution was recorded — email + in-app bell
    (async()=>{
      try{
        const memberArr=await sb(`users?id=eq.${userId}&select=name,email`);
        if(memberArr&&memberArr.length){
          const mem=memberArr[0];
          const title=`Ajo contribution recorded — ${groupName}`;
          const detail=`Your contribution of ${fmt(amount)} to "${groupName}" (cycle ${cycle}) has been recorded. ${posText}`;
          await addNotification(userId,title+': '+detail,'ajo');
        }
      }catch(e){logSystemError('notify:group_contribution:member',e);}

      // Notify the group's coordinator too, so they can track the cycle
      if(coordinatorId){
        try{
          const coordArr=await sb(`users?id=eq.${coordinatorId}&select=name,email`);
          const memberNameArr=await sb(`users?id=eq.${userId}&select=name`);
          const memberName=(memberNameArr&&memberNameArr.length)?memberNameArr[0].name:'A member';
          if(coordArr&&coordArr.length){
            const coord=coordArr[0];
            const title=`Contribution recorded in ${groupName}`;
            const detail=`${memberName}'s contribution of ${fmt(amount)} for cycle ${cycle} in "${groupName}" has been recorded by the admin.`;
            await addNotification(coordinatorId,title+': '+detail,'coordinator');
          }
        }catch(e){logSystemError('notify:group_contribution:coordinator',e);}
      }
    })();
  }catch(e){alert('Error recording contribution: '+e.message);}
}

// Shared coordinator-facing group card — used by the embedded dashboard section and the dedicated /ajo page
function buildAjoGroupCard(g,allMembers,allContribs,allPayouts,membersMap){
  const gMembers=(allMembers||[]).filter(m=>m.group_id===g.id&&m.status!=='removed').sort((a,b)=>a.payout_order-b.payout_order);
  const gPayouts=(allPayouts||[]).filter(p=>p.group_id===g.id);
  const gContribsAll=(allContribs||[]).filter(c=>c.group_id===g.id);
  const completedPayoutIds=new Set(gPayouts.filter(p=>p.status==='completed').map(p=>p.recipient_id));
  const pendingPayoutIds=new Set(gPayouts.filter(p=>p.status==='pending').map(p=>p.recipient_id));
  const totalExpected=gMembers.reduce((a,m)=>a+Number(m.contribution_amount),0);

  // The collection period is purely calendar-driven now — it opens automatically and
  // doesn't wait for the previous period's payout to be resolved. A payout request
  // targets the OLDEST closed period that collected contributions but hasn't been paid
  // out yet (the backlog), never the period that's still open for collection.
  const openCycle=getOpenCycleKey(g);
  const completedCycleKeys=new Set(gPayouts.filter(p=>p.status==='completed').map(p=>p.cycle));
  const pendingCycleKeys=new Set(gPayouts.filter(p=>p.status==='pending').map(p=>p.cycle));
  const closedCycleKeys=[...new Set(gContribsAll.filter(c=>c.status==='paid'&&c.cycle!==openCycle).map(c=>c.cycle))]
    .filter(k=>!completedCycleKeys.has(k)).sort();
  const payoutCycle=closedCycleKeys.length?closedCycleKeys[0]:null;
  const payoutCyclePending=payoutCycle&&pendingCycleKeys.has(payoutCycle);
  const backlogCount=closedCycleKeys.length;

  const unpaidMembers=gMembers.filter(m=>!completedPayoutIds.has(m.id)).sort((a,b)=>(a.payout_order||999)-(b.payout_order||999));
  const nextPayoutMemberId=unpaidMembers.length?unpaidMembers[0].id:null;

  // The payout is the FULL POOL for the targeted cycle — every member's contribution
  // combined — not just the recipient's own contribution. An Ajo/rotating group pools
  // everyone's money each cycle and pays the whole pot to whoever's turn it is; it's not
  // a per-member payout of their own savings.
  const payoutCycleContribs=payoutCycle?gContribsAll.filter(c=>c.cycle===payoutCycle&&c.status==='paid'):[];
  const cyclePooledAmount=payoutCycleContribs.reduce((a,c)=>a+Number(c.amount),0);
  const allMembersPaidPayoutCycle=payoutCycle?gMembers.every(m=>payoutCycleContribs.some(c=>c.member_id===m.id)):false;
  const canRequestPayout=!!(payoutCycle&&allMembersPaidPayoutCycle&&!payoutCyclePending);

  const membersMissingOrder=gMembers.some(m=>!m.payout_order);
  const groupIncomplete=gMembers.length<g.max_members||membersMissingOrder;
  const backlogHtml=closedCycleKeys.map(ck=>{
    const pooled=gContribsAll.filter(c=>c.cycle===ck&&c.status==='paid').reduce((a,c)=>a+Number(c.amount),0);
    let reason;
    if(ck!==payoutCycle){
      reason='waiting its turn behind an earlier period';
    } else if(payoutCyclePending){
      reason='payout requested — awaiting admin approval';
    } else if(!allMembersPaidPayoutCycle){
      reason=groupIncomplete
        ?`group isn't fully set up yet (${gMembers.length}/${g.max_members} members${membersMissingOrder?', payout order not set for everyone':''}) — not everyone has contributed this period`
        :"not everyone has contributed this period yet — pool isn't complete";
    } else {
      reason='ready to request payout below';
    }
    return`<div style="background:#FFFBEB;border:1px solid #FEF3C7;border-radius:8px;padding:8px 12px;margin-bottom:6px;font-size:12px;color:#856404">
      <i class="ti ti-clock"></i> ${cycleLabel(ck,g.rotation_frequency)} — ${fmt(pooled)} pooled, ${reason}
    </div>`;
  }).join('');

  const memberRows=gMembers.map(m=>{
    const u=membersMap[m.user_id]||{name:'Unknown'};
    const hasPaidOut=completedPayoutIds.has(m.id);
    const hasPendingPayout=pendingPayoutIds.has(m.id);
    const gContribsOpen=gContribsAll.filter(c=>c.member_id===m.id&&c.cycle===openCycle);
    const hasPaidOpen=gContribsOpen.some(c=>c.status==='paid');
    const isNextInLine=!hasPaidOut&&m.id===nextPayoutMemberId;
    const nameSafe=(u.name||'Unknown').replace(/"/g,'&quot;');
    return`<tr style="${hasPaidOut?'opacity:0.5':''}">
      <td>
        <div style="font-weight:500">${u.name} ${hasPaidOut?'<span style="font-size:10px;background:#D1FAE5;color:#065F46;padding:1px 6px;border-radius:10px">Paid out</span>':''}${hasPendingPayout?'<span style="font-size:10px;background:#FEF3C7;color:#856404;padding:1px 6px;border-radius:10px;margin-left:4px">Awaiting admin approval</span>':''}${isNextInLine&&!hasPendingPayout?'<span style="font-size:10px;background:#FEF3C7;color:#856404;padding:1px 6px;border-radius:10px;margin-left:4px">Next in line</span>':''}</div>
        <div style="font-size:11px;color:#888">${u.phone||u.email||''}</div>
      </td>
      <td style="font-weight:500">${fmt(m.contribution_amount)}</td>
      <td>${m.payout_order||'—'}</td>
      <td>${hasPaidOpen
        ?'<span class="status-pill pill-approved">Paid</span>'
        :'<span class="status-pill pill-pending">Pending</span>'}</td>
      <td><div style="display:flex;gap:4px;justify-content:flex-end">
        ${!hasPaidOut&&hasPendingPayout?`<button class="btn btn-sm" disabled title="Waiting on admin approval" style="opacity:.5;cursor:not-allowed"><i class="ti ti-clock"></i> Awaiting approval</button>`:''}
        ${!hasPaidOut&&!hasPendingPayout&&isNextInLine&&canRequestPayout?`<button class="btn btn-sm" style="background:#0F6E56;color:#fff" data-gid="${g.id}" data-mid="${m.id}" data-name="${nameSafe}" data-amt="${cyclePooledAmount}" data-cycle="${payoutCycle}" onclick="initiateGroupPayout(this.dataset.gid,this.dataset.mid,this.dataset.name,Number(this.dataset.amt),this.dataset.cycle)"><i class="ti ti-cash"></i> Request payout (${fmt(cyclePooledAmount)})</button>`:''}
        ${!hasPaidOut&&!hasPendingPayout&&isNextInLine&&!canRequestPayout?`<button class="btn btn-sm" disabled title="${payoutCycle?(payoutCyclePending?'A payout for that period is already awaiting admin approval':"Not everyone had contributed for that period — pool isn't complete"):'No completed collection period is awaiting payout yet'}" style="opacity:.4;cursor:not-allowed"><i class="ti ti-cash"></i> Request payout</button>`:''}
        ${!hasPaidOut&&!hasPendingPayout&&!isNextInLine&&canRequestPayout?`<button class="btn btn-sm" disabled title="Not this member's turn yet" style="opacity:.4;cursor:not-allowed"><i class="ti ti-cash"></i> Request payout</button><button class="btn btn-sm" title="Coordinator override: request payout out of turn (full pool: ${fmt(cyclePooledAmount)})" data-gid="${g.id}" data-mid="${m.id}" data-name="${nameSafe}" data-amt="${cyclePooledAmount}" data-cycle="${payoutCycle}" onclick="initiateGroupPayout(this.dataset.gid,this.dataset.mid,this.dataset.name,Number(this.dataset.amt),this.dataset.cycle,true)" style="color:#856404"><i class="ti ti-alert-triangle"></i></button>`:''}
        ${!hasPaidOut&&!hasPendingPayout&&!isNextInLine&&!canRequestPayout?`<button class="btn btn-sm" disabled title="Not this member's turn yet" style="opacity:.4;cursor:not-allowed"><i class="ti ti-cash"></i> Request payout</button>`:''}
        ${!hasPaidOut?`<button class="btn btn-sm btn-danger" title="Remove member" onclick="removeGroupMember('${m.id}','${g.id}')"><i class="ti ti-user-x"></i></button>`:''}
      </div></td>
    </tr>`;
  }).join('');

  const totalSaved=(allContribs||[]).filter(c=>c.group_id===g.id&&c.status==='paid').reduce((a,c)=>a+Number(c.amount),0);
  const goalPct=g.savings_goal?Math.min(100,Math.round((totalSaved/g.savings_goal)*100)):null;

  return`<div class="card" style="margin-bottom:1rem">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px">
      <div>
        <h3 style="font-size:15px;margin-bottom:4px">${g.name}</h3>
        <div style="font-size:12px;color:#888">${g.description||''} ${g.description?'· ':''}${g.rotation_frequency==='weekly'?'Weekly':'Monthly'} rotation · Now collecting: ${cycleLabel(openCycle,g.rotation_frequency)}</div>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn btn-sm btn-edit" onclick="openEditGroup('${g.id}')"><i class="ti ti-pencil"></i></button>
        ${gMembers.length>=g.max_members
          ?`<button class="btn btn-sm" disabled title="Group is full (${gMembers.length}/${g.max_members}). Edit the group to raise the member cap." style="opacity:.5;cursor:not-allowed"><i class="ti ti-users"></i> Group full</button>`
          :`<button class="btn btn-sm btn-primary" data-gid="${g.id}" data-gname="${g.name}" onclick="openInviteMember(this.dataset.gid,this.dataset.gname)"><i class="ti ti-user-plus"></i> Invite member</button>`}
        ${unpaidMembers.length===0&&gMembers.length?`<button class="btn btn-sm" title="All members paid out — start a new rotation" onclick="resetGroupCycle('${g.id}')"><i class="ti ti-refresh"></i> Reset for new cycle</button>`:''}
        <button class="btn btn-sm btn-danger" title="Close group" onclick="closeAjoGroup('${g.id}')"><i class="ti ti-x"></i></button>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:12px">
      <div class="stat" style="padding:10px 12px"><div class="stat-label">Members</div><div style="font-size:15px;font-weight:600${gMembers.length>=g.max_members?';color:#856404':''}">${gMembers.length}/${g.max_members}${gMembers.length>=g.max_members?' <span style="font-size:10px;font-weight:600">(Full)</span>':''}</div></div>
      <div class="stat" style="padding:10px 12px"><div class="stat-label">Awaiting payout</div><div style="font-size:15px;font-weight:600${backlogCount?';color:#856404':''}">${backlogCount} period${backlogCount===1?'':'s'}</div></div>
      <div class="stat" style="padding:10px 12px"><div class="stat-label">Total saved</div><div style="font-size:15px;font-weight:600;color:#0F6E56">${fmt(totalSaved)}</div></div>
      <div class="stat" style="padding:10px 12px"><div class="stat-label">Expected/period</div><div style="font-size:15px;font-weight:600">${fmt(totalExpected)}</div></div>
      <div class="stat" style="padding:10px 12px"><div class="stat-label">${payoutCycle?'Next payout pool':'Pooled, open period'}</div><div style="font-size:15px;font-weight:600;color:${payoutCycle?(allMembersPaidPayoutCycle?'#0F6E56':'#856404'):'#888'}">${payoutCycle?fmt(cyclePooledAmount):fmt(gContribsAll.filter(c=>c.cycle===openCycle&&c.status==='paid').reduce((a,c)=>a+Number(c.amount),0))}</div></div>
    </div>
    ${goalPct!==null?`
    <div style="background:#f5f5f3;border-radius:8px;height:6px;overflow:hidden;margin-bottom:4px">
      <div style="height:100%;background:#1D9E75;width:${goalPct}%"></div>
    </div>
    <div style="font-size:11px;color:#888;margin-bottom:12px">${goalPct}% of group goal ${fmt(g.savings_goal)}</div>`:''}
    ${backlogHtml}
    ${gMembers.length?`<div class="table-wrap"><table>
      <tr><th>Member</th><th>Contribution</th><th>Payout order</th><th>Open period</th><th></th></tr>
      ${memberRows}
    </table></div>`:'<div class="empty" style="padding:1rem">No members yet. Invite your first members!</div>'}
    ${gPayouts.length?`
    <div style="margin-top:12px">
      <div style="font-size:12px;font-weight:600;color:#888;text-transform:uppercase;margin-bottom:8px">Payout history</div>
      <div class="table-wrap"><table>
        <tr><th>Recipient</th><th>Amount</th><th>Period</th><th>Status</th><th>Date</th></tr>
        ${gPayouts.map(p=>{
          const m=gMembers.find(gm=>gm.id===p.recipient_id);
          const u=m?membersMap[m.user_id]:{name:'Unknown'};
          return`<tr style="${p.status==='completed'?'opacity:0.6':''}">
            <td style="font-weight:500">${u.name} ${p.status==='completed'?'<span style="font-size:10px;background:#D1FAE5;color:#065F46;padding:1px 6px;border-radius:10px">Done</span>':''}</td>
            <td>${fmt(p.amount)}</td>
            <td>${cycleLabel(p.cycle,g.rotation_frequency)}</td>
            <td>${p.status==='completed'?'<span class="status-pill pill-approved">Completed</span>':(p.status==='rejected'?'<span class="status-pill pill-rejected">Rejected</span>':'<span class="status-pill pill-pending">Pending</span>')}</td>
            <td>${p.processed_at?fmtDate(p.processed_at):'—'}</td>
          </tr>`;
        }).join('')}
      </table></div>
    </div>`:''}
  </div>`;
}

          <div class="stat"><div class="stat-label">Funds currently held</div><div class="stat-val green">${fmt(totalFundsHeld)}</div></div>
        </div>`;
        const cards=coordGroups.map(g=>buildAjoGroupCard(g,allMembers,allContribs,allPayouts,membersMap)).join('');

        <div class="empty">

        </div>
      </div>`;
    } else if(showCoordinator&&showMember){

        <div style="display:flex;gap:6px;margin-bottom:1.25rem;background:#ece9e6;padding:3px;border-radius:9px;width:fit-content" id="ajo-tabs">
          <button class="tab active" id="ajo-tab-coord" onclick="switchAjoTab('coord')">My groups (coordinator)</button>
          <button class="tab" id="ajo-tab-member" onclick="switchAjoTab('member')">Groups I'm in</button>
        </div>
        <div id="ajo-panel-coord">${coordSectionHtml}</div>
        <div id="ajo-panel-member" style="display:none">${memberSectionHtml}</div>
      `;
    } else if(showCoordinator){
      bodyHtml=coordSectionHtml;
    } else {
      bodyHtml=memberSectionHtml;
    }

    <div style="max-width:920px;margin:0 auto;padding:1.5rem 1rem 3rem">

// Member-facing view: position, this-cycle contribution status, next expected payout, per group
async function buildAjoMemberView(activeMemberships){
  const groupIds=[...new Set(activeMemberships.map(m=>m.group_id))];
  const [groups,allMembers,allContribs,allPayouts]=await Promise.all([
    sb(`savings_groups?id=in.(${groupIds.join(',')})&select=*`),
    sb(`group_members?group_id=in.(${groupIds.join(',')})&select=*`),
    sb(`group_contributions?group_id=in.(${groupIds.join(',')})&select=*`),
    sb(`group_payouts?group_id=in.(${groupIds.join(',')})&select=*`)
  ]);
  const groupsMap={};(groups||[]).forEach(g=>{groupsMap[g.id]=g;});
  const coordIds=[...new Set((groups||[]).map(g=>g.coordinator_id).filter(Boolean))];
  let coordMap={};
  if(coordIds.length){
    const coords=await sb(`users?id=in.(${coordIds.join(',')})&select=id,name`);
    (coords||[]).forEach(c=>{coordMap[c.id]=c.name;});
  }

  const cards=activeMemberships.map(m=>{
    const g=groupsMap[m.group_id];
    if(!g)return'';
    const gMembers=(allMembers||[]).filter(mm=>mm.group_id===g.id&&mm.status!=='removed').sort((a,b)=>(a.payout_order||999)-(b.payout_order||999));
    const gPayouts=(allPayouts||[]).filter(p=>p.group_id===g.id);
    const gContribsAll=(allContribs||[]).filter(c=>c.group_id===g.id);
    const completedPayoutIds=new Set(gPayouts.filter(p=>p.status==='completed').map(p=>p.recipient_id));
    // Collection periods are calendar-driven — this doesn't wait on a prior period's payout.
    const openCycle=getOpenCycleKey(g);
    const completedCycleKeys=new Set(gPayouts.filter(p=>p.status==='completed').map(p=>p.cycle));
    const backlogCount=[...new Set(gContribsAll.filter(c=>c.status==='paid'&&c.cycle!==openCycle).map(c=>c.cycle))]
      .filter(k=>!completedCycleKeys.has(k)).length;
    const unpaidMembers=gMembers.filter(mm=>!completedPayoutIds.has(mm.id)).sort((a,b)=>(a.payout_order||999)-(b.payout_order||999));
    const myUnpaidRank=unpaidMembers.findIndex(mm=>mm.id===m.id);
    const hasPaidOut=completedPayoutIds.has(m.id);
    const gContribs=gContribsAll.filter(c=>c.member_id===m.id&&c.cycle===openCycle);
    const hasPaidThisCycle=gContribs.some(c=>c.status==='paid');

    let payoutStatusHtml;
    if(hasPaidOut){
      payoutStatusHtml=`<div style="background:#D1FAE5;color:#065F46;border-radius:8px;padding:10px 12px;font-size:13px"><i class="ti ti-check"></i> You've received your payout for this rotation.</div>`;
    } else if(myUnpaidRank===0){
      payoutStatusHtml=`<div style="background:#FEF3C7;color:#856404;border-radius:8px;padding:10px 12px;font-size:13px;font-weight:600"><i class="ti ti-star"></i> You're next in line for payout!</div>`;
    } else if(myUnpaidRank>0){
      payoutStatusHtml=`<div style="background:#f5f5f3;color:#555;border-radius:8px;padding:10px 12px;font-size:13px">${myUnpaidRank} member${myUnpaidRank!==1?'s':''} ahead of you before your payout.</div>`;
    } else {
      payoutStatusHtml=`<div style="background:#f5f5f3;color:#555;border-radius:8px;padding:10px 12px;font-size:13px">Waiting on this group's payout order.</div>`;
    }

    return`<div class="card" style="margin-bottom:1rem">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <div>
          <h3 style="font-size:15px;margin-bottom:2px">${g.name}</h3>
          <div style="font-size:12px;color:#888">Coordinated by ${coordMap[g.coordinator_id]||'—'}</div>
        </div>
        <span class="status-pill ${hasPaidThisCycle?'pill-approved':'pill-pending'}">${hasPaidThisCycle?'Paid this period':'Pending'}</span>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:10px">
        <div class="stat" style="padding:10px 12px"><div class="stat-label">Your position</div><div style="font-size:15px;font-weight:600">${m.payout_order||'—'}</div></div>
        <div class="stat" style="padding:10px 12px"><div class="stat-label">Your contribution</div><div style="font-size:15px;font-weight:600">${fmt(m.contribution_amount)}</div></div>
        <div class="stat" style="padding:10px 12px"><div class="stat-label">Now collecting</div><div style="font-size:13px;font-weight:600">${cycleLabel(openCycle,g.rotation_frequency)}</div></div>
        <div class="stat" style="padding:10px 12px"><div class="stat-label">Payout when it's your turn</div><div style="font-size:15px;font-weight:600;color:#0F6E56">${fmt(gMembers.reduce((a,mm)=>a+Number(mm.contribution_amount),0))}</div></div>
      </div>
      ${backlogCount>0?`<div style="background:#FFFBEB;color:#856404;border-radius:8px;padding:8px 12px;font-size:12px;margin-bottom:8px"><i class="ti ti-clock"></i> ${backlogCount} earlier period${backlogCount===1?'':'s'} ${backlogCount===1?'has':'have'} finished collecting and ${backlogCount===1?'is':'are'} waiting on your coordinator to request its payout.</div>`:''}
      ${payoutStatusHtml}
    </div>`;
  }).join('');

  return`<div>
    <div class="info-box" style="margin-bottom:1.25rem"><i class="ti ti-info-circle"></i> Contributions are recorded by Fundova admin after payment is confirmed — please allow up to 24 hours for a payment to show as "Paid" here.</div>
    ${cards}
  </div>`;
}

async function saveGroup(id){

  const savings_goal=parseFloat(document.getElementById('cg-goal').value)||null;
  const err=document.getElementById('cg-err');
  const btn=document.getElementById('cg-btn');
  if(!name){err.textContent='Group name is required.';return;}
  btn.innerHTML='<span class="spinner"></span> Saving…';btn.disabled=true;
  try{
    if(id){
      await sb(`savings_groups?id=eq.${id}`,{method:'PATCH',body:JSON.stringify({name,description,max_members,rotation_frequency,savings_goal})});
    } else {
      await sb('savings_groups',{method:'POST',body:JSON.stringify({coordinator_id:currentUser.id,name,description,max_members,rotation_frequency,savings_goal,status:'active'})});

  }catch(e){err.textContent='Error saving group.';btn.innerHTML='<i class="ti ti-device-floppy"></i> '+(id?'Save':'Create group');btn.disabled=false;}

async function addGroupMember(groupId){
  const email=document.getElementById('gm-email').value.trim().toLowerCase();
  const contribution_amount=parseFloat(document.getElementById('gm-amount').value);
  const payout_order=parseInt(document.getElementById('gm-order').value)||null;
  const err=document.getElementById('gm-err');
  const btn=document.getElementById('gm-btn');
  if(!email||!contribution_amount){err.textContent='Email and contribution amount are required.';return;}
  btn.innerHTML='<span class="spinner"></span> Adding…';btn.disabled=true;
  try{
    const [groupArr,activeMembers]=await Promise.all([
      sb(`savings_groups?id=eq.${groupId}&select=max_members`),
      sb(`group_members?group_id=eq.${groupId}&status=eq.active&select=id`)
    ]);
    const maxMembers=groupArr&&groupArr.length?groupArr[0].max_members:null;
    if(maxMembers&&activeMembers&&activeMembers.length>=maxMembers){
      err.textContent=`This group is full (${activeMembers.length}/${maxMembers}). Edit the group to raise the member cap first.`;
      btn.innerHTML='<i class="ti ti-user-plus"></i> Add member';btn.disabled=false;return;
    }
    const users=await sb(`users?email=eq.${email}&role=eq.contributor&select=id`);
    if(!users||!users.length){err.textContent='No contributor found with that email.';btn.innerHTML='<i class="ti ti-user-plus"></i> Add member';btn.disabled=false;return;}
    await sb('group_members',{method:'POST',body:JSON.stringify({group_id:groupId,user_id:users[0].id,contribution_amount,payout_order,status:'active'})});
    closeModal();
    toast('<i class="ti ti-check"></i> Member added to group!');
    if(window.location.pathname==='/ajo')await renderAjoPage();else await renderContributor();
  }catch(e){err.textContent='Error adding member.';btn.innerHTML='<i class="ti ti-user-plus"></i> Add member';btn.disabled=false;}
}

const ANN_AUDIENCES=[
  {k:'all',label:'All cooperative members'},
  {k:'active',label:'Active members (those with savings)'},
  {k:'inactive',label:'Inactive members (never contributed)'},
  {k:'food',label:'Food scheme members'},
  {k:'ajo',label:'Ajo members'},
  {k:'invest',label:'Investment subscribers'}
];
let _annBase=null;
async function annFetchAll(path){
  const out=[];let off=0;
  for(let i=0;i<20;i++){
    const part=await sb(path+(path.includes('?')?'&':'?')+`limit=5000&offset=${off}`).catch(()=>[]);
    if(!Array.isArray(part))break;
    out.push(...part);if(part.length<5000)break;off+=5000;
  }
  return out;
}
async function annLoadBase(){
  const [users,pays,food,gm,inv]=await Promise.all([
    annFetchAll('users?role=eq.contributor&select=id,name,email,status'),
    annFetchAll('payments?select=user_id,withdrawn'),
    annFetchAll('food_scheme_enrollments?status=eq.opted_in&select=user_id'),
    annFetchAll('group_members?status=eq.active&select=user_id'),
    annFetchAll('investment_reservations?status=not.in.(cancelled,rejected)&select=user_id')
  ]);
  const members=users.filter(u=>u.status!=='revoked'&&u.status!=='closed'&&u.email);
  const set=a=>new Set(a.map(x=>String(x.user_id)));
  const ever=set(pays), active=set(pays.filter(x=>x.withdrawn!==true));
  _annBase={members,sets:{all:null,active,inactive:null,food:set(food),ajo:set(gm),invest:set(inv)},ever};
}
// people in several selected groups appear once
function annResolve(keys){
  if(!_annBase)return [];
  const seen=new Set(), out=[];
  for(const u of _annBase.members){
    const id=String(u.id);
    const hit=keys.some(k=>k==='all'||(k==='inactive'?!_annBase.ever.has(id):_annBase.sets[k].has(id)));
    if(hit&&!seen.has(id)){seen.add(id);out.push(u);}
  }
  return out;
}
function annSelectedKeys(){return ANN_AUDIENCES.map(a=>a.k).filter(k=>{const e=document.getElementById('ann-aud-'+k);return e&&e.checked;});}
function annUpdateCount(){
  const el=document.getElementById('be-count');if(!el)return;
  if(!_annBase){el.textContent='Loading recipient count...';return;}
  const keys=annSelectedKeys();
  const n=keys.length?annResolve(keys).length:0;
  el.innerHTML=keys.length?`This will reach <strong>${n}</strong> member${n!==1?'s':''}.`:'Choose at least one audience.';
}

async function sendBroadcastEmail(){
  const subject=document.getElementById('be-subject').value.trim();
  const body=document.getElementById('be-body').value.trim();
  const image_url=document.getElementById('be-image')?.dataset?.url||null;
  const err=document.getElementById('be-err');
  const btn=document.getElementById('be-btn');
  const label='<i class="ti ti-send"></i> Send announcement';
  const keys=annSelectedKeys();
  const byEmail=document.getElementById('ann-ch-email').checked, byApp=document.getElementById('ann-ch-app').checked;
  err.textContent='';
  if(!_annBase){err.textContent='Still loading the member list. Please wait a moment.';return;}
  if(!keys.length){err.textContent='Choose at least one audience.';return;}
  if(!byEmail&&!byApp){err.textContent='Choose email, in-app and phone alert, or both.';return;}
  if(!subject){err.textContent='Please enter a subject.';return;}
  if(!body){err.textContent='Please write a message.';return;}
  const users=annResolve(keys);
  if(!users.length){err.textContent='No members match this audience.';return;}
  if(!confirm(`Send this announcement to ${users.length} member${users.length!==1?'s':''}${byEmail&&byApp?' by email and in-app/phone alert':byEmail?' by email':' as an in-app notice and phone alert'}? This cannot be undone.`))return;
  btn.innerHTML='<span class="spinner"></span> Sending…';btn.disabled=true;
  try{
    let emailed=0,failed=0,inApp=0;
    if(byApp){
      const ids=users.map(u=>String(u.id));
      const text='📣 '+subject+' — '+body.replace(/\s+/g,' ').slice(0,260);
      for(let i=0;i<ids.length;i+=500){
        const r=await alertsPost({action:'announce',user_ids:ids.slice(i,i+500),message:text});
        if(r.ok){const j=await r.json().catch(()=>({}));inApp+=j.saved||0;}
      }
    }
    if(byEmail){
      let done=0;
      for(const u of users){
        try{
          const r=await fetch('/.netlify/functions/send-email',{method:'POST',headers:authHeaders(),body:JSON.stringify({type:'announcement',to:u.email,name:u.name,subject,body,image_url})});
          if(r.ok)emailed++;else failed++;
        }catch(e){failed++;}
        done++;btn.innerHTML=`<span class="spinner"></span> Sending emails… ${done}/${users.length}`;
      }
    }
    closeModal();
    toast(`<i class="ti ti-check"></i> Announcement sent${byApp?' · '+inApp+' in-app':''}${byEmail?' · '+emailed+' emailed':''}${failed>0?' ('+failed+' emails failed)':''}.`);
  }catch(e){
    err.textContent='Error: '+e.message;btn.innerHTML=label;btn.disabled=false;
  }
}

let surplusContributors = [];
let surplusTotalSavings = 0;

async function previewSurplus(){
  const amount = parseFloat(document.getElementById('sd-amount')?.value || 0);
  const preview = document.getElementById('sd-preview');
  const totalEl = document.getElementById('sd-total');
  const countEl = document.getElementById('sd-count');
  if(!preview)return;

  if(!surplusContributors.length){
    try{
      const [contributors, payments] = await Promise.all([
        sb('users?role=eq.contributor&select=id,name,email'),
        sb('payments?withdrawn=eq.false&moved_at=is.null&select=user_id,amount,is_interest')
      ]);
      surplusContributors = contributors || [];
      // Calculate each contributor's savings
      surplusContributors = surplusContributors.map(c => {
        const cPayments = (payments||[]).filter(p => p.user_id === c.id && !p.is_interest);
        const savings = cPayments.reduce((a,p) => a + Number(p.amount), 0);
        return {...c, savings};
      }).filter(c => c.savings > 0);
      surplusTotalSavings = surplusContributors.reduce((a,c) => a + c.savings, 0);
    }catch(e){}
  }

  if(amount > 0 && preview){
    totalEl.textContent = fmt(amount);
    countEl.textContent = surplusContributors.length;
    preview.style.display = 'block';
  }
}

async function processSurplusDistribution(){
  const amount = parseFloat(document.getElementById('sd-amount').value);
  const description = document.getElementById('sd-desc').value.trim();
  const err = document.getElementById('sd-err');
  const btn = document.getElementById('sd-btn');

  if(!amount||amount<=0){err.textContent='Please enter a valid amount.';return;}
  if(!description){err.textContent='Please enter a description.';return;}
  if(!surplusContributors.length){err.textContent='No eligible contributors found.';return;}
  if(!confirm(`Distribute ${fmt(amount)} to ${surplusContributors.length} contributors? This cannot be undone.`))return;

  btn.innerHTML='<span class="spinner"></span> Distributing…';btn.disabled=true;

  try{
    const today = new Date().toISOString().split('T')[0];
    let distributed = 0;

    for(const c of surplusContributors){
      const share = +((c.savings / surplusTotalSavings) * amount).toFixed(2);
      if(share > 0){
        await sb('cooperative_bonuses', {method:'POST', body:JSON.stringify({
          user_id: c.id,
          amount: share,
          description,
          date: today,
          status: 'available'
        })});
        distributed++;
      }
      btn.innerHTML = `<span class="spinner"></span> Distributing… ${distributed}/${surplusContributors.length}`;
    }

    surplusContributors = [];
    surplusTotalSavings = 0;
    closeModal();
    toast(`<i class="ti ti-check"></i> Surplus distributed to ${distributed} contributors!`);
    await renderAdmin();
  }catch(e){
    err.textContent = 'Error distributing: '+e.message;
    btn.innerHTML = '<i class="ti ti-gift"></i> Distribute surplus';
    btn.disabled = false;
  }
}

async function calculateAndCreditCoordinatorBonus(groupId, coordinatorId, payoutAmount, daysHeld){
  try{
    // Calculate interest the payout amount would have generated
    const weekdays = Math.round(daysHeld * 5/7); // approximate weekdays
    const interestGenerated = payoutAmount * 0.10 * (weekdays / 261);
    const coordinatorBonus = +(interestGenerated * 0.50).toFixed(2);

    if(coordinatorBonus <= 0)return;

    const today = new Date().toISOString().split('T')[0];
    // Credit to coordinators savings
    await sb('payments',{method:'POST',body:JSON.stringify({
      user_id: coordinatorId,
      amount: coordinatorBonus,
      date: today,
      withdrawn: false
    })});

    // Record in coordinator earnings table
    await sb('coordinator_earnings',{method:'POST',body:JSON.stringify({
      group_id: groupId,
      coordinator_id: coordinatorId,
      payout_amount: payoutAmount,
      days_held: daysHeld,
      interest_generated: +interestGenerated.toFixed(2),
      bonus_amount: coordinatorBonus,
      date: today
    })});

    console.log('Coordinator bonus credited:', coordinatorBonus);
  }catch(e){console.error('Coordinator bonus error:',e);}
}

// ─── ADMIN APPROVAL OF AJO PAYOUTS ─────────────────────────
// A coordinator's "Pay out" click only creates a pending group_payouts row (see
// initiateGroupPayout above). Nothing is paid, credited, or promised to anyone until
// admin approves it here.

async function approveGroupPayout(payoutId,groupId,memberId,recipientUserId,amount,cycle,groupName,memberName){
  if(!confirm(`Approve payout of ${fmt(amount)} to ${memberName} for "${groupName}" (period ${cycle})?`))return;
  try{
    const today=new Date().toISOString().split('T')[0];
    await sb(`group_payouts?id=eq.${payoutId}`,{method:'PATCH',body:JSON.stringify({status:'completed',processed_at:today})});

    // Days the contribution sat in the group, for the coordinator's float bonus —
    // recomputed here (at approval time) rather than at request time, since that's
    // when the money actually moves.
    const contributions=await sb(`group_contributions?group_id=eq.${groupId}&member_id=eq.${memberId}&cycle=eq.${cycle}&status=eq.paid&select=*`);
    let daysHeld=5;
    if(contributions&&contributions.length){
      const contribDate=new Date(contributions[0].date);
      daysHeld=Math.ceil(Math.abs(new Date(today)-contribDate)/(1000*60*60*24));
    }
    const groups=await sb(`savings_groups?id=eq.${groupId}&select=coordinator_id`);
    if(groups&&groups.length){
      await calculateAndCreditCoordinatorBonus(groupId,groups[0].coordinator_id,amount,daysHeld).catch(e=>logSystemError('coordinator_bonus:'+payoutId,e));
    }

    toast('<i class="ti ti-check"></i> Payout approved.');
    await renderAdmin();

    // Tell the recipient — email + bell — that their payout is approved and on the way
    try{
      const userArr=await sb(`users?id=eq.${recipientUserId}&select=name,email`);
      if(userArr&&userArr.length){
        const u=userArr[0];
        const title=`Ajo payout approved — ${groupName}`;
        const detail=`Your payout of ${fmt(amount)} from "${groupName}" (period ${cycle}) has been approved. You will be credited within 24 hours or less.`;
        await addNotification(recipientUserId,title+': '+detail,'ajo');
      }
    }catch(e){logSystemError('notify:group_payout_approved',e);}
  }catch(e){alert('Error approving payout: '+e.message);}
}

async function rejectGroupPayout(payoutId,groupId,memberName,groupName,coordinatorId){
  if(!confirm(`Reject this payout request for ${memberName}?`))return;
  try{
    await sb(`group_payouts?id=eq.${payoutId}`,{method:'PATCH',body:JSON.stringify({status:'rejected'})});
    toast('<i class="ti ti-x"></i> Payout request rejected.');
    await renderAdmin();

    if(coordinatorId){
      try{
        const coordArr=await sb(`users?id=eq.${coordinatorId}&select=name,email`);
        if(coordArr&&coordArr.length){
          const c=coordArr[0];
          const title=`Payout request rejected — ${groupName}`;
          const detail=`The payout request for ${memberName} in "${groupName}" was rejected by admin. Please check the group and resubmit if needed.`;
          await addNotification(coordinatorId,title+': '+detail,'ajo');
        }
      }catch(e){logSystemError('notify:group_payout_rejected',e);}
    }
  }catch(e){alert('Error rejecting payout: '+e.message);}
}

// Coordinator initiates a payout — this now only creates a PENDING request. The bonus
// credit and the "money is on its way" message both wait until admin approves (see
// approveGroupPayout/rejectGroupPayout below), so nothing is promised to the member or
// paid to the coordinator until a human at Fundova has actually signed off on it.
async function initiateGroupPayout(groupId,memberId,memberName,amount,cycle,override){
  const confirmMsg=override
    ?`This member is not next in the payout order. Send an admin approval request to override and pay ${fmt(amount)} to ${memberName} out of turn for period ${cycle}?`
    :`Send a payout of ${fmt(amount)} to ${memberName} for period ${cycle} to admin for approval?`;
  if(!confirm(confirmMsg))return;
  try{
    const today = new Date().toISOString().split('T')[0];
    await sb('group_payouts',{method:'POST',body:JSON.stringify({
      group_id:groupId,recipient_id:memberId,amount,cycle,
      status:'pending',initiated_at:today
    })});

    toast('<i class="ti ti-check"></i> Payout request sent to admin for approval.');
    await (window.location.pathname==='/ajo'?renderAjoPage():renderContributor());
  }catch(e){alert('Error requesting payout: '+e.message);}
}

async function renderCoordinatorEarnings(){
  try{
    const earnings = await sb(`coordinator_earnings?coordinator_id=eq.${currentUser.id}&select=*&order=created_at.desc`);
    if(!earnings||!earnings.length)return'';

    const totalBonus = earnings.reduce((a,e)=>a+Number(e.bonus_amount),0);
    const thisMonth = new Date().toISOString().slice(0,7);
    const monthBonus = earnings.filter(e=>e.date.startsWith(thisMonth)).reduce((a,e)=>a+Number(e.bonus_amount),0);

    // Group by group_id
    const groupIds = [...new Set(earnings.map(e=>e.group_id))];
    const groups = await sb(`savings_groups?id=in.(${groupIds.join(',')})&select=id,name`);
    const groupMap = {};
    (groups||[]).forEach(g=>{groupMap[g.id]=g.name;});

    const byGroup = {};
    earnings.forEach(e=>{
      if(!byGroup[e.group_id])byGroup[e.group_id]=0;
      byGroup[e.group_id]+=Number(e.bonus_amount);
    });

    const groupRows = Object.entries(byGroup).map(([gid,amt])=>`
      <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f0f0ee">
        <span style="font-size:13px">${groupMap[gid]||'Unknown group'}</span>
        <span style="font-weight:600;color:#0F6E56">${fmt(amt)}</span>
      </div>`).join('');

    return`<div class="card" style="margin-bottom:1rem">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
        <span style="font-size:22px">💰</span>

          <h3 style="margin:0">Coordination earnings</h3>
          <div style="font-size:12px;color:#888">Bonus from group float interest</div>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px">
        <div class="stat" style="padding:10px 12px">

async function inviteGroupMember(groupId){
  const name = document.getElementById('inv-name').value.trim();
  const email = document.getElementById('inv-email').value.trim().toLowerCase();
  const contribution_amount = parseFloat(document.getElementById('inv-amount').value);
  const payout_order = parseInt(document.getElementById('inv-order').value)||null;
  const err = document.getElementById('inv-err');
  const btn = document.getElementById('inv-btn');

  if(!name||!email||!contribution_amount){err.textContent='Name, email and contribution amount are required.';return;}
  btn.innerHTML='<span class="spinner"></span> Sending…';btn.disabled=true;

  try{
    const [groupArr,activeMembers]=await Promise.all([
      sb(`savings_groups?id=eq.${groupId}&select=name,max_members`),
      sb(`group_members?group_id=eq.${groupId}&status=eq.active&select=id`)
    ]);
    const maxMembers=groupArr&&groupArr.length?groupArr[0].max_members:null;
    if(maxMembers&&activeMembers&&activeMembers.length>=maxMembers){
      err.textContent=`This group is full (${activeMembers.length}/${maxMembers}). Edit the group to raise the member cap first.`;
      btn.innerHTML='<i class="ti ti-send"></i> Send invitation';btn.disabled=false;return;
    }
    // Check if already a contributor
    const existing = await sb(`users?email=eq.${email}&role=eq.contributor&select=id`);

    if(existing && existing.length){
      // Already a contributor — add directly to group
      await sb('group_members',{method:'POST',body:JSON.stringify({
        group_id:groupId, user_id:existing[0].id,
        contribution_amount, payout_order, status:'active'
      })});
      closeModal();
      toast('<i class="ti ti-check"></i> Member added to group directly — they are already a Fundova contributor!');
    } else {
      // Not a contributor — save pending invitation and send email
      const groupName = groupArr&&groupArr.length?groupArr[0].name:'your group';

      await sb('group_invitations',{method:'POST',body:JSON.stringify({
        group_id:groupId, coordinator_id:currentUser.id,
        invitee_name:name, invitee_email:email,
        contribution_amount, payout_order,
        referred_by:currentUser.name,
        status:'pending'
      })});

      // Send invitation email
      await fetch('/.netlify/functions/send-email',{
        method:'POST',
        headers:authHeaders(),
        body:JSON.stringify({
          type:'group_invitation',
          to:email, name, coordinator_name:currentUser.name,
          group_name:groupName
        })
      });

      closeModal();
      toast('<i class="ti ti-check"></i> Invitation sent to '+name+'! They will receive an email to sign up on Fundova.');
    }
    await (window.location.pathname==='/ajo'?renderAjoPage():renderContributor());
  }catch(e){
    err.textContent='Error: '+e.message;
    btn.innerHTML='<i class="ti ti-send"></i> Send invitation';
    btn.disabled=false;
  }
}

const ALERTS_SNOOZE_KEY='fv_alerts_snooze', ALERTS_OFF_KEY='fv_alerts_off';
let _alertsOn=false;
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}
function alertsSupported(){return ('serviceWorker' in navigator)&&('PushManager' in window)&&('Notification' in window);}
function isIos(){return /iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);}
function isStandalone(){try{return (window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;}catch(e){return false;}}
function needsHomeScreen(){return isIos()&&!isStandalone();}
function b64uToBytes(b){const pad='='.repeat((4-b.length%4)%4);const raw=atob((b+pad).replace(/-/g,'+').replace(/_/g,'/'));const out=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)out[i]=raw.charCodeAt(i);return out;}
async function alertsGetSub(){try{const reg=await navigator.serviceWorker.ready;return await reg.pushManager.getSubscription();}catch(e){return null;}}
async function alertsRefreshState(){_alertsOn=false;if(!alertsSupported()||Notification.permission!=='granted')return;_alertsOn=!!(await alertsGetSub());}
async function alertsPost(obj){return fetch('/.netlify/functions/push',{method:'POST',headers:authHeaders(),body:JSON.stringify(obj)});}
function alertsRowHtml(){
  if(needsHomeScreen())return '<span style="font-size:11px;color:#888">Phone alerts: <button onclick="showIosAlertSteps()" style="background:none;border:none;color:#0D3D2A;font-size:11px;font-weight:700;cursor:pointer;padding:0">How to turn on</button></span>';
  if(!alertsSupported())return '<span style="font-size:11px;color:#aaa">Phone alerts are not available on this browser</span>';
  return _alertsOn
    ?'<span style="font-size:11px;color:#888"><i class="ti ti-bell-ringing" style="color:#1D9E75"></i> Phone alerts on · <button onclick="disableAlerts()" style="background:none;border:none;color:#A32D2D;font-size:11px;font-weight:700;cursor:pointer;padding:0">Turn off</button></span>'
    :'<span style="font-size:11px;color:#888">Phone alerts off · <button onclick="enableAlerts()" style="background:none;border:none;color:#0D3D2A;font-size:11px;font-weight:700;cursor:pointer;padding:0">Turn on</button></span>';
}

function hideAlertsPrompt(){const e=document.getElementById('alerts-prompt');if(e)e.remove();}
function snoozeAlertsPrompt(){lsSet(ALERTS_SNOOZE_KEY,String(Date.now()));hideAlertsPrompt();}
function showAlertsPrompt(){
  if(document.getElementById('alerts-prompt'))return;
  const ios=needsHomeScreen();
  const d=document.createElement('div');d.id='alerts-prompt';
  d.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:84px;width:min(92vw,420px);background:#0D3D2A;color:#fff;border-radius:14px;padding:16px;z-index:9400;box-shadow:0 10px 32px rgba(0,0,0,.28);font-family:inherit';
  d.innerHTML=`<div style="display:flex;gap:12px;align-items:flex-start"><div style="font-size:26px;line-height:1">🔔</div><div style="flex:1">

    <div style="display:flex;gap:8px;margin-top:12px">
      <button onclick="${ios?'showIosAlertSteps()':'enableAlerts()'}" style="background:#C9961A;color:#0D1F14;border:none;padding:9px 16px;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer">${ios?'Show me how':'Turn on'}</button>
      <button onclick="snoozeAlertsPrompt()" style="background:transparent;color:#cfe3d8;border:1px solid rgba(255,255,255,.3);padding:9px 14px;border-radius:8px;font-size:13px;cursor:pointer">Not now</button>
    </div></div></div>`;

async function enableAlerts(){
  if(needsHomeScreen()){showIosAlertSteps();return false;}
  if(!alertsSupported()){toast('Phone alerts are not available on this browser.');return false;}
  try{
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){toast('Alerts are blocked. Allow notifications for Fundova in your phone or browser settings, then try again.');return false;}
    const kr=await fetch('/.netlify/functions/push');const kj=await kr.json();
    if(!kj||!kj.key){toast('Phone alerts are not ready yet. Please try again later.');return false;}
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64uToBytes(kj.key)});
    const r=await alertsPost({action:'subscribe',subscription:sub.toJSON()});
    if(!r.ok)throw new Error('save failed');
    _alertsOn=true;lsDel(ALERTS_OFF_KEY);lsDel(ALERTS_SNOOZE_KEY);hideAlertsPrompt();
    alertsPost({action:'test'}).catch(()=>{});
    toast('<i class="ti ti-bell-ringing"></i> Phone alerts are on.');
    closeAlertPanels();
    return true;
  }catch(e){toast('Could not turn on alerts. Please try again.');return false;}
}
async function disableAlerts(){
  try{
    const sub=await alertsGetSub();
    if(sub){await alertsPost({action:'unsubscribe',endpoint:sub.endpoint}).catch(()=>{});await sub.unsubscribe().catch(()=>{});}
  }catch(e){}
  _alertsOn=false;lsSet(ALERTS_OFF_KEY,'1');
  toast('Phone alerts are off. You can still read every update in the bell.');
  closeAlertPanels();
}
function closeAlertPanels(){['notif-panel','admin-notif-panel'].forEach(id=>{const e=document.getElementById(id);if(e)e.style.display='none';});}
// after sign-in: refresh this phone's registration, or gently invite the person to turn alerts on (again after 7 days)
async function alertsOnSignIn(){
  if(!currentUser)return;
  await alertsRefreshState();
  if(_alertsOn){const sub=await alertsGetSub();if(sub)alertsPost({action:'subscribe',subscription:sub.toJSON()}).catch(()=>{});return;}
  if(lsGet(ALERTS_OFF_KEY))return;
  if(alertsSupported()&&Notification.permission==='denied')return;
  if(!alertsSupported()&&!needsHomeScreen())return;
  const t=Number(lsGet(ALERTS_SNOOZE_KEY)||0);
  if(t&&Date.now()-t<7*24*3600*1000)return;
  showAlertsPrompt();
}
// signing out stops this phone getting that person's alerts (it re-registers when someone signs in again)
function alertsDetachPhone(){
  if(!alertsSupported())return;
  const h=authHeaders();
  navigator.serviceWorker.ready.then(r=>r.pushManager.getSubscription()).then(sub=>{
    if(sub)fetch('/.netlify/functions/push',{method:'POST',headers:h,body:JSON.stringify({action:'unsubscribe',endpoint:sub.endpoint})}).catch(()=>{});
  }).catch(()=>{});
}

async function buildAnalyticsTab(){
  try{
    const [contributors, allPayments, requests, investments, groups, groupMembers, foodEnrollments, foodOptions] = await Promise.all([
      sb('users?role=eq.contributor&select=id,created_at'),
      sb('payments?select=*&order=date.asc'),
      sb('withdrawal_requests?select=*'),
      sb('investments?select=*'),
      sb('savings_groups?select=*'),
      sb('group_members?select=*'),
      sb('food_scheme_enrollments?select=*'),
      sb('food_scheme_options?select=*')
    ]);

    const totalMembers = (contributors||[]).length;
    const activePayments = (allPayments||[]).filter(p=>!p.withdrawn && !p.moved_at);
    const totalSavings = activePayments.reduce((a,p)=>a+rowPrincipal(p),0);
    const lifetimeInflow = (allPayments||[]).filter(p=>!p.is_transfer).reduce((a,p)=>a+Number(p.amount),0);
    const totalWithdrawn = (requests||[]).filter(r=>r.status==='approved').reduce((a,r)=>a+Number(r.amount),0);
    const pendingWithdrawals = (requests||[]).filter(r=>r.status==='pending').length;
    const totalInterest = activePayments.reduce((a,p)=>a+rowIntTotal(p),0);

    // Monthly inflow data (last 6 months)
    const months = [];
    for(let i=5;i>=0;i--){
      const d = new Date();
      d.setDate(1); // prevent month overflow
      d.setMonth(d.getMonth()-i);
      const year = d.getFullYear();
      const month = String(d.getMonth()+1).padStart(2,'0');
      const key = year+'-'+month;
      const label = d.toLocaleString('default',{month:'short'});
      const inflow = (allPayments||[]).filter(p=>!p.is_transfer&&p.date&&p.date.startsWith(key)).reduce((a,p)=>a+Number(p.amount),0);
      months.push({label,inflow,key});
    }

    // Member growth (last 6 months)
    const memberGrowth = months.map(m=>{
      const count = (contributors||[]).filter(c=>c.created_at&&c.created_at.startsWith(m.key)).length;
      return{...m,count};
    });

    const maxInflow = Math.max(...months.map(m=>m.inflow),1);
    const maxCount = Math.max(...memberGrowth.map(m=>m.count),1);

    return`<div>
      <!-- Stats cards -->
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:1.5rem">
        ${[
          {label:'Total members',val:totalMembers,color:'#0D3D2A',icon:'ti-users'},
          {label:'Current savings',val:fmt(totalSavings),color:'#185FA5',icon:'ti-currency-naira'},
          {label:'Lifetime inflow',val:fmt(lifetimeInflow),color:'#065F46',icon:'ti-trending-up'},
          {label:'Interest accrued',val:fmt(totalInterest),color:'#856404',icon:'ti-percentage'},
          {label:'Total withdrawn',val:fmt(totalWithdrawn),color:'#991B1B',icon:'ti-cash'},
          {label:'Pending withdrawals',val:pendingWithdrawals,color:pendingWithdrawals>0?'#991B1B':'#065F46',icon:'ti-clock'},
        ].map(s=>`<div style="background:#fff;border-radius:14px;padding:1.25rem;box-shadow:0 1px 6px rgba(0,0,0,.06)">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
            <div style="font-size:11px;color:#888;font-weight:500;text-transform:uppercase;letter-spacing:.04em">${s.label}</div>
            <i class="ti ${s.icon}" style="color:${s.color};font-size:18px"></i>

// ─── INVESTMENT AUTO-REFUND ────────────────────────────────

async function refundFailedInvestment(invId){
  if(!confirm('Mark this investment as failed and refund all confirmed investors? This cannot be undone.'))return;
  try{
    const reservations = await sb(`investment_reservations?investment_id=eq.${invId}&status=eq.payment_confirmed&select=*`);
    const inv = await sb(`investments?id=eq.${invId}&select=*`);
    if(!inv||!inv.length)throw new Error('Investment not found');
    const today = new Date().toISOString().split('T')[0];
    let refunded = 0;

    for(const r of (reservations||[])){
      const refundAmount = +(r.units * inv[0].unit_price).toFixed(2);
      // Credit back to savings
      await sb('payments',{method:'POST',body:JSON.stringify({user_id:r.user_id,amount:refundAmount,date:today,withdrawn:false,is_transfer:true})});
      // Cancel reservation
      await sb(`investment_reservations?id=eq.${r.id}`,{method:'PATCH',body:JSON.stringify({status:'cancelled'})});
      // Notify investor
      const userArr = await sb(`users?id=eq.${r.user_id}&select=name,email`);
      if(userArr&&userArr.length){
        await notify({type:'investment_cancelled',to:userArr[0].email,name:userArr[0].name,investment:inv[0].title});
      }
      refunded++;
    }
    // Mark investment as closed/failed
    await sb(`investments?id=eq.${invId}`,{method:'PATCH',body:JSON.stringify({status:'closed'})});
    toast(`<i class="ti ti-check"></i> Investment closed. ${refunded} investor${refunded!==1?'s':''} refunded.`);
    await renderAdmin();
  }catch(e){alert('Error processing refund: '+e.message);}
}

function loadImageForCanvas(src){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.crossOrigin='anonymous';
    img.onload=()=>resolve(img);
    img.onerror=reject;
    img.src=src;
  });
}

function canvasRoundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function canvasDrawImageCover(ctx,img,x,y,w,h,radius){
  ctx.save();
  canvasRoundRect(ctx,x,y,w,h,radius);
  ctx.clip();
  const scale=Math.max(w/img.width,h/img.height);
  const dw=img.width*scale, dh=img.height*scale;
  ctx.drawImage(img, x+(w-dw)/2, y+(h-dh)/2, dw, dh);
  ctx.restore();
}

// Wraps text within maxWidth, returns the y position after the last line
function canvasWrapText(ctx,text,x,y,maxWidth,lineHeight){
  const words=(text||'').split(' ');
  let line='';
  for(let i=0;i<words.length;i++){
    const test=line+words[i]+' ';
    if(ctx.measureText(test).width>maxWidth && i>0){
      ctx.fillText(line,x,y);
      line=words[i]+' ';
      y+=lineHeight;
    } else {
      line=test;
    }
  }
  ctx.fillText(line,x,y);
  return y+lineHeight;
}

async function buildShareImage(type,data,referralLink){
  const canvas=document.createElement('canvas');
  canvas.width=1080; canvas.height=1920;
  const ctx=canvas.getContext('2d');

  // Background
  const grad=ctx.createLinearGradient(0,0,0,1920);
  grad.addColorStop(0,'#0D3D2A');
  grad.addColorStop(1,'#082017');
  ctx.fillStyle=grad;
  ctx.fillRect(0,0,1080,1920);

  // Header — logo + wordmark
  try{
    const logo=await loadImageForCanvas('/logo.png');
    canvasRoundRect(ctx,90,90,90,90,16); ctx.save(); ctx.clip(); ctx.drawImage(logo,90,90,90,90); ctx.restore();

// Generic search — filters any table's rows by matching text in the first column.
// Reused across Transactions, Withdrawals, Credentials, Investments, etc.
function filterTableRows(searchInputId, tableId, countElId){
  const query = document.getElementById(searchInputId)?.value?.toLowerCase().trim() || '';
  const table = document.getElementById(tableId);
  if(!table)return;
  const rows = table.querySelectorAll('tr:not(:first-child)');
  let visible = 0;
  rows.forEach(row => {
    const name = row.querySelector('td')?.textContent?.toLowerCase() || '';
    const show = !query || name.includes(query);
    row.style.display = show ? '' : 'none';
    if(show) visible++;
  });
  const countEl = countElId ? document.getElementById(countElId) : null;
  if(countEl) countEl.textContent = query ? `${visible} of ${rows.length}` : `${rows.length}`;
}

// Three-state KYC badge — 'verified' (green), 'awaiting' (amber, submitted and needs admin
// review), or anything else/undefined treated as 'not_started' (grey, hasn't begun at all)

  return '<span title="KYC not started" style="display:inline-flex;align-items:center;gap:4px;background:#F3F4F6;color:#6B7280;font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px"><i class="ti ti-shield-off" style="font-size:12px"></i> Not started</span>';
