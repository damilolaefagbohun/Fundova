// Session persistence - 24 hours
function saveSession(user){
  const session={user,expiry:Date.now()+(24*60*60*1000)};
  try{localStorage.setItem('fundova_session',JSON.stringify(session));}catch(e){}
}
function loadSession(){
  try{
    const raw=localStorage.getItem('fundova_session');
    if(!raw)return null;
    const session=JSON.parse(raw);
    if(Date.now()>session.expiry){localStorage.removeItem('fundova_session');return null;}
    return session.user;
  }catch(e){return null;}
}
function clearSession(){
  try{localStorage.removeItem('fundova_session');}catch(e){}
}

async function sb(path, opts={}, _retryCount=0){
  const method = opts.method||'GET';
  const isReadOnly = method==='GET';
  const controller=new AbortController();
  const timeout=setTimeout(()=>controller.abort(),20000); // 20s — was 10s, too aggressive on slow connections
  try{
    const res=await fetch('/.netlify/functions/db',{
      method:'POST',
      signal:controller.signal,
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        path,
        method,
        body:opts.body?JSON.parse(opts.body):null
      })
    });
    clearTimeout(timeout);
    if(!res.ok){const e=await res.text();throw new Error(e);}
    const result=await res.json();
    if(result.status>=400)throw new Error(JSON.stringify(result.data));
    return result.data;
  }catch(e){
    clearTimeout(timeout);
    const isNetworkFailure = e.name==='AbortError' || e.name==='TypeError';
    // Only auto-retry read-only requests on genuine network/timeout failures — retrying a
    // write (POST/PATCH/DELETE) blindly risks duplicating something that actually went through
    // (e.g. recording a payment twice) even though the response never came back in time.
    if(isReadOnly && isNetworkFailure && _retryCount<2){
      await new Promise(r=>setTimeout(r,800*(_retryCount+1)));
      return sb(path,opts,_retryCount+1);
    }
    if(e.name==='AbortError')throw new Error('Request timed out. Please check your internet connection and try again — if this was meant to save something, please verify it went through before retrying.');
    throw e;
  }
}

function countWeekdays(startDate,endDate){
  let count=0;const d=new Date(startDate);const end=new Date(endDate);
  d.setHours(0,0,0,0);end.setHours(0,0,0,0);
  while(d<end){const day=d.getDay();if(day!==0&&day!==6)count++;d.setDate(d.getDate()+1);}
  return count;
}
function calcAccruedInterest(amount,payDate,withdrawnAt){
  const today=new Date();today.setHours(0,0,0,0);
  const start=new Date(payDate);start.setHours(0,0,0,0);
  if(start>=today)return 0;
  // If withdrawn, interest only accrued up to the withdrawal date
  const end=withdrawnAt?new Date(withdrawnAt):today;
  end.setHours(0,0,0,0);
  if(start>=end)return 0;
  return+(Number(amount)*RATE*(countWeekdays(start,end)/WEEKDAYS_PER_YEAR)).toFixed(2);
}

async function doLogin(){
  const email=document.getElementById('l-email').value.trim().toLowerCase();
  const pin=document.getElementById('l-pin').value.trim();
  const err=document.getElementById('l-err');
  const btn=document.getElementById('l-btn');
  if(!email||!pin){err.textContent='Please enter your email and PIN.';return;}
  btn.innerHTML='<span class="spinner"></span> Signing in…';btn.disabled=true;
  try{
    const users=await sb(`users?email=eq.${encodeURIComponent(email)}&pin=eq.${encodeURIComponent(pin)}&select=*`);
    if(!users||!users.length){err.textContent='Invalid email or PIN.';btn.innerHTML='<i class="ti ti-login"></i> Sign in';btn.disabled=false;return;}
    if(users[0].status==='revoked'){err.textContent='Your account access has been revoked. Please contact the administrator.';btn.innerHTML='<i class="ti ti-login"></i> Sign in';btn.disabled=false;return;}
    if(users[0].status==='closed'){err.textContent='This account has been closed. Please contact the administrator if you believe this is a mistake.';btn.innerHTML='<i class="ti ti-login"></i> Sign in';btn.disabled=false;return;}
    currentUser=users[0];saveSession(currentUser);localStorage.setItem('fundova_saved_email',email);closeModal();await render();
  }catch(e){err.textContent='Connection error. Please try again.';btn.innerHTML='<i class="ti ti-login"></i> Sign in';btn.disabled=false;}
}

function checkNameMatch(){
  const accountName=(document.getElementById('s-aname').value||'').trim().toLowerCase();
  const registeredName=(window._sName||'').trim().toLowerCase();
  const mismatch=document.getElementById('s-mismatch');
  const consentRow=document.getElementById('s-consent-row');
  const anameVal=document.getElementById('s-aname-val');
  if(accountName.length>2&&registeredName.length>2){
    const aParts=accountName.split(' ');
    const rParts=registeredName.split(' ');
    const overlap=aParts.filter(p=>p.length>1&&rParts.some(r=>r.includes(p)||p.includes(r)));
    if(overlap.length===0){
      anameVal.textContent=document.getElementById('s-aname').value.trim();
      mismatch.style.display='flex';
      consentRow.style.display='flex';
      document.getElementById('s-aname').classList.add('warn');
    } else {
      mismatch.style.display='none';
      consentRow.style.display='none';
      document.getElementById('s-aname').classList.remove('warn');
    }
  }
}

    // ── UPCOMING BIRTHDAYS ──

  // Search bar
  const searchBar=`<div style="margin-bottom:1rem;display:flex;gap:8px;align-items:center">

async function approveSignup(id,name,email,bankName,accountName,accountNumber,phone,whatsapp){
  const pin=document.getElementById('as-pin').value.trim();
  const err=document.getElementById('as-err');
  const btn=document.getElementById('as-btn');
  if(!pin||pin.length<4){err.textContent='PIN must be at least 4 digits.';return;}
  btn.innerHTML='<span class="spinner"></span> Approving…';btn.disabled=true;
  try{
    // Create user account
    // Get referred_by from signup request
    const signupReq = await sb(`signup_requests?id=eq.${id}&select=referred_by`);
    const referredBy = signupReq&&signupReq[0]?signupReq[0].referred_by:null;
    const newUsers=await sb('users',{method:'POST',body:JSON.stringify({name,email,pin,role:'contributor',phone:phone||null,whatsapp:whatsapp||null,referred_by:referredBy||null})});
    const newUser=newUsers&&newUsers[0];
    // Save bank details
    if(newUser){
      await sb('bank_details',{method:'POST',body:JSON.stringify({user_id:newUser.id,bank_name:bankName,account_name:accountName,account_number:accountNumber})});
    }
    // Mark signup request approved
    await sb(`signup_requests?id=eq.${id}`,{method:'PATCH',body:JSON.stringify({status:'approved'})});
    // Send email
    await sendEmail({type:'approval',to:email,name,pin});
    closeModal();
    toast('<i class="ti ti-check"></i> Approved and email sent!');
    await renderAdmin();
  }catch(e){
    err.textContent=e.message.includes('unique')||e.message.includes('duplicate')?'This email is already registered.':'Error approving. Please try again.';
    btn.innerHTML='<i class="ti ti-check"></i> Approve & send email';btn.disabled=false;
  }
}

async function rejectSignup(id){
  if(!confirm('Reject this application?'))return;
  try{
    await sb(`signup_requests?id=eq.${id}`,{method:'PATCH',body:JSON.stringify({status:'rejected'})});
    await renderAdmin();
  }catch(e){alert('Error rejecting application.');}
}

async function updateRequest(id,status){
  try{
    const requests0=await sb(`withdrawal_requests?id=eq.${id}&select=*`);
    if(!requests0||!requests0.length)throw new Error('Request not found');
    const req0=requests0[0];

    if(status==='approved' && !req0.is_account_closure){
      const req=req0;
      let remaining=Number(req.amount);

      // Fetch only active, unallocated (non-goal) payments oldest first — goal-tagged
      // money must never be touched by a regular withdrawal approval
      const payments=await sb(`payments?user_id=eq.${req.user_id}&withdrawn=eq.false&goal_id=is.null&moved_at=is.null&select=*&order=date.asc`);
      if(!payments||!payments.length)throw new Error('No active payments found');

      const today=new Date().toISOString().split('T')[0];

      for(const p of payments){
        if(remaining<=0)break;
        const principal=Number(p.amount);
        const interest=calcAccruedInterest(principal,p.date,null);
        const totalValue=+(principal+interest).toFixed(2);

        if(totalValue<=remaining){
          // Mark this payment as fully withdrawn
          await sb(`payments?id=eq.${p.id}`,{method:'PATCH',body:JSON.stringify({withdrawn:true,withdrawn_at:today})});
          remaining=+(remaining-totalValue).toFixed(2);
        } else {
          // Partially consume this payment
          // Mark original as withdrawn
          await sb(`payments?id=eq.${p.id}`,{method:'PATCH',body:JSON.stringify({withdrawn:true,withdrawn_at:today})});
          // Calculate leftover and create new active payment dated today
          const leftover=+(totalValue-remaining).toFixed(2);
          remaining=0;
          if(leftover>0){
            await sb('payments',{method:'POST',body:JSON.stringify({
              user_id:req.user_id,
              amount:leftover,
              date:today,
              withdrawn:false,
              is_transfer:true
            })});
          }
        }
      }
    }
    const statusPatch={status};
    if(status==='approved')statusPatch.approved_at=new Date().toISOString();
    await sb(`withdrawal_requests?id=eq.${id}`,{method:'PATCH',body:JSON.stringify(statusPatch)});
    // Account closure requests: the balance was already frozen/closed at request time —
    // approval here just finalizes it by marking the account closed
    if(req0.is_account_closure && status==='approved'){
      await sb(`users?id=eq.${req0.user_id}`,{method:'PATCH',body:JSON.stringify({status:'closed',closed_at:new Date().toISOString()})});
    }
    // Send notification to contributor
    try{
      const reqArr=await sb(`withdrawal_requests?id=eq.${id}&select=*`);
      if(reqArr&&reqArr.length){
        const userArr=await sb(`users?id=eq.${reqArr[0].user_id}&select=name,email`);
        if(userArr&&userArr.length){
          await notify({type:status==='approved'?'withdrawal_approved':'withdrawal_rejected',to:userArr[0].email,name:userArr[0].name,amount:reqArr[0].amount});
        }
      }
    }catch(notifyErr){console.error('Notify error:',notifyErr);}
    await renderAdmin();
  }catch(e){alert('Error updating request: '+e.message);}
}

    <button class="btn btn-danger" id="ac-btn" onclick="requestAccountClosure()"><i class="ti ti-alert-triangle"></i> Yes, close my account</button>
  </div>`);

async function requestAccountClosure(){
  const err=document.getElementById('ac-err');
  const btn=document.getElementById('ac-btn');
  btn.innerHTML='<span class="spinner"></span> Processing…';btn.disabled=true;
  try{
    // 1. Auto-collapse any active goals back into general savings first
    const goals=await sb(`goals?user_id=eq.${currentUser.id}&archived=eq.false&select=*`);
    for(const g of (goals||[])){
      const gPayments=await sb(`payments?user_id=eq.${currentUser.id}&withdrawn=eq.false&goal_id=eq.${g.id}&moved_at=is.null&select=*&order=date.asc`);
      const gBalance=(gPayments||[]).reduce((a,p)=>a+Number(p.amount)+calcAccruedInterest(p.amount,p.date),0);
      if(gBalance>0.5){
        await consumePaymentsFIFO(gPayments,gBalance,g.id);
        const todayDateOnly=new Date().toISOString().split('T')[0];
        await sb('payments',{method:'POST',body:JSON.stringify({user_id:currentUser.id,amount:+gBalance.toFixed(2),date:todayDateOnly,withdrawn:false,goal_id:null,is_transfer:true})});
      }
    }
    // 2. Freeze every remaining general-savings payment right now — this is a real
    // closure (money is genuinely leaving), so reusing withdrawn/withdrawn_at is correct here
    const generalPayments=await sb(`payments?user_id=eq.${currentUser.id}&withdrawn=eq.false&goal_id=is.null&moved_at=is.null&select=*`);
    const nowIso=new Date().toISOString();
    let frozenTotal=0;
    for(const p of (generalPayments||[])){
      frozenTotal+=Number(p.amount)+calcAccruedInterest(p.amount,p.date);
      await sb(`payments?id=eq.${p.id}`,{method:'PATCH',body:JSON.stringify({withdrawn:true,withdrawn_at:nowIso})});
    }
    frozenTotal=+frozenTotal.toFixed(2);
    // 3. Submit the closure request for admin
    await sb('withdrawal_requests',{method:'POST',body:JSON.stringify({
      user_id:currentUser.id,amount:frozenTotal,note:'Account closure — full balance payout',status:'pending',is_account_closure:true
    })});
    notify({type:'admin_withdrawal_request',name:currentUser.name,amount:frozenTotal,note:'⚠️ ACCOUNT CLOSURE — full balance payout, please review'}).catch(e=>logSystemError('notify:account_closure',e));
    notifyContributorAction('Account closure requested','You requested to close your Fundova account. Your interest has stopped accruing, and your final balance of '+fmt(frozenTotal)+' is now pending admin review before payout to the bank account on file.');
    toast('<i class="ti ti-check"></i> Closure requested — admin will process your final payout.');
    closeModal();
    await renderContributor();
  }catch(e){err.textContent='Error: '+e.message;btn.innerHTML='<i class="ti ti-alert-triangle"></i> Yes, close my account';btn.disabled=false;}
}

// ─── GOALS (beneficiary/goal boxes) ────────────────────────
// A "goal" is just a named box under the contributor's own account — never a separate
// member, no KYC. Money moves in and out via the same oldest-first FIFO consume/split
// mechanic used for partial withdrawals: fully-consumed source payments get retired
// (moved_at set, excluding them from their old bucket), the payment that overflows gets
// split into a retired original + a fresh leftover payment left behind in the SOURCE
// bucket, and the full assigned amount lands as one brand-new payment in the DESTINATION
// bucket, dated today — so it starts earning interest fresh from the moment it moves,
// exactly like a partial-withdrawal leftover does today.

// Sends a plain confirmation email to the currently logged-in contributor for something
// they just did. Fire-and-forget — never blocks the UI on this.
function notifyContributorAction(title, detail){
  if(!currentUser||!currentUser.email)return;
  notify({type:'contributor_action',to:currentUser.email,name:currentUser.name,title,detail}).catch(e=>logSystemError('notify:contributor_action:'+title,e));
}

// Consumes `amountNeeded` worth of current value (principal+interest) from `sourcePayments`
// (already fetched, oldest-first, already filtered to the correct bucket). Returns true if
// fully consumed, false if the source bucket didn't have enough to cover it (nothing is
// changed in that case — caller should check before writing the destination payment).
async function consumePaymentsFIFO(sourcePayments, amountNeeded, sourceGoalId){
  const totalAvailable=(sourcePayments||[]).reduce((a,p)=>{
    const endDate=p.withdrawn_at||p.moved_at||null;
    return a+Number(p.amount)+calcAccruedInterest(p.amount,p.date,endDate);
  },0);
  if(totalAvailable+0.005<amountNeeded)return false;

  let remaining=amountNeeded;
  const nowIso=new Date().toISOString();
  const todayDateOnly=nowIso.split('T')[0];
  for(const p of sourcePayments){
    if(remaining<=0.005)break;
    const endDate=p.withdrawn_at||p.moved_at||null;
    const currentValue=Number(p.amount)+calcAccruedInterest(p.amount,p.date,endDate);
    if(currentValue<=remaining+0.005){
      await sb(`payments?id=eq.${p.id}`,{method:'PATCH',body:JSON.stringify({moved_at:nowIso})});
      remaining-=currentValue;
    } else {
      const leftover=+(currentValue-remaining).toFixed(2);
      await sb(`payments?id=eq.${p.id}`,{method:'PATCH',body:JSON.stringify({moved_at:nowIso})});
      await sb('payments',{method:'POST',body:JSON.stringify({
        user_id:currentUser.id,amount:leftover,date:todayDateOnly,withdrawn:false,goal_id:sourceGoalId||null,is_transfer:true
      })});
      remaining=0;
    }
  }
  return true;
}

async function archiveGoal(goalId,goalName){
  if(!confirm(`Archive "${goalName}"? You can only archive a goal once its balance is ₦0 — move any money back to your savings first.`))return;
  try{
    const gPayments=await sb(`payments?user_id=eq.${currentUser.id}&withdrawn=eq.false&goal_id=eq.${goalId}&moved_at=is.null&select=*`);
    const balance=(gPayments||[]).reduce((a,p)=>a+Number(p.amount)+calcAccruedInterest(p.amount,p.date),0);
    if(balance>0.5){alert(`This goal still has ${fmt(balance)} in it. Move it back to your savings first, then archive.`);return;}
    await sb(`goals?id=eq.${goalId}`,{method:'PATCH',body:JSON.stringify({archived:true})});
    notifyContributorAction('Goal archived: '+goalName, 'You archived your goal "'+goalName+'". It no longer appears on your dashboard.');

async function assignToGoal(goalId,goalName){
  const amount=parseFloat(document.getElementById('ag-amt').value);
  const err=document.getElementById('ag-err');
  const btn=document.getElementById('ag-btn');
  if(!amount||amount<=0){err.textContent='Please enter a valid amount.';return;}

  try{
    const generalPayments=await sb(`payments?user_id=eq.${currentUser.id}&withdrawn=eq.false&goal_id=is.null&moved_at=is.null&select=*&order=date.asc`);

    const ok=await consumePaymentsFIFO(goalPayments,amount,goalId);
    if(!ok){err.textContent='That\'s more than this goal currently holds — nothing was moved.';btn.innerHTML='<i class="ti ti-arrow-left"></i> Move to savings';btn.disabled=false;return;}
    const todayDateOnly=new Date().toISOString().split('T')[0];
    await sb('payments',{method:'POST',body:JSON.stringify({user_id:currentUser.id,amount:+amount.toFixed(2),date:todayDateOnly,withdrawn:false,goal_id:null,is_transfer:true})});
    notifyContributorAction('Money moved from '+goalName, 'You moved '+fmt(amount)+' from "'+goalName+'" back into your unallocated savings. You can now request a withdrawal on it if you\'d like.');
    closeModal();
    toast('<i class="ti ti-check"></i> Moved back to your savings!');
    await renderContributor();
  }catch(e){err.textContent='Error: '+e.message;btn.innerHTML='<i class="ti ti-arrow-left"></i> Move to savings';btn.disabled=false;}
}

function buildGoalsCarouselSection(goals,goalPayments){
  const items=(goals||[]).map(g=>{
    const gPays=(goalPayments||[]).filter(p=>p.goal_id===g.id);
    const gPrincipal=gPays.reduce((a,p)=>a+Number(p.amount),0);
    const gInterest=gPays.reduce((a,p)=>a+calcAccruedInterest(p.amount,p.date),0);
    const gTotal=gPrincipal+gInterest;
    const pct=g.target_amount?Math.min(100,Math.round((gTotal/g.target_amount)*100)):null;
    return{g,gTotal,pct};
  });
  items.push({isPrompt:true});
  window._goalsCarouselList=items;
  goalsCarouselIndex=0;
  return`<div id="goals-carousel-track">${buildGoalCarouselCard(items[0])}</div>
    ${items.length>1?`
    <div style="display:flex;align-items:center;justify-content:center;gap:14px;margin-top:12px">
      <button onclick="goalsCarouselNav(-1)" class="btn btn-sm"><i class="ti ti-chevron-left"></i></button>
      <div style="display:flex;gap:6px" id="goals-carousel-dots">${items.map((_,i)=>`<div onclick="goalsCarouselGoTo(${i})" style="width:7px;height:7px;border-radius:50%;cursor:pointer;background:${i===0?'#0D3D2A':'#e5e5e2'}"></div>`).join('')}</div>
      <button onclick="goalsCarouselNav(1)" class="btn btn-sm"><i class="ti ti-chevron-right"></i></button>
    </div>`:''}`;
}
function goalsCarouselGoTo(idx){
  const list=window._goalsCarouselList||[];
  if(!list.length)return;
  goalsCarouselIndex=((idx%list.length)+list.length)%list.length;
  renderGoalsCarouselFrame();
}

function renderGoalsCarouselFrame(){
  const list=window._goalsCarouselList||[];

async function savePayment(userId){
  const date=document.getElementById('np-date').value;
  const amount=parseFloat(document.getElementById('np-amt').value);
  const err=document.getElementById('np-err');
  const btn=document.getElementById('np-btn');
  if(!date||!amount){err.textContent='All fields required.';return;}
  if(amount<=0){err.textContent='Amount must be greater than 0.';return;}
  btn.innerHTML='<span class="spinner"></span> Saving…';btn.disabled=true;
  try{
    await sb('payments',{method:'POST',body:JSON.stringify({user_id:userId,amount,date,withdrawn:false})});
    // Check if this is first payment and process referral bonus
    const prevPayments = await sb('payments?user_id=eq.'+userId+'&select=id');
    if(prevPayments && prevPayments.length === 1){
      // This was the first payment - process referral bonus
      processReferralBonus(userId).catch(e=>logSystemError('processReferralBonus',e));
    }
    // Send payment notification email
    try{
      const contribs=await sb('users?id=eq.'+userId+'&select=name,email');
      if(contribs&&contribs.length){
        const fmtAmt=Number(amount).toLocaleString('en-NG',{minimumFractionDigits:2});
        const fmtDt=new Date(date).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
        await sendEmail({type:'payment',to:contribs[0].email,name:contribs[0].name,amount:fmtAmt,date:fmtDt});
      }
    }catch(emailErr){console.error('Payment email error:',emailErr);}
    closeModal();await renderAdmin();
  }catch(e){err.textContent='Error saving payment.';btn.innerHTML='<i class="ti ti-device-floppy"></i> Save payment';btn.disabled=false;}
}

async function saveBankDetails(userId,userName,bankId){
  const bank_name=document.getElementById('bd-bank').value.trim();
  const account_name=document.getElementById('bd-aname').value.trim();
  const account_number=document.getElementById('bd-anum').value.trim();
  const err=document.getElementById('bd-err');
  const btn=document.getElementById('bd-btn');
  if(!bank_name||!account_name||!account_number){err.textContent='All fields are required.';return;}
  if(!/^\d{10}$/.test(account_number)){err.textContent='Account number must be exactly 10 digits.';return;}
  btn.innerHTML='<span class="spinner"></span> Saving…';btn.disabled=true;
  try{
    if(bankId&&bankId!=='null'){
      await sb(`bank_details?id=eq.${bankId}`,{method:'PATCH',body:JSON.stringify({bank_name,account_name,account_number})});
    } else {
      await sb('bank_details',{method:'POST',body:JSON.stringify({user_id:userId,bank_name,account_name,account_number})});
    }
    await openViewContributor(userId,userName);
  }catch(e){err.textContent='Error saving.';btn.innerHTML='<i class="ti ti-device-floppy"></i> Save details';btn.disabled=false;}
}

async function deletePaymentFromView(payId,userId,userName){
  if(!confirm('Delete this payment?'))return;
  try{await sb(`payments?id=eq.${payId}`,{method:'DELETE'});await openViewContributor(userId,userName);}
  catch(e){alert('Error deleting payment.');}
}

  <div class="field"><label>Confirm new PIN</label><input id="cp-confirm" type="password" maxlength="6" placeholder="Repeat new PIN"></div>
  <div class="error" id="cp-err"></div>
  <div class="modal-footer">
    <button class="btn" onclick="closeModal()">Cancel</button>

async function saveChangePin(){
  const current=document.getElementById('cp-current').value.trim();
  const newPin=document.getElementById('cp-new').value.trim();
  const confirm=document.getElementById('cp-confirm').value.trim();
  const err=document.getElementById('cp-err');
  const btn=document.getElementById('cp-btn');
  if(!current||!newPin||!confirm){err.textContent='All fields are required.';return;}
  if(current!==currentUser.pin){err.textContent='Current PIN is incorrect.';return;}
  if(newPin.length<4){err.textContent='New PIN must be at least 4 digits.';return;}
  if(newPin!==confirm){err.textContent='New PINs do not match.';return;}
  if(newPin===current){err.textContent='New PIN must be different from your current PIN.';return;}
  btn.innerHTML='<span class="spinner"></span> Updating…';btn.disabled=true;
  try{
    await sb(`users?id=eq.${currentUser.id}`,{method:'PATCH',body:JSON.stringify({pin:newPin})});
    currentUser.pin=newPin;
    closeModal();
    toast('<i class="ti ti-check"></i> PIN updated successfully');
  }catch(e){err.textContent='Error updating PIN.';btn.innerHTML='<i class="ti ti-lock-check"></i> Update PIN';btn.disabled=false;}
}

function previewUnitPrice(){
  const cost=parseFloat(document.getElementById('ni-cost')?.value||document.getElementById('ei-cost')?.value);
  const units=parseFloat(document.getElementById('ni-units')?.value||document.getElementById('ei-units')?.value);
  const preview=document.getElementById('ni-preview');
  const upriceEl=document.getElementById('ni-uprice');
  if(cost&&units&&units>0&&preview&&upriceEl){
    upriceEl.textContent=fmt(cost/units);
    preview.style.display='block';
  }
}

async function saveInvestment(id){
  const isEdit=!!id;
  const title=(document.getElementById(isEdit?'ei-title':'ni-title')||{}).value?.trim();
  const description=(document.getElementById(isEdit?'ei-desc':'ni-desc')||{}).value?.trim();
  const total_cost=parseFloat((document.getElementById(isEdit?'ei-cost':'ni-cost')||{}).value);
  const total_units=parseInt((document.getElementById(isEdit?'ei-units':'ni-units')||{}).value);
  const deadline=(document.getElementById(isEdit?'ei-deadline':'ni-deadline')||{}).value||null;
  const status=(document.getElementById(isEdit?'ei-status':'ni-status')||{}).value;
  const err=document.getElementById(isEdit?'ei-err':'ni-err');
  const btn=document.getElementById(isEdit?'ei-btn':'ni-btn');
  if(!title||!total_cost||!total_units){err.textContent='Title, cost and units are required.';return;}
  const unit_price=+(total_cost/total_units).toFixed(2);
  btn.innerHTML='<span class="spinner"></span> Saving…';btn.disabled=true;
  try{
    if(isEdit){
      await sb(`investments?id=eq.${id}`,{method:'PATCH',body:JSON.stringify({title,description,total_cost,total_units,unit_price,deadline,status})});
    } else {
      await sb('investments',{method:'POST',body:JSON.stringify({title,description,total_cost,total_units,unit_price,deadline,status})});
    }
    closeModal();await renderAdmin();
  }catch(e){err.textContent='Error saving.';btn.innerHTML='<i class="ti ti-device-floppy"></i> '+( isEdit?'Save changes':'Create');btn.disabled=false;}
}

async function updateReservation(resId,status,invId){
  try{
    if(status==='payment_confirmed'){
      // Payment confirmed - now deduct from savings if payment method is savings
      const resArr=await sb(`investment_reservations?id=eq.${resId}&select=*`);
      const res=resArr[0];
      if(res.payment_method==='savings'){
        const invArr=await sb(`investments?id=eq.${res.investment_id}&select=*`);
        const inv=invArr[0];
        const totalCost=res.units*inv.unit_price;
        const pays=await sb(`payments?user_id=eq.${res.user_id}&withdrawn=eq.false&goal_id=is.null&moved_at=is.null&select=*&order=date.asc`);
        let remaining=totalCost;
        const today=new Date().toISOString().split('T')[0];
        for(const p of pays){
          if(remaining<=0)break;
          const principal=Number(p.amount);
          const interest=calcAccruedInterest(principal,p.date,null);
          const totalValue=+(principal+interest).toFixed(2);
          if(totalValue<=remaining){
            await sb(`payments?id=eq.${p.id}`,{method:'PATCH',body:JSON.stringify({withdrawn:true,withdrawn_at:today})});
            remaining=+(remaining-totalValue).toFixed(2);
          } else {
            await sb(`payments?id=eq.${p.id}`,{method:'PATCH',body:JSON.stringify({withdrawn:true,withdrawn_at:today})});
            const leftover=+(totalValue-remaining).toFixed(2);
            remaining=0;
            if(leftover>0){await sb('payments',{method:'POST',body:JSON.stringify({user_id:res.user_id,amount:leftover,date:today,withdrawn:false,is_transfer:true})});}
          }
        }
      }
    }
    await sb(`investment_reservations?id=eq.${resId}`,{method:'PATCH',body:JSON.stringify({status})});
    // Notify investor
    try{
      const resArr=await sb(`investment_reservations?id=eq.${resId}&select=*`);
      if(resArr&&resArr.length){
        const userArr=await sb(`users?id=eq.${resArr[0].user_id}&select=name,email`);
        const invArr=await sb(`investments?id=eq.${resArr[0].investment_id}&select=title,unit_price`);
        if(userArr&&userArr.length&&invArr&&invArr.length){
          const notifType=status==='approved'?'investment_approved':status==='payment_confirmed'?'investment_payment_confirmed':status==='cancelled'?'investment_cancelled':null;
          if(notifType){
            await notify({type:notifType,to:userArr[0].email,name:userArr[0].name,investment:invArr[0].title,units:resArr[0].units,amount:resArr[0].units*invArr[0].unit_price,payment_method:resArr[0].payment_method});
          }
        }
      }
    }catch(e){console.error('Investment notify error:',e);}
    await openInvestmentDetail(invId);
  }catch(e){alert('Error updating reservation: '+e.message);}
}

function openRecordIncome(invId,confirmedUnits){
  const now=new Date();
  const monthStr=now.toLocaleString('default',{month:'long',year:'numeric'});
  openModal(`
  <h3>Record monthly income</h3>
  <p style="font-size:13px;color:#666;margin-top:-6px">${confirmedUnits} confirmed unit holders will receive their share automatically.</p>
  <div class="field"><label>Month</label><input id="ri-month" value="${monthStr}"></div>
  <div class="field"><label>Gross income (₦)</label><input id="ri-gross" type="number" placeholder="e.g. 500000" oninput="previewNetIncome()"></div>
  <div class="field"><label>Expenses (₦)</label><input id="ri-exp" type="number" placeholder="e.g. 50000" oninput="previewNetIncome()" value="0"></div>
  <div id="ri-preview" style="background:#F0FDF8;border-radius:8px;padding:12px;font-size:13px;display:none">
    <div style="display:flex;justify-content:space-between"><span style="color:#888">Net income</span><strong id="ri-net" class="green"></strong></div>
    <div style="display:flex;justify-content:space-between;margin-top:6px"><span style="color:#888">Per unit</span><strong id="ri-per"></strong></div>
  </div>
  <div class="error" id="ri-err"></div>
  <div class="modal-footer">
    <button class="btn" onclick="openInvestmentDetail('${invId}')">Cancel</button>

function previewNetIncome(){
  const gross=parseFloat(document.getElementById('ri-gross')?.value||0);
  const exp=parseFloat(document.getElementById('ri-exp')?.value||0);
  const preview=document.getElementById('ri-preview');
  if(gross>0&&preview){
    const net=gross-exp;
    document.getElementById('ri-net').textContent=fmt(net);
    document.getElementById('ri-per').textContent=fmt(net);
    preview.style.display='block';
  }
}

async function saveIncome(invId,confirmedUnits){
  const month=document.getElementById('ri-month').value.trim();
  const gross_income=parseFloat(document.getElementById('ri-gross').value);
  const expenses=parseFloat(document.getElementById('ri-exp').value||0);
  const err=document.getElementById('ri-err');
  const btn=document.getElementById('ri-btn');
  if(!month||!gross_income){err.textContent='Month and gross income are required.';return;}
  const net_income=+(gross_income-expenses).toFixed(2);
  btn.innerHTML='<span class="spinner"></span> Distributing…';btn.disabled=true;
  try{
    // Save income record
    await sb('investment_income',{method:'POST',body:JSON.stringify({investment_id:invId,month,gross_income,expenses,net_income})});
    // Get confirmed reservations
    const reservations=await sb(`investment_reservations?investment_id=eq.${invId}&status=eq.payment_confirmed&select=*`);
    const totalUnits=reservations.reduce((a,r)=>a+r.units,0);
    const today=new Date().toISOString().split('T')[0];
    // Distribute to each investor by crediting savings
    for(const r of reservations){
      const share=+((r.units/totalUnits)*net_income).toFixed(2);
      if(share>0){
        await sb('payments',{method:'POST',body:JSON.stringify({
          user_id:r.user_id,
          amount:share,
          date:today,
          withdrawn:false
        })});
      }
    }
    closeModal();
    toast('<i class="ti ti-check"></i> Income recorded and distributed to '+reservations.length+' investors!');
    await renderAdmin();
  }catch(e){err.textContent='Error saving income.';btn.innerHTML='<i class="ti ti-device-floppy"></i> Record & distribute';btn.disabled=false;}
}

        const pct=Math.min(100,Math.round((unitsSold/inv.total_units)*100));
        const deadline=inv.deadline?Math.max(0,Math.ceil((new Date(inv.deadline)-new Date())/(1000*60*60*24))):null;

        html+='<div class="card" style="margin-bottom:1rem">'
          +'<div style="display:inline-block;background:#D1FAE5;color:#065F46;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;margin-bottom:8px">Open for investment</div>'

          +'<p style="font-size:13px;color:#888;margin-bottom:12px">'+(inv.description||'')+'</p>'
          +'<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:12px">'
          +'<div class="stat" style="padding:10px 12px"><div class="stat-label">Unit price</div><div style="font-size:14px;font-weight:600">'+fmt(inv.unit_price)+'</div></div>'
          +'<div class="stat" style="padding:10px 12px"><div class="stat-label">Units available</div><div style="font-size:14px;font-weight:600;color:'+(unitsAvailable<100?'#A32D2D':'#1a1a1a')+'">'+unitsAvailable+'</div></div>'
          +'<div class="stat" style="padding:10px 12px"><div class="stat-label">Units sold</div><div style="font-size:14px;font-weight:600;color:#0F6E56">'+unitsSold+'</div></div>'
          +'<div class="stat" style="padding:10px 12px"><div class="stat-label">Amount raised</div><div style="font-size:14px;font-weight:600;color:#0F6E56">'+fmt(amountRaised)+'</div></div>'
          +'<div class="stat" style="padding:10px 12px"><div class="stat-label">Target</div><div style="font-size:14px;font-weight:600">'+fmt(inv.total_cost)+'</div></div>'
          +(deadline!==null?'<div class="stat" style="padding:10px 12px"><div class="stat-label">Days left</div><div style="font-size:14px;font-weight:600;color:'+(deadline<7?'#A32D2D':'#1a1a1a')+'">'+deadline+'</div></div>':'')
          +'</div>'
          +'<div style="background:#f5f5f3;border-radius:8px;height:6px;overflow:hidden;margin-bottom:4px">'
          +'<div style="height:100%;background:#1D9E75;width:'+pct+'%"></div></div>'
          +'<div style="font-size:11px;color:#888;margin-bottom:12px">'+pct+'% funded &middot; '+confirmedRes.length+' investor'+(confirmedRes.length!==1?'s':'')+' so far</div>'
          +'<button class="btnbtn-primary" data-inv-id="'+inv.id+'" data-inv-title="'+inv.title.replace(/"/g,'&quot;')+'" data-unit-price="'+inv.unit_price+'" data-units="'+unitsAvailable+'" onclick="openReserveUnitsFromBtn(this)" style="width:100%"><i class="ti ti-shopping-cart"></i> Reserve units</button>'
          +'<button class="btn btn-sm" data-share-type="investment" data-share-title="'+inv.title.replace(/"/g,'&quot;')+'" onclick="openShareCardFromBtn(this)" style="width:100%;margin-top:8px"><i class="ti ti-share-2"></i> Share</button>'
          +'</div>';
      });
    }

    if(!myConfirmed.length&&!openNotInvested.length&&!comingSoon.length){
      html+='<div class="card"><div class="empty"><i class="ti ti-building-store" style="font-size:32px;display:block;margin-bottom:10px;color:#ccc"></i>No investment opportunities available yet.<br>Check back soon!</div></div>';
    }

    html+='</div>';
    return html;
  }catch(e){return'<div class="card"><div class="empty">Error loading investments: '+e.message+'</div></div>';}
}

async function approveInvestmentRefund(refundId,invId){
  if(!confirm('Approve this refund request? The invested amount will be returned to their savings balance.'))return;
  try{
    // Get the refund request
    const reqArr=await sb(`investment_refund_requests?id=eq.${refundId}&select=*`);
    const req=reqArr[0];
    // Get the reservation
    const resArr=await sb(`investment_reservations?investment_id=eq.${invId}&user_id=eq.${req.user_id}&status=eq.payment_confirmed&select=*`);
    if(resArr&&resArr.length){
      const res=resArr[0];
      const invArr=await sb(`investments?id=eq.${invId}&select=*`);
      const inv=invArr[0];
      const refundAmount=+(res.units*inv.unit_price).toFixed(2);
      const today=new Date().toISOString().split('T')[0];
      // Credit back to savings
      await sb('payments',{method:'POST',body:JSON.stringify({user_id:req.user_id,amount:refundAmount,date:today,withdrawn:false,is_transfer:true})});
      // Cancel the reservation
      await sb(`investment_reservations?id=eq.${res.id}`,{method:'PATCH',body:JSON.stringify({status:'cancelled'})});
    }
    await sb(`investment_refund_requests?id=eq.${refundId}`,{method:'PATCH',body:JSON.stringify({status:'approved'})});
    toast('<i class="ti ti-check"></i> Refund approved and credited to savings.');
    // Notify investor
    try{
      const reqArr2=await sb(`investment_refund_requests?id=eq.${refundId}&select=*`);
      if(reqArr2&&reqArr2.length){
        const userArr=await sb(`users?id=eq.${reqArr2[0].user_id}&select=name,email`);
        const invArr=await sb(`investments?id=eq.${reqArr2[0].investment_id}&select=title`);
        if(userArr&&userArr.length){
          await notify({type:'investment_refund_approved',to:userArr[0].email,name:userArr[0].name,investment:invArr&&invArr.length?invArr[0].title:'your investment'});
        }
      }
    }catch(e){console.error('Refund notify error:',e);}
    await openInvestmentDetail(invId);
  }catch(e){alert('Error approving refund: '+e.message);}
}

// Featured deals quietly expire back to "approved" (never deleted) once their date passes.
// No server cron exists, so this runs client-side whenever deals are loaded — checked on
// every admin/homepage/dashboard deals fetch, so it self-corrects within one page load of
// the expiry date passing, without needing a backend job.
async function expireOldFeaturedDeals(deals){
  const today=new Date();today.setHours(0,0,0,0);
  const expired=(deals||[]).filter(d=>d.status==='featured'&&d.expires_at&&new Date(d.expires_at)<today);
  for(const d of expired){
    try{
      await sb(`deals?id=eq.${d.id}`,{method:'PATCH',body:JSON.stringify({status:'approved'})});
      d.status='approved'; // reflect immediately in the in-memory list passed in
    }catch(e){logSystemError('expireOldFeaturedDeals',e);}
  }
  return deals;
}

// Manual navigation (also resets the autoplay timer so it doesn't jump right after a click)
function dealsCarouselGoTo(trackId,idx){
  const list=window._dealsCarouselList||[];
  if(!list.length)return;
  dealsCarouselIndex=((idx%list.length)+list.length)%list.length;
  renderDealsCarouselFrame(trackId);
  startDealsCarouselAutoplay(trackId);
}
function dealsCarouselNav(trackId,dir){
  dealsCarouselGoTo(trackId,dealsCarouselIndex+dir);
}
function renderDealsCarouselFrame(trackId){
  const list=window._dealsCarouselList||[];
  const el=document.getElementById(trackId);
  if(!el||!list.length)return;
  el.innerHTML=buildDealCard(list[dealsCarouselIndex]);
  const dotsEl=document.getElementById(trackId+'-dots');
  if(dotsEl)dotsEl.innerHTML=list.map((_,i)=>`<div onclick="dealsCarouselGoTo('${trackId}',${i})" style="width:7px;height:7px;border-radius:50%;cursor:pointer;background:${i===dealsCarouselIndex?'#0D3D2A':'#e5e5e2'}"></div>`).join('');
}
// Auto-advances every 5s; self-clears if the carousel's container has left the DOM
// (e.g. the user navigated away), so it never keeps ticking on a page that's gone.
function startDealsCarouselAutoplay(trackId){
  if(dealsCarouselTimer)clearInterval(dealsCarouselTimer);
  const list=window._dealsCarouselList||[];
  if(list.length<=1)return;
  dealsCarouselTimer=setInterval(()=>{
    const el=document.getElementById(trackId);
    if(!el){clearInterval(dealsCarouselTimer);dealsCarouselTimer=null;return;}
    dealsCarouselIndex=(dealsCarouselIndex+1)%list.length;
    renderDealsCarouselFrame(trackId);
  },5000);
}

async function approveProfileRequest(reqId,userId){
  try{
    const reqArr=await sb(`profile_update_requests?id=eq.${reqId}&select=*`);
    const req=reqArr[0];

    // Snapshot current values before they get overwritten, for the audit trail
    const [currentUserArr,currentBankArr]=await Promise.all([
      sb(`users?id=eq.${userId}&select=name,email,phone,whatsapp`),
      sb(`bank_details?user_id=eq.${userId}&select=bank_name,account_number,account_name`)
    ]);
    const prevUser=currentUserArr&&currentUserArr.length?currentUserArr[0]:{};
    const prevBank=currentBankArr&&currentBankArr.length?currentBankArr[0]:{};
    const oldValues={},newValues={};
    if(req.requested_name&&req.requested_name!==prevUser.name){oldValues.name=prevUser.name||null;newValues.name=req.requested_name;}
    if(req.requested_email&&req.requested_email!==prevUser.email){oldValues.email=prevUser.email||null;newValues.email=req.requested_email;}
    if(req.requested_phone&&req.requested_phone!==prevUser.phone){oldValues.phone=prevUser.phone||null;newValues.phone=req.requested_phone;}
    if(req.requested_whatsapp&&req.requested_whatsapp!==prevUser.whatsapp){oldValues.whatsapp=prevUser.whatsapp||null;newValues.whatsapp=req.requested_whatsapp;}
    if(req.requested_bank_name&&req.requested_bank_name!==prevBank.bank_name){oldValues.bank_name=prevBank.bank_name||null;newValues.bank_name=req.requested_bank_name;}
    if(req.requested_account_number&&req.requested_account_number!==prevBank.account_number){oldValues.account_number=prevBank.account_number||null;newValues.account_number=req.requested_account_number;}
    if(req.requested_account_name&&req.requested_account_name!==prevBank.account_name){oldValues.account_name=prevBank.account_name||null;newValues.account_name=req.requested_account_name;}

    // Update user record
    const userUpdate={name:req.requested_name,email:req.requested_email};
    if(req.requested_phone)userUpdate.phone=req.requested_phone;
    if(req.requested_whatsapp)userUpdate.whatsapp=req.requested_whatsapp;
    await sb(`users?id=eq.${userId}`,{method:'PATCH',body:JSON.stringify(userUpdate)});
    // Update bank details if provided
    if(req.requested_bank_name){
      const existing=await sb(`bank_details?user_id=eq.${userId}&select=id`);
      const bankData={bank_name:req.requested_bank_name,account_number:req.requested_account_number,account_name:req.requested_account_name};
      if(existing&&existing.length){
        await sb(`bank_details?id=eq.${existing[0].id}`,{method:'PATCH',body:JSON.stringify(bankData)});
      } else {
        await sb('bank_details',{method:'POST',body:JSON.stringify({user_id:userId,...bankData})});
      }
    }
    await updateProfileRequest(reqId,'approved',oldValues,newValues);
    // Notify contributor
    try{
      const userArr=await sb(`users?id=eq.${userId}&select=name,email`);
      if(userArr&&userArr.length)await notify({type:'profile_approved',to:userArr[0].email,name:userArr[0].name});
    }catch(e){console.error('Profile notify error:',e);}
    toast('<i class="ti ti-check"></i> Profile updated successfully.');
  }catch(e){alert('Error approving request: '+e.message);}
}

async function updateProfileRequest(reqId,status,oldValues,newValues){
  try{
    const body={status};
    if(oldValues)body.previous_values=JSON.stringify(oldValues);
    if(newValues)body.approved_values=JSON.stringify(newValues);
    await sb(`profile_update_requests?id=eq.${reqId}`,{method:'PATCH',body:JSON.stringify(body)});
    await renderAdmin();
  }catch(e){alert('Error updating request.');}
}

async function registerWebinar(webinarId){
  const name=document.getElementById('wr-name').value.trim();
  const email=document.getElementById('wr-email').value.trim().toLowerCase();
  const phone=document.getElementById('wr-phone').value.trim();
  const err=document.getElementById('wr-err');
  const btn=document.getElementById('wr-btn');
  if(!name||!email){err.textContent='Please enter your name and email.';return;}
  if(!email.includes('@')||!email.includes('.')){err.textContent='Please enter a valid email address.';return;}
  btn.innerHTML='<span class="spinner"></span> Registering…';btn.disabled=true;
  try{
    await sb('webinar_registrations',{method:'POST',body:JSON.stringify({name,email,phone:phone||null,webinar_id:webinarId})});
    setHTML(`
    <div style="min-height:100vh;background:#f5f5f3;display:flex;align-items:center;justify-content:center;padding:2rem">

        <p style="font-size:13px;color:#888;margin-bottom:20px">While you are here &mdash; join Fundova and start your savings journey today.</p>
        <a href="/" class="btn btn-primary" style="display:inline-flex;padding:12px 24px;text-decoration:none"><i class="ti ti-currency-naira"></i> Learn about Fundova savings</a>

async function uploadSpeakerPhoto(input,speakerNum){
  const file=input.files[0];
  if(!file)return;
  const urlEl=document.getElementById('wn-sp'+speakerNum+'-url');
  urlEl.textContent='Uploading…';
  try{
    const ext=file.name.split('.').pop();
    const path='speakers/'+Date.now()+'-'+speakerNum+'.'+ext;
    const res=await fetch(`${SB_URL}/storage/v1/object/fundova-media/${path}`,{
      method:'POST',headers:{'Authorization':'Bearer '+SB_KEY,'apikey':SB_KEY,'Content-Type':file.type,'x-upsert':'true'},body:file
    });
    if(!res.ok)throw new Error('Upload failed');
    const url=`${SB_URL}/storage/v1/object/public/fundova-media/${path}`;
    input.dataset.url=url;
    urlEl.textContent='Uploaded!';
    urlEl.style.color='#0F6E56';
  }catch(e){urlEl.textContent='Upload failed: '+e.message;urlEl.style.color='#A32D2D';}
}

async function uploadWebinarFlyer(input){

  if(!file)return;

}

async function saveWebinar(id){
  const isEdit=!!id;
  const title=document.getElementById('wn-title').value.trim();
  const subtitle=document.getElementById('wn-subtitle').value.trim();
  const description=document.getElementById('wn-desc').value.trim();
  const event_date=document.getElementById('wn-date').value||null;
  const event_time=document.getElementById('wn-time').value.trim()||null;
  const zoom_link=document.getElementById('wn-zoom').value.trim()||null;
  const topicsRaw=document.getElementById('wn-topics').value.trim();
  const topics=topicsRaw?JSON.stringify(topicsRaw.split('\n').filter(t=>t.trim())):null;
  const status=document.getElementById('wn-status').value;
  const flyer_url=document.getElementById('wn-flyer')?.dataset?.url||null;
  const err=document.getElementById('wn-err');
  const btn=document.getElementById('wn-btn');

  if(!title){err.textContent='Title is required.';return;}

  // Build speakers array
  const speakers=[];
  for(let i=1;i<=3;i++){
    const name=document.getElementById('wn-sp'+i+'-name')?.value?.trim();
    const spTitle=document.getElementById('wn-sp'+i+'-title')?.value?.trim();
    const photo_url=document.getElementById('wn-sp'+i+'-photo')?.dataset?.url||null;
    if(name)speakers.push({name,title:spTitle||'',photo_url});
  }

  btn.innerHTML='<span class="spinner"></span> Saving…';btn.disabled=true;

  // If setting to active, deactivate all others first
  if(status==='active'){
    await sb('webinars?status=eq.active',{method:'PATCH',body:JSON.stringify({status:'past'})});
  }

  try{
    const payload={title,subtitle,description,event_date,event_time,zoom_link,topics,speakers:JSON.stringify(speakers),flyer_url,status};
    if(isEdit){
      await sb(`webinars?id=eq.${id}`,{method:'PATCH',body:JSON.stringify(payload)});
    } else {
      await sb('webinars',{method:'POST',body:JSON.stringify(payload)});
    }
    closeModal();
    toast('<i class="ti ti-check"></i> Webinar '+(isEdit?'updated':'created')+'!');
    await renderAdmin();
  }catch(e){err.textContent='Error saving.';btn.innerHTML='<i class="ti ti-device-floppy"></i> '+(isEdit?'Save changes':'Create webinar');btn.disabled=false;}
}

async function saveSavingsGoal(){
  const amount=parseFloat(document.getElementById('sg-amount').value);
  const purpose=(document.getElementById('sg-purpose')?.value||'').trim();
  const err=document.getElementById('sg-err');
  const btn=document.getElementById('sg-btn');
  if(!amount||amount<=0){err.textContent='Please enter a valid target amount.';return;}
  btn.innerHTML='<span class="spinner"></span> Saving…';btn.disabled=true;
  try{
    const updateData={savings_goal:amount};
    if(purpose!==undefined) updateData.savings_goal_purpose=purpose||null;
    await sb(`users?id=eq.${currentUser.id}`,{method:'PATCH',body:JSON.stringify(updateData)});
    currentUser.savings_goal=amount;
    currentUser.savings_goal_purpose=purpose||null;
    saveSession(currentUser);
    closeModal();
    // Reset milestone notifications so new goal gets celebrated
    if(amount!==(currentUser.savings_goal)){
      ['25%','50%','75%','100%'].forEach(m=>localStorage.removeItem('fundova_goal_'+currentUser.id+'_'+m));
    }
    toast('<i class="ti ti-check"></i> Savings goal saved!');
    await renderContributor();
  }catch(e){err.textContent='Error saving goal.';btn.innerHTML='<i class="ti ti-target"></i> Save goal';btn.disabled=false;}
}

async function clearSavingsGoal(){
  try{
    await sb(`users?id=eq.${currentUser.id}`,{method:'PATCH',body:JSON.stringify({savings_goal:null})});
    currentUser.savings_goal=null;
    saveSession(currentUser);
    closeModal();
    await renderContributor();
  }catch(e){alert('Error removing goal.');}
}

// Admin-only: record Ajo contributions (coordinators and members can no longer self-record)
async function buildAdminAjoGroupsSection(){
  const groups=await sb('savings_groups?status=eq.active&select=*&order=created_at.asc');
  if(!groups||!groups.length){
    return`<div class="card"><h3>Ajo groups — record contributions</h3><div class="empty">No active Ajo groups yet.</div></div>`;
  }
  const groupIds=groups.map(g=>g.id);
  const [allMembers,allContribs,allPayouts,coords]=await Promise.all([
    sb(`group_members?group_id=in.(${groupIds.join(',')})&select=*`),
    sb(`group_contributions?group_id=in.(${groupIds.join(',')})&select=*`),
    sb(`group_payouts?group_id=in.(${groupIds.join(',')})&select=*`),
    sb(`users?id=in.(${[...new Set(groups.map(g=>g.coordinator_id))].join(',')})&select=id,name`)
  ]);
  const coordMap={};(coords||[]).forEach(c=>{coordMap[c.id]=c.name;});
  const memberUserIds=[...new Set((allMembers||[]).map(m=>m.user_id))];
  let usersMap={};
  if(memberUserIds.length){
    const users=await sb(`users?id=in.(${memberUserIds.join(',')})&select=id,name,email`);
    users.forEach(u=>{usersMap[u.id]=u;});
  }

  const groupBlocks=groups.map(g=>{
    const gMembers=(allMembers||[]).filter(m=>m.group_id===g.id&&m.status!=='removed').sort((a,b)=>(a.payout_order||999)-(b.payout_order||999));
    if(!gMembers.length)return'';
    const gPayouts=(allPayouts||[]).filter(p=>p.group_id===g.id);
    const currentCycle=gPayouts.filter(p=>p.status==='completed').length+1;
    const rows=gMembers.map(m=>{
      const u=usersMap[m.user_id]||{name:'Unknown'};
      const gContribs=(allContribs||[]).filter(c=>c.group_id===g.id&&c.member_id===m.id&&c.cycle===currentCycle);
      const hasPaid=gContribs.some(c=>c.status==='paid');
      return`<tr>
        <td style="font-weight:500">${u.name}</td>
        <td>${fmt(m.contribution_amount)}</td>
        <td>${hasPaid?'<span class="status-pill pill-approved">Recorded</span>':'<span class="status-pill pill-pending">Not yet</span>'}</td>
        <td>${!hasPaid?`<button class="btn btn-sm btn-primary" onclick="adminRecordGroupContribution('${m.id}','${g.id}',${m.contribution_amount},${currentCycle})"><i class="ti ti-plus"></i> Record</button>`:'<span style="color:#aaa;font-size:12px">—</span>'}</td>
      </tr>`;
    }).join('');
    return`<div style="margin-bottom:1.25rem">
      <div style="font-size:13px;font-weight:600;margin-bottom:6px">${g.name} <span style="font-weight:400;color:#888;font-size:12px">· Coordinator: ${coordMap[g.coordinator_id]||'—'} · Cycle ${currentCycle}</span></div>
      <div class="table-wrap"><table>
        <tr><th>Member</th><th>Expected</th><th>This cycle</th><th></th></tr>
        ${rows}
      </table></div>
    </div>`;
  }).join('');

  return`<div class="card">
    <h3>Ajo groups — record contributions</h3>
    <p style="font-size:12px;color:#888;margin-top:-8px;margin-bottom:1rem">Only admin records member contributions. Coordinators handle payouts from their <code>/ajo</code> dashboard.</p>

function toggleBalanceVisibility(){
  const visible = document.getElementById('balance-value-visible');
  const hidden = document.getElementById('balance-value-hidden');
  const icon = document.getElementById('balance-eye-icon');
  if(!visible||!hidden||!icon)return;
  const isCurrentlyHidden = hidden.style.display !== 'none';
  if(isCurrentlyHidden){
    hidden.style.display='none'; visible.style.display='';
    icon.className='ti ti-eye';
    localStorage.setItem('fundova_balance_hidden','0');
  } else {
    hidden.style.display=''; visible.style.display='none';
    icon.className='ti ti-eye-off';
    localStorage.setItem('fundova_balance_hidden','1');
  }
}
function initBalanceVisibility(){
  if(localStorage.getItem('fundova_balance_hidden')==='1'){
    const visible = document.getElementById('balance-value-visible');
    const hidden = document.getElementById('balance-value-hidden');
    const icon = document.getElementById('balance-eye-icon');
    if(visible)visible.style.display='none';
    if(hidden)hidden.style.display='';
    if(icon)icon.className='ti ti-eye-off';
  }
}

// Shared coordinator-facing group card — used by the embedded dashboard section and the dedicated /ajo page
function buildAjoGroupCard(g,allMembers,allContribs,allPayouts,membersMap){
  const gMembers=(allMembers||[]).filter(m=>m.group_id===g.id&&m.status!=='removed').sort((a,b)=>a.payout_order-b.payout_order);
  const gPayouts=(allPayouts||[]).filter(p=>p.group_id===g.id);
  const completedPayoutIds=new Set(gPayouts.filter(p=>p.status==='completed').map(p=>p.recipient_id));
  const totalExpected=gMembers.reduce((a,m)=>a+Number(m.contribution_amount),0);
  const currentCycle=gPayouts.filter(p=>p.status==='completed').length+1;
  const unpaidMembers=gMembers.filter(m=>!completedPayoutIds.has(m.id)).sort((a,b)=>(a.payout_order||999)-(b.payout_order||999));
  const nextPayoutMemberId=unpaidMembers.length?unpaidMembers[0].id:null;

  const memberRows=gMembers.map(m=>{
    const u=membersMap[m.user_id]||{name:'Unknown'};
    const hasPaidOut=completedPayoutIds.has(m.id);
    const gContribs=(allContribs||[]).filter(c=>c.group_id===g.id&&c.member_id===m.id&&c.cycle===currentCycle);
    const hasPaid=gContribs.some(c=>c.status==='paid');
    const isNextInLine=!hasPaidOut&&m.id===nextPayoutMemberId;
    return`<tr style="${hasPaidOut?'opacity:0.5':''}">
      <td>
        <div style="font-weight:500">${u.name} ${hasPaidOut?'<span style="font-size:10px;background:#D1FAE5;color:#065F46;padding:1px 6px;border-radius:10px">Paid out</span>':''}${isNextInLine?'<span style="font-size:10px;background:#FEF3C7;color:#856404;padding:1px 6px;border-radius:10px;margin-left:4px">Next in line</span>':''}</div>
        <div style="font-size:11px;color:#888">${u.phone||u.email||''}</div>
      </td>
      <td style="font-weight:500">${fmt(m.contribution_amount)}</td>
      <td>${m.payout_order||'—'}</td>

        ?'<span class="status-pill pill-approved">Paid</span>'
        :'<span class="status-pill pill-pending">Pending</span>'}</td>
      <td><div style="display:flex;gap:4px;justify-content:flex-end">
        ${!hasPaidOut&&isNextInLine?`<button class="btn btn-sm" style="background:#0F6E56;color:#fff" onclick="initiateGroupPayout('${g.id}','${m.id}','${u.name.replace(/'/g,"\'")}',${m.contribution_amount},${currentCycle})"><i class="ti ti-cash"></i> Pay out</button>`:''}

  const totalSaved=(allContribs||[]).filter(c=>c.group_id===g.id&&c.status==='paid').reduce((a,c)=>a+Number(c.amount),0);
  const goalPct=g.savings_goal?Math.min(100,Math.round((totalSaved/g.savings_goal)*100)):null;

  return`<div class="card" style="margin-bottom:1rem">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px">
      <div>
        <h3 style="font-size:15px;margin-bottom:4px">${g.name}</h3>
        <div style="font-size:12px;color:#888">${g.description||''}</div>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn btn-sm btn-edit" onclick="openEditGroup('${g.id}')"><i class="ti ti-pencil"></i></button>
        ${gMembers.length>=g.max_members
          ?`<button class="btn btn-sm" disabled title="Group is full (${gMembers.length}/${g.max_members}). Edit the group to raise the member cap." style="opacity:.5;cursor:not-allowed"><i class="ti ti-users"></i> Group full</button>`
          :`<button class="btn btn-sm btn-primary" data-gid="${g.id}" data-gname="${g.name}" onclick="openInviteMember(this.dataset.gid,this.dataset.gname)"><i class="ti ti-user-plus"></i> Invite member</button>`}
        ${unpaidMembers.length===0&&gMembers.length?`<button class="btn btn-sm" title="All members paid out — start a new cycle" onclick="resetGroupCycle('${g.id}')"><i class="ti ti-refresh"></i> Reset for new cycle</button>`:''}
        <button class="btn btn-sm btn-danger" title="Close group" onclick="closeAjoGroup('${g.id}')"><i class="ti ti-x"></i></button>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:12px">
      <div class="stat" style="padding:10px 12px"><div class="stat-label">Members</div><div style="font-size:15px;font-weight:600${gMembers.length>=g.max_members?';color:#856404':''}">${gMembers.length}/${g.max_members}${gMembers.length>=g.max_members?' <span style="font-size:10px;font-weight:600">(Full)</span>':''}</div></div>
      <div class="stat" style="padding:10px 12px"><div class="stat-label">Current cycle</div><div style="font-size:15px;font-weight:600">${currentCycle}</div></div>
      <div class="stat" style="padding:10px 12px"><div class="stat-label">Total saved</div><div style="font-size:15px;font-weight:600;color:#0F6E56">${fmt(totalSaved)}</div></div>
      <div class="stat" style="padding:10px 12px"><div class="stat-label">Expected/cycle</div><div style="font-size:15px;font-weight:600">${fmt(totalExpected)}</div></div>
    </div>
    ${goalPct!==null?`
    <div style="background:#f5f5f3;border-radius:8px;height:6px;overflow:hidden;margin-bottom:4px">
      <div style="height:100%;background:#1D9E75;width:${goalPct}%"></div>
    </div>
    <div style="font-size:11px;color:#888;margin-bottom:12px">${goalPct}% of group goal ${fmt(g.savings_goal)}</div>`:''}
    ${gMembers.length?`<div class="table-wrap"><table>
      <tr><th>Member</th><th>Contribution</th><th>Payout order</th><th>This cycle</th><th></th></tr>
      ${memberRows}
    </table></div>`:'<div class="empty" style="padding:1rem">No members yet. Invite your first members!</div>'}
    ${gPayouts.length?`
    <div style="margin-top:12px">
      <div style="font-size:12px;font-weight:600;color:#888;text-transform:uppercase;margin-bottom:8px">Payout history</div>
      <div class="table-wrap"><table>
        <tr><th>Recipient</th><th>Amount</th><th>Cycle</th><th>Status</th><th>Date</th></tr>
        ${gPayouts.map(p=>{
          const m=gMembers.find(gm=>gm.id===p.recipient_id);
          const u=m?membersMap[m.user_id]:{name:'Unknown'};
          return`<tr style="${p.status==='completed'?'opacity:0.6':''}">
            <td style="font-weight:500">${u.name} ${p.status==='completed'?'<span style="font-size:10px;background:#D1FAE5;color:#065F46;padding:1px 6px;border-radius:10px">Done</span>':''}</td>
            <td>${fmt(p.amount)}</td>
            <td>Cycle ${p.cycle}</td>
            <td>${p.status==='completed'?'<span class="status-pill pill-approved">Completed</span>':'<span class="status-pill pill-pending">Pending</span>'}</td>
            <td>${p.processed_at?fmtDate(p.processed_at):'—'}</td>
          </tr>`;
        }).join('')}
      </table></div>
    </div>`:''}
  </div>`;
}

// ─── DEDICATED /ajo DASHBOARD ──────────────────────────────
async function renderAjoPage(){
  try{

    const [coordGroups,myMemberships]=await Promise.all([
      isCoordinator?sb(`savings_groups?coordinator_id=eq.${currentUser.id}&status=eq.active&select=*&order=created_at.asc`):Promise.resolve([]),
      sb(`group_members?user_id=eq.${currentUser.id}&select=*`)
    ]);
    const activeMemberships=(myMemberships||[]).filter(m=>m.status!=='removed');

    let coordSectionHtml='';
    let memberSectionHtml='';

    if(isCoordinator){
      if(!coordGroups||!coordGroups.length){
        coordSectionHtml=`<div class="card">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem">
            <h3 style="margin:0">My savings groups</h3>
            <button class="btn btn-primary btn-sm" onclick="openCreateGroup()"><i class="ti ti-plus"></i> Create group</button>

        </div>`;
      } else {
        const groupIds=coordGroups.map(g=>g.id);
        const [allMembers,allContribs,allPayouts]=await Promise.all([
          sb(`group_members?group_id=in.(${groupIds.join(',')})&select=*`),
          sb(`group_contributions?group_id=in.(${groupIds.join(',')})&select=*&order=created_at.desc`),
          sb(`group_payouts?group_id=in.(${groupIds.join(',')})&select=*&order=created_at.desc`)
        ]);
        const memberUserIds=[...new Set((allMembers||[]).map(m=>m.user_id))];
        let membersMap={};
        if(memberUserIds.length){
          const users=await sb(`users?id=in.(${memberUserIds.join(',')})&select=id,name,email,phone,whatsapp`);
          users.forEach(u=>{membersMap[u.id]=u;});
        }
        const totalMembersAcross=(allMembers||[]).filter(m=>m.status!=='removed').length;
        const totalFundsHeld=Math.max(0,(allContribs||[]).filter(c=>c.status==='paid').reduce((a,c)=>a+Number(c.amount),0)-(allPayouts||[]).filter(p=>p.status==='completed').reduce((a,p)=>a+Number(p.amount),0));
        const overviewCards=`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:1.25rem">
          <div class="stat"><div class="stat-label">Groups you run</div><div class="stat-val">${coordGroups.length}</div></div>
          <div class="stat"><div class="stat-label">Total members</div><div class="stat-val">${totalMembersAcross}</div></div>
          <div class="stat"><div class="stat-label">Funds currently held</div><div class="stat-val green">${fmt(totalFundsHeld)}</div></div>
        </div>`;
        const cards=coordGroups.map(g=>buildAjoGroupCard(g,allMembers,allContribs,allPayouts,membersMap)).join('');
        const earningsHtml=await renderCoordinatorEarnings();
        coordSectionHtml=`<div>
          ${overviewCards}
          ${earningsHtml}
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem">
            <h3 style="margin:0">My savings groups</h3>
            <button class="btn btn-primary btn-sm" onclick="openCreateGroup()"><i class="ti ti-plus"></i> Create group</button>
          </div>
          ${cards}
        </div>`;
      }
    }

    if(activeMemberships.length){
      memberSectionHtml=await buildAjoMemberView(activeMemberships);
    }

    const showCoordinator=isCoordinator;
    const showMember=activeMemberships.length>0;
    let bodyHtml='';
    if(!showCoordinator&&!showMember){
      bodyHtml=`<div class="card">
        <div class="empty">
          <i class="ti ti-users" style="font-size:32px;display:block;margin-bottom:10px;color:#ccc"></i>
          You're not part of any Ajo group yet.<br><br>
          <button class="btn btn-primary" onclick="openApplyCoordinator()"><i class="ti ti-send"></i> Apply to become a coordinator</button>
        </div>
      </div>`;
    } else if(showCoordinator&&showMember){
      bodyHtml=`
        <div style="display:flex;gap:6px;margin-bottom:1.25rem;background:#ece9e6;padding:3px;border-radius:9px;width:fit-content" id="ajo-tabs">
          <button class="tab active" id="ajo-tab-coord" onclick="switchAjoTab('coord')">My groups (coordinator)</button>
          <button class="tab" id="ajo-tab-member" onclick="switchAjoTab('member')">Groups I'm in</button>
        </div>
        <div id="ajo-panel-coord">${coordSectionHtml}</div>
        <div id="ajo-panel-member" style="display:none">${memberSectionHtml}</div>
      `;
    } else if(showCoordinator){
      bodyHtml=coordSectionHtml;
    } else {
      bodyHtml=memberSectionHtml;
    }

    setHTML(`
    <div style="max-width:920px;margin:0 auto;padding:1.5rem 1rem 3rem">
      <div class="header">
        <div class="header-left">
          <img src="/logo.png" alt="Fundova" style="width:32px;height:32px;border-radius:8px;object-fit:cover">

function switchAjoTab(which){
  document.getElementById('ajo-tab-coord').classList.toggle('active',which==='coord');
  document.getElementById('ajo-tab-member').classList.toggle('active',which==='member');
  document.getElementById('ajo-panel-coord').style.display=which==='coord'?'':'none';
  document.getElementById('ajo-panel-member').style.display=which==='member'?'':'none';
}

// Member-facing view: position, this-cycle contribution status, next expected payout, per group
async function buildAjoMemberView(activeMemberships){
  const groupIds=[...new Set(activeMemberships.map(m=>m.group_id))];
  const [groups,allMembers,allContribs,allPayouts]=await Promise.all([
    sb(`savings_groups?id=in.(${groupIds.join(',')})&select=*`),
    sb(`group_members?group_id=in.(${groupIds.join(',')})&select=*`),
    sb(`group_contributions?group_id=in.(${groupIds.join(',')})&select=*`),
    sb(`group_payouts?group_id=in.(${groupIds.join(',')})&select=*`)
  ]);
  const groupsMap={};(groups||[]).forEach(g=>{groupsMap[g.id]=g;});
  const coordIds=[...new Set((groups||[]).map(g=>g.coordinator_id).filter(Boolean))];
  let coordMap={};
  if(coordIds.length){
    const coords=await sb(`users?id=in.(${coordIds.join(',')})&select=id,name`);
    (coords||[]).forEach(c=>{coordMap[c.id]=c.name;});
  }

  const cards=activeMemberships.map(m=>{
    const g=groupsMap[m.group_id];
    if(!g)return'';
    const gMembers=(allMembers||[]).filter(mm=>mm.group_id===g.id&&mm.status!=='removed').sort((a,b)=>(a.payout_order||999)-(b.payout_order||999));
    const gPayouts=(allPayouts||[]).filter(p=>p.group_id===g.id);
    const completedPayoutIds=new Set(gPayouts.filter(p=>p.status==='completed').map(p=>p.recipient_id));
    const currentCycle=gPayouts.filter(p=>p.status==='completed').length+1;
    const unpaidMembers=gMembers.filter(mm=>!completedPayoutIds.has(mm.id)).sort((a,b)=>(a.payout_order||999)-(b.payout_order||999));
    const myUnpaidRank=unpaidMembers.findIndex(mm=>mm.id===m.id);
    const hasPaidOut=completedPayoutIds.has(m.id);
    const gContribs=(allContribs||[]).filter(c=>c.group_id===g.id&&c.member_id===m.id&&c.cycle===currentCycle);
    const hasPaidThisCycle=gContribs.some(c=>c.status==='paid');

    let payoutStatusHtml;
    if(hasPaidOut){
      payoutStatusHtml=`<div style="background:#D1FAE5;color:#065F46;border-radius:8px;padding:10px 12px;font-size:13px"><i class="ti ti-check"></i> You've received your payout for this rotation.</div>`;
    } else if(myUnpaidRank===0){
      payoutStatusHtml=`<div style="background:#FEF3C7;color:#856404;border-radius:8px;padding:10px 12px;font-size:13px;font-weight:600"><i class="ti ti-star"></i> You're next in line for payout!</div>`;
    } else if(myUnpaidRank>0){
      payoutStatusHtml=`<div style="background:#f5f5f3;color:#555;border-radius:8px;padding:10px 12px;font-size:13px">${myUnpaidRank} member${myUnpaidRank!==1?'s':''} ahead of you before your payout.</div>`;
    } else {
      payoutStatusHtml=`<div style="background:#f5f5f3;color:#555;border-radius:8px;padding:10px 12px;font-size:13px">Waiting on this group's payout order.</div>`;
    }

    return`<div class="card" style="margin-bottom:1rem">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <div>
          <h3 style="font-size:15px;margin-bottom:2px">${g.name}</h3>
          <div style="font-size:12px;color:#888">Coordinated by ${coordMap[g.coordinator_id]||'—'}</div>
        </div>
        <span class="status-pill ${hasPaidThisCycle?'pill-approved':'pill-pending'}">${hasPaidThisCycle?'Paid this cycle':'Pending'}</span>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:10px">
        <div class="stat" style="padding:10px 12px"><div class="stat-label">Your position</div><div style="font-size:15px;font-weight:600">${m.payout_order||'—'}</div></div>
        <div class="stat" style="padding:10px 12px"><div class="stat-label">Your contribution</div><div style="font-size:15px;font-weight:600">${fmt(m.contribution_amount)}</div></div>
        <div class="stat" style="padding:10px 12px"><div class="stat-label">Current cycle</div><div style="font-size:15px;font-weight:600">${currentCycle}</div></div>
      </div>
      ${payoutStatusHtml}
    </div>`;
  }).join('');

  return`<div>
    <div class="info-box" style="margin-bottom:1.25rem"><i class="ti ti-info-circle"></i> Contributions are recorded by Fundova admin after payment is confirmed — please allow up to 24 hours for a payment to show as "Paid" here.</div>
    ${cards}
  </div>`;
}

function openCreateGroup(){
  openModal(`
  <h3>Create savings group</h3>
  <div class="field"><label>Group name</label><input id="cg-name" placeholder="e.g. Ajo December 2026"></div>
  <div class="field"><label>Description</label><input id="cg-desc" placeholder="Brief description"></div>
  <div class="field"><label>Maximum members</label><input id="cg-max" type="number" min="2" value="20" placeholder="e.g. 20"></div>
  <div class="field"><label>Group savings goal (optional)</label><input id="cg-goal" type="number" placeholder="e.g. 1000000"></div>
  <div class="error" id="cg-err"></div>
  <div class="modal-footer">
    <button class="btn" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" id="cg-btn" onclick="saveGroup(null)"><i class="ti ti-device-floppy"></i> Create group</button>
  </div>`);
}

async function saveGroup(id){
  const name=document.getElementById('cg-name').value.trim();
  const description=document.getElementById('cg-desc').value.trim();
  const max_members=parseInt(document.getElementById('cg-max').value)||20;
  const savings_goal=parseFloat(document.getElementById('cg-goal').value)||null;
  const err=document.getElementById('cg-err');
  const btn=document.getElementById('cg-btn');
  if(!name){err.textContent='Group name is required.';return;}
  btn.innerHTML='<span class="spinner"></span> Saving…';btn.disabled=true;
  try{
    if(id){
      await sb(`savings_groups?id=eq.${id}`,{method:'PATCH',body:JSON.stringify({name,description,max_members,savings_goal})});
    } else {
      await sb('savings_groups',{method:'POST',body:JSON.stringify({coordinator_id:currentUser.id,name,description,max_members,savings_goal,status:'active'})});
    }
    closeModal();
    toast('<i class="ti ti-check"></i> Group '+(id?'updated':'created')+'!');
    await (window.location.pathname==='/ajo'?renderAjoPage():renderContributor());
  }catch(e){err.textContent='Error saving group.';btn.innerHTML='<i class="ti ti-device-floppy"></i> '+(id?'Save':'Create group');btn.disabled=false;}
}

  const arr=await sb(`savings_groups?id=eq.${id}&select=*`);

  openModal(`
  <h3>Edit group</h3>
  <div class="field"><label>Group name</label><input id="cg-name" value="${g.name}"></div>
  <div class="field"><label>Description</label><input id="cg-desc" value="${g.description||''}"></div>
  <div class="field"><label>Maximum members</label><input id="cg-max" type="number" value="${g.max_members}"></div>
  <div class="field"><label>Group savings goal</label><input id="cg-goal" type="number" value="${g.savings_goal||''}"></div>
  <div class="error" id="cg-err"></div>
  <div class="modal-footer">
    <button class="btn" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" id="cg-btn" onclick="saveGroup('${id}')"><i class="ti ti-device-floppy"></i> Save changes</button>
  </div>`);
}

function openAddGroupMember(groupId){
  openModal(`
  <h3>Add group member</h3>
  <p style="font-size:13px;color:#666;margin-top:-6px">Member must be a registered Fundova contributor.</p>
  <div class="field"><label>Member email</label><input id="gm-email" type="email" placeholder="member@email.com"></div>
  <div class="field"><label>Contribution amount (₦)</label><input id="gm-amount" type="number" placeholder="e.g. 10000"></div>
  <div class="field"><label>Payout order number</label><input id="gm-order" type="number" placeholder="e.g. 1 for first payout"></div>
  <div class="error" id="gm-err"></div>
  <div class="modal-footer">
    <button class="btn" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" id="gm-btn" onclick="addGroupMember('${groupId}')"><i class="ti ti-user-plus"></i> Add member</button>
  </div>`);

async function addGroupMember(groupId){
  const email=document.getElementById('gm-email').value.trim().toLowerCase();
  const contribution_amount=parseFloat(document.getElementById('gm-amount').value);
  const payout_order=parseInt(document.getElementById('gm-order').value)||null;
  const err=document.getElementById('gm-err');
  const btn=document.getElementById('gm-btn');
  if(!email||!contribution_amount){err.textContent='Email and contribution amount are required.';return;}
  btn.innerHTML='<span class="spinner"></span> Adding…';btn.disabled=true;
  try{
    const [groupArr,activeMembers]=await Promise.all([
      sb(`savings_groups?id=eq.${groupId}&select=max_members`),
      sb(`group_members?group_id=eq.${groupId}&status=eq.active&select=id`)
    ]);
    const maxMembers=groupArr&&groupArr.length?groupArr[0].max_members:null;
    if(maxMembers&&activeMembers&&activeMembers.length>=maxMembers){
      err.textContent=`This group is full (${activeMembers.length}/${maxMembers}). Edit the group to raise the member cap first.`;
      btn.innerHTML='<i class="ti ti-user-plus"></i> Add member';btn.disabled=false;return;
    }
    const users=await sb(`users?email=eq.${email}&role=eq.contributor&select=id`);
    if(!users||!users.length){err.textContent='No contributor found with that email.';btn.innerHTML='<i class="ti ti-user-plus"></i> Add member';btn.disabled=false;return;}
    await sb('group_members',{method:'POST',body:JSON.stringify({group_id:groupId,user_id:users[0].id,contribution_amount,payout_order,status:'active'})});
    closeModal();
    toast('<i class="ti ti-check"></i> Member added to group!');
    if(window.location.pathname==='/ajo')await renderAjoPage();else await renderContributor();
  }catch(e){err.textContent='Error adding member.';btn.innerHTML='<i class="ti ti-user-plus"></i> Add member';btn.disabled=false;}
}

async function removeGroupMember(memberId,groupId){
  if(!confirm('Remove this member from the group? Their contribution and payout history will be kept for records, but they will no longer be part of future cycles.'))return;
  try{
    await sb(`group_members?id=eq.${memberId}`,{method:'PATCH',body:JSON.stringify({status:'removed'})});
    toast('<i class="ti ti-check"></i> Member removed from group.');
    if(window.location.pathname==='/ajo')await renderAjoPage();else await renderContributor();
  }catch(e){alert('Error removing member: '+e.message);}
}

async function resetGroupCycle(groupId){
  if(!confirm('Reset this group for a new cycle? All contribution and payout history for this group will be cleared and the cycle count will restart at 1. Members stay in the group. This cannot be undone.'))return;
  try{
    await sb(`group_contributions?group_id=eq.${groupId}`,{method:'DELETE'});
    await sb(`group_payouts?group_id=eq.${groupId}`,{method:'DELETE'});
    toast('<i class="ti ti-check"></i> Group reset — ready for a new cycle.');
    if(window.location.pathname==='/ajo')await renderAjoPage();else await renderContributor();
  }catch(e){alert('Error resetting group: '+e.message);}
}

async function closeAjoGroup(groupId){
  if(!confirm('Close this group? It will be hidden from active views but its history will be preserved. This cannot be undone from here.'))return;
  try{
    await sb(`savings_groups?id=eq.${groupId}`,{method:'PATCH',body:JSON.stringify({status:'closed'})});
    toast('<i class="ti ti-check"></i> Group closed.');
    if(window.location.pathname==='/ajo')await renderAjoPage();else await renderContributor();
  }catch(e){alert('Error closing group: '+e.message);}
}

async function sendBroadcastEmail(){
  const subject=document.getElementById('be-subject').value.trim();
  const body=document.getElementById('be-body').value.trim();
  const image_url=document.getElementById('be-image')?.dataset?.url||null;
  const err=document.getElementById('be-err');
  const btn=document.getElementById('be-btn');

  if(!subject){err.textContent='Please enter a subject.';return;}
  if(!body){err.textContent='Please write a message.';return;}

  if(!confirm('Are you sure you want to send this email to all contributors? This cannot be undone.')){return;}

  btn.innerHTML='<span class="spinner"></span> Sending…';btn.disabled=true;

  try{
    const users=await sb('users?role=eq.contributor&select=id,name,email');
    if(!users||!users.length){err.textContent='No contributors found.';btn.innerHTML='<i class="ti ti-send"></i> Send to all contributors';btn.disabled=false;return;}

    let sent=0;let failed=0;
    for(const u of users){
      try{
        await fetch('/.netlify/functions/send-email',{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({type:'broadcast',to:u.email,name:u.name,subject,body,image_url})
        });
        sent++;
      }catch(e){failed++;}
      // Update progress
      btn.innerHTML=`<span class="spinner"></span> Sending… ${sent+failed}/${users.length}`;
    }

    closeModal();
    toast(`<i class="ti ti-check"></i> Sent to ${sent} contributor${sent!==1?'s':''}${failed>0?' ('+failed+' failed)':''}.`);
  }catch(e){
    err.textContent='Error: '+e.message;
    btn.innerHTML='<i class="ti ti-send"></i> Send to all contributors';
    btn.disabled=false;
  }
}

// Logs a background/silent failure somewhere admin can actually review it, instead of it
// vanishing with only a console.error that nobody will ever see. Used for operations that
// run automatically (referral bonuses, notifications, etc.) where failures were previously
// invisible unless someone happened to have DevTools open at the exact right moment.
async function logSystemError(context, error){
  try{
    await sb('system_errors',{method:'POST',body:JSON.stringify({
      context,
      message: (error&&error.message)||String(error),
      user_id: currentUser?currentUser.id:null,
      created_at: new Date().toISOString()
    })});
  }catch(e){ console.error('Failed to log system error:',context,error); }
}

  <div class="error" id="sd-err"></div>
  <div class="modal-footer">
    <button class="btn" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" id="sd-btn" onclick="processSurplusDistribution()"><i class="ti ti-gift"></i> Distribute surplus</button>
  </div>`);
  // Load contributor count and total savings
  previewSurplus();
