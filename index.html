<script>
const SB_URL='https://btcpkjlyifwvsybscpxz.supabase.co'; // kept for storage uploads only
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ0Y3Bramx5aWZ3dnN5YnNjcHh6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQxNTA1NTUsImV4cCI6MjA5OTcyNjU1NX0.tDcHjN69-rvp0LTItWRbmfW8OO6Y8-abQYYyqOzcAdg'; // legacy anon/public JWT key — required for direct Supabase Storage uploads (the newer sb_publishable_ format isn't accepted here)
const SITE_URL='https://www.fundova.africa';
const RATE=0.10;
const WEEKDAYS_PER_YEAR=261;
let currentUser=null;
let adminTab='contributors';
let signupStep=1;

// Session persistence. The server sets the length: 72 hours for members, 24 hours for admins.
function saveSession(user,token,exp){
  try{localStorage.setItem('fundova_session',JSON.stringify({user,token,expiry:exp*1000}));}catch(e){}
}
function loadSession(){
  try{
    const raw=localStorage.getItem('fundova_session');
    if(!raw)return null;
    const session=JSON.parse(raw);
    if(!session.token||Date.now()>session.expiry){localStorage.removeItem('fundova_session');return null;}
    return session.user;
  }catch(e){return null;}
}
function getToken(){
  try{const s=JSON.parse(localStorage.getItem('fundova_session')||'null');return s&&s.token&&Date.now()<=s.expiry?s.token:null;}catch(e){return null;}
}
function authHeaders(){const h={'Content-Type':'application/json'};const t=getToken();if(t)h['Authorization']='Bearer '+t;return h;}
function clearSession(){
  try{localStorage.removeItem('fundova_session');}catch(e){}
}
// Called when the server says the sign-in has ended (expired, or the account was revoked/closed)
function sessionExpired(){
  if(!currentUser)return;
  currentUser=null;clearSession();signupStep=1;
  try{render();}catch(e){}
  setTimeout(()=>{try{toast('Your session has ended. Please sign in again.','#A32D2D');openLoginModal();}catch(e){}},80);
}

async function sb(path, opts={}, _retryCount=0){
  const method = opts.method||'GET';
  const isReadOnly = method==='GET';
  const hadToken = !!getToken();
  const controller=new AbortController();
  const timeout=setTimeout(()=>controller.abort(),20000); // 20s — was 10s, too aggressive on slow connections
  try{
    const res=await fetch('/.netlify/functions/db',{
      method:'POST',
      signal:controller.signal,
      headers:authHeaders(),
      body:JSON.stringify({
        path,
        method,
        body:opts.body?JSON.parse(opts.body):null
      })
    });
    clearTimeout(timeout);
    if(res.status===401&&hadToken){sessionExpired();throw new Error('Session expired');}
    if(!res.ok){const e=await res.text();throw new Error(e);}
    const result=await res.json();
    if(result.status>=400)throw new Error(JSON.stringify(result.data));
    return result.data;
  }catch(e){
    clearTimeout(timeout);
    const isNetworkFailure = e.name==='AbortError' || e.name==='TypeError';
    // Only auto-retry read-only requests on genuine network/timeout failures — retrying a
    // write (POST/PATCH/DELETE) blindly risks duplicating something that actually went through
    // (e.g. recording a payment twice) even though the response never came back in time.
    if(isReadOnly && isNetworkFailure && _retryCount<2){
      await new Promise(r=>setTimeout(r,800*(_retryCount+1)));
      return sb(path,opts,_retryCount+1);
    }
    if(e.name==='AbortError')throw new Error('Request timed out. Please check your internet connection and try again — if this was meant to save something, please verify it went through before retrying.');
    throw e;
  }
}

async function sendEmail(payload){
  try{
    await fetch('/.netlify/functions/send-email',{
      method:'POST',
      headers:authHeaders(),
      body:JSON.stringify(payload)
    });
  }catch(e){console.error('Email error:',e);}
}

function countWeekdays(startDate,endDate){
  let count=0;const d=new Date(startDate);const end=new Date(endDate);
  d.setHours(0,0,0,0);end.setHours(0,0,0,0);
  while(d<end){const day=d.getDay();if(day!==0&&day!==6)count++;d.setDate(d.getDate()+1);}
  return count;
}
// Interest earned "today": 0 on weekends; payments made today haven't started accruing yet.
function interestForToday(pays){
  const now=new Date();
  const dow=now.getDay();
  if(dow===0||dow===6)return 0;
  const todayStr=now.toDateString();
  return (pays||[]).filter(p=>!p.is_interest&&new Date(p.date).toDateString()!==todayStr).reduce((a,p)=>a+Number(p.amount)*RATE/WEEKDAYS_PER_YEAR,0);
}
// ── Row-aware helpers: is_interest rows hold already-earned interest carried forward and
// earn nothing themselves, so interest is never earned on interest. ──
function rowInterest(p,end){ return p.is_interest?0:calcAccruedInterest(Number(p.amount),p.date,end==null?null:end); }
function rowIntTotal(p,end){ return p.is_interest?Number(p.amount):rowInterest(p,end); }
function rowPrincipal(p){ return p.is_interest?0:Number(p.amount); }
function rowValue(p,end){ return Number(p.amount)+rowInterest(p,end); }
function lotParts(p,end){ return p.is_interest?{P:0,I:Number(p.amount)}:{P:Number(p.amount),I:rowInterest(p,end)}; }
// Take `take` out of a lot, interest first, then principal.
function splitLot(parts,take){
  const iT=Math.min(take,parts.I), pT=Math.max(0,take-iT);
  return {takeI:+iT.toFixed(2),takeP:+pT.toFixed(2),leftI:+Math.max(0,parts.I-iT).toFixed(2),leftP:+Math.max(0,parts.P-pT).toFixed(2)};
}
// Carry a remainder forward as a principal row + a separate non-earning interest row, dated today.
async function postCarryRows(userId,principal,interest,goalId,label){
  const today=new Date().toISOString().split('T')[0];
  if(principal>0.004)await sb('payments',{method:'POST',body:JSON.stringify({user_id:userId,amount:+principal.toFixed(2),date:today,withdrawn:false,goal_id:goalId||null,is_transfer:true,purpose:label})});
  if(interest>0.004)await sb('payments',{method:'POST',body:JSON.stringify({user_id:userId,amount:+interest.toFixed(2),date:today,withdrawn:false,goal_id:goalId||null,is_transfer:true,is_interest:true,purpose:'Interest earned (carried forward)'})});
}
// CAPITAL FIRST: take `amount` out of the member's active unallocated lots (already fetched, oldest first).
// Capital is used first, oldest lot first. Accrued interest is never touched until capital is used up.
// A lot that is used (fully or partly) is retired; its leftover capital is carried forward as a new row and
// its accrued interest is carried forward as a separate non-earning interest row, so there is no
// interest on interest. Lots that are not touched keep accruing as normal.
async function deductCapitalFirst(userId,payments,amount,carryLabel){
  const today=new Date().toISOString().split('T')[0];
  const retire=id=>sb(`payments?id=eq.${id}`,{method:'PATCH',body:JSON.stringify({withdrawn:true,withdrawn_at:today})});
  const lots=(payments||[]).map(p=>({p,parts:lotParts(p,null)}));
  const totalP=+lots.reduce((a,l)=>a+l.parts.P,0).toFixed(2);
  let remaining=+Number(amount).toFixed(2);
  if(remaining<=totalP+0.005){
    // Capital covers it: only capital is withdrawn, all accrued interest stays
    for(const l of lots){
      if(remaining<=0.004)break;
      if(l.p.is_interest)continue;
      const take=Math.min(remaining,l.parts.P);
      await retire(l.p.id);
      await postCarryRows(userId,+(l.parts.P-take).toFixed(2),l.parts.I,null,carryLabel);
      remaining=+(remaining-take).toFixed(2);
    }
    return;
  }
  // Capital is used up: every capital lot is retired, then the rest comes out of accrued interest, oldest first
  let need=+(remaining-totalP).toFixed(2);
  for(const l of lots){
    if(l.p.is_interest){
      if(need<=0.004)continue;
      const have=l.parts.I, take=Math.min(have,need);
      await retire(l.p.id);
      if(have-take>0.004)await postCarryRows(userId,0,+(have-take).toFixed(2),null,carryLabel);
      need=+(need-take).toFixed(2);
    } else {
      const have=l.parts.I, take=Math.min(have,Math.max(need,0));
      await retire(l.p.id);
      if(have-take>0.004)await postCarryRows(userId,0,+(have-take).toFixed(2),null,carryLabel);
      need=+(need-take).toFixed(2);
    }
  }
}
// ── FOOD SCHEME HELPERS ─────────────────────────────────
function isFoodRow(p){return !!(p&&p.is_transfer&&/^Food Scheme deduction/i.test(p.purpose||''));}
// DISPLAY ONLY. Earlier food deductions were stored as one negative row. For screens that list the active
// (earning) payments, show that deduction against the oldest payments instead, so no negative row is listed.
// The interest on the payments that were used is shown as one non-earning line. Totals are unchanged by
// construction: that line is whatever is needed to make the interest total equal the stored figures.
// If it cannot be netted cleanly the rows are returned exactly as stored.
function netFoodRows(pays){
  const rows=(pays||[]).map(p=>({...p}));
  const negs=rows.filter(p=>isFoodRow(p)&&Number(p.amount)<0).sort((a,b)=>new Date(a.date)-new Date(b.date));
  if(!negs.length)return {rows,netted:false};
  try{
    const trueInt=rows.reduce((a,p)=>a+rowIntTotal(p),0);
    const lots=rows.filter(p=>!(isFoodRow(p)&&Number(p.amount)<0)).map(p=>({...p,_rem:Number(p.amount),_used:0}));
    const cand=lots.filter(p=>!p.is_interest&&Number(p.amount)>0).sort((a,b)=>new Date(a.date)-new Date(b.date));
    let short=0,est=0;
    for(const n of negs){
      let need=Math.abs(Number(n.amount));
      for(const l of cand){
        if(need<=0.004)break;
        if(new Date(l.date)>new Date(n.date))continue; // only payments that existed at the time
        const t=Math.min(l._rem,need);
        if(t<=0)continue;
        l._rem=+(l._rem-t).toFixed(2);l._used=+(l._used+t).toFixed(2);need=+(need-t).toFixed(2);
        est+=t*RATE/WEEKDAYS_PER_YEAR*countWeekdays(new Date(l.date),new Date(n.date));
      }
      if(need>0.004)short+=need;
    }
    if(short>0.004)return {rows,netted:false};
    const out=[];
    for(const l of lots){
      if(l.is_interest){out.push(l);continue;}
      if(l._rem<=0.004)continue;
      const {_rem,_used,...rest}=l;
      out.push({...rest,amount:_rem,_locked:_used>0.004});
    }
    const keepInt=out.reduce((a,p)=>a+rowIntTotal(p),0);
    const frozen=+(trueInt-keepInt).toFixed(2);
    if(Math.abs(frozen-est)>1)return {rows,netted:false}; // does not reconcile: show as stored rather than risk a wrong figure
    if(frozen>0.004)out.push({id:'food-int',user_id:negs[0].user_id,amount:frozen,date:negs[negs.length-1].date,is_interest:true,is_transfer:true,purpose:'Interest earned on amounts applied to Food Scheme',_virtual:true});
    out.sort((a,b)=>new Date(a.date)-new Date(b.date));
    return {rows:out,netted:true};
  }catch(e){return {rows,netted:false};}
}

// Interest accrued per calendar month across all contributors (same weekday rule as calcAccruedInterest).
function monthlyInterestSummary(rows,months){
  const perDay=RATE/WEEKDAYS_PER_YEAR;
  const now=new Date();now.setHours(0,0,0,0);
  const lots=(rows||[]).filter(p=>!p.is_interest).map(p=>{
    const st=new Date(p.date);st.setHours(0,0,0,0);
    const en=p.withdrawn_at?new Date(p.withdrawn_at):p.moved_at?new Date(p.moved_at):new Date(now);
    en.setHours(0,0,0,0);
    return {u:p.user_id,a:Number(p.amount),st,en};
  }).filter(l=>l.en>l.st);
  const out=[];let lifetime=0;
  for(const l of lots)lifetime+=l.a*perDay*countWeekdays(l.st,l.en);
  for(let i=months-1;i>=0;i--){
    const ms=new Date(now.getFullYear(),now.getMonth()-i,1), me=new Date(now.getFullYear(),now.getMonth()-i+1,1);
    let sum=0;const users=new Set();
    for(const l of lots){
      const s=l.st>ms?l.st:ms, e=l.en<me?l.en:me;
      if(e>s){const d=countWeekdays(s,e);if(d>0){sum+=l.a*perDay*d;users.add(l.u);}}
    }
    out.push({month:ms,interest:+sum.toFixed(2),earners:users.size,current:i===0});
  }
  return {rows:out,lifetime:+lifetime.toFixed(2)};
}
function calcAccruedInterest(amount,payDate,withdrawnAt){
  const today=new Date();today.setHours(0,0,0,0);
  const start=new Date(payDate);start.setHours(0,0,0,0);
  if(start>=today)return 0;
  // If withdrawn, interest only accrued up to the withdrawal date
  const end=withdrawnAt?new Date(withdrawnAt):today;
  end.setHours(0,0,0,0);
  if(start>=end)return 0;
  return+(Number(amount)*RATE*(countWeekdays(start,end)/WEEKDAYS_PER_YEAR)).toFixed(2);
}

const _revealed={};

function maskedField(label,key,userId,val){

async function revealSensitive(key,userId,label,spanId,btn){
  const el=document.getElementById(spanId);if(!el)return;

async function render(){
  // Route handling
  if(window.location.pathname==='/webinar'){renderWebinar();return;}
  if(window.location.pathname==='/terms'){renderTermsPage();return;}
  if(window.location.pathname==='/privacy'){renderPrivacyPage();return;}
  if(window.location.pathname==='/faq'){renderFaqPage();return;}
  if(window.location.pathname==='/learn'){renderLearnPage();return;}
  if(!currentUser){renderLogin();return;}
  if(window.location.pathname==='/cooperative'){try{history.replaceState(null,'','/'+window.location.search);}catch(e){}}
  if(window.location.pathname==='/ajo'){
    if(currentUser.role==='admin'||currentUser.role==='admin_view'){window.location.href='/';return;}
    if(currentUser.role==='pending'){renderPendingScreen();return;}
    await renderAjoPage();return;
  }
  if(currentUser.role==='admin'||currentUser.role==='admin_view')await renderAdmin();
  else if(currentUser.role==='pending')renderPendingScreen();
  else await renderContributor();
}

function renderLogin(){
  // Check route
  if(window.location.pathname==='/webinar'){renderWebinar();return;}
  if(window.location.pathname==='/learn'){renderLearnPage();return;}
  if(window.location.pathname==='/terms'){renderTermsPage();return;}
  if(window.location.pathname==='/privacy'){renderPrivacyPage();return;}
  if(window.location.pathname==='/faq'){renderFaqPage();return;}

  const refCode=(typeof getRefFromUrl==='function')?getRefFromUrl():'';
  const IS_COOP=window.location.pathname==='/cooperative';
  // Referral links (fundova.africa/?ref=CODE) go straight to the cooperative page
  if(refCode&&!IS_COOP){window.location.replace('/cooperative'+window.location.search);return;}
  try{document.title=IS_COOP?'Fundova Cooperative — Save, grow and belong':document.title;}catch(e){}
  const NAV_LINKS=IS_COOP
    ?[['About','cooperative'],['How it works','how'],['Learn','learn'],['FAQ','faq'],['Fundova Limited','/']]
    :[['Home','top'],['About','company'],['Our Products','products'],['Cooperative','/cooperative']];

let _loginEmail='';
let _resendTimer=null;
async function postAuth(fn,payload){
  const res=await fetch('/.netlify/functions/'+fn,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  let j={};try{j=await res.json();}catch(e){}
  return {ok:res.ok,status:res.status,data:j};
}
// Step 1: ask for a code
async function doLogin(){
  const email=document.getElementById('l-email').value.trim().toLowerCase();
  const err=document.getElementById('l-err');
  const btn=document.getElementById('l-btn');
  if(!email||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){err.textContent='Please enter a valid email address.';return;}
  err.textContent='';
  btn.innerHTML='<span class="spinner"></span> Sending code…';btn.disabled=true;
  try{
    const r=await postAuth('auth-request',{email});
    if(!r.ok){err.textContent=(r.data&&r.data.error)||'Could not send the code. Please try again.';btn.innerHTML='<i class="ti ti-mail"></i> Email me a code';btn.disabled=false;return;}
    _loginEmail=email;
    try{localStorage.setItem('fundova_saved_email',email);}catch(e){}
    openCodeStep();
  }catch(e){err.textContent='Connection error. Please try again.';btn.innerHTML='<i class="ti ti-mail"></i> Email me a code';btn.disabled=false;}
}
function openCodeStep(){
  openModal(`
    <div style="text-align:center;margin-bottom:1.2rem">

    </div>
    <div class="field" style="margin-bottom:14px"><input id="l-code" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="••••••" autocomplete="one-time-code" style="font-size:26px;letter-spacing:8px;text-align:center;border:1.5px solid #e5e5e2"></div>
    <div class="error" id="l-err" style="margin-bottom:10px"></div>
    <button id="l-vbtn" onclick="verifyLoginCode()" style="width:100%;background:#0D3D2A;color:#fff;border:none;padding:13px;border-radius:10px;font-weight:700;font-size:15px;cursor:pointer"><i class="ti ti-login"></i> Sign in</button>
    <div style="text-align:center;margin-top:12px;font-size:12px;color:#888">
      <button id="l-resend" onclick="resendLoginCode()" disabled style="background:none;border:none;color:#1D9E75;cursor:pointer;font-size:12px;text-decoration:underline">Send a new code</button>
      &nbsp;·&nbsp;
      <button onclick="openLoginModal()" style="background:none;border:none;color:#1D9E75;cursor:pointer;font-size:12px;text-decoration:underline">Use a different email</button>
    </div>`);
  setTimeout(()=>{const el=document.getElementById('l-code');if(el){el.focus();el.addEventListener('keydown',e=>{if(e.key==='Enter')verifyLoginCode();});el.addEventListener('input',()=>{el.value=el.value.replace(/\D/g,'').slice(0,6);if(el.value.length===6)verifyLoginCode();});}},50);
  startResendCountdown(60);
}
function startResendCountdown(sec){
  if(_resendTimer)clearInterval(_resendTimer);
  let left=sec;
  const tick=()=>{
    const b=document.getElementById('l-resend');
    if(!b){clearInterval(_resendTimer);return;}
    if(left>0){b.disabled=true;b.style.opacity='.5';b.textContent='Send a new code in '+left+'s';left--;}
    else{b.disabled=false;b.style.opacity='1';b.textContent='Send a new code';clearInterval(_resendTimer);}
  };
  tick();_resendTimer=setInterval(tick,1000);
}
async function resendLoginCode(){
  const err=document.getElementById('l-err');
  try{
    const r=await postAuth('auth-request',{email:_loginEmail});
    if(!r.ok){err.textContent=(r.data&&r.data.error)||'Could not send the code.';return;}
    err.textContent='';toast('<i class="ti ti-mail"></i> A new code has been sent.');startResendCountdown(60);
  }catch(e){err.textContent='Connection error. Please try again.';}
}
// Step 2: check the code
async function verifyLoginCode(){
  const el=document.getElementById('l-code');if(!el)return;
  const code=el.value.trim();
  const err=document.getElementById('l-err');
  const btn=document.getElementById('l-vbtn');
  if(btn.disabled)return;
  if(!/^\d{6}$/.test(code)){err.textContent='Please enter the 6-digit code from your email.';return;}
  err.textContent='';
  btn.innerHTML='<span class="spinner"></span> Signing in…';btn.disabled=true;
  try{
    const r=await postAuth('auth-verify',{email:_loginEmail,code});
    if(!r.ok||!r.data||!r.data.token){err.textContent=(r.data&&r.data.error)||'That code is not valid. Please try again.';btn.innerHTML='<i class="ti ti-login"></i> Sign in';btn.disabled=false;return;}
    currentUser=r.data.user;saveSession(currentUser,r.data.token,r.data.exp);
    if(_resendTimer)clearInterval(_resendTimer);
    closeModal();await render();
  }catch(e){err.textContent='Connection error. Please try again.';btn.innerHTML='<i class="ti ti-login"></i> Sign in';btn.disabled=false;}
}

function checkNameMatch(){
  const accountName=(document.getElementById('s-aname').value||'').trim().toLowerCase();
  const registeredName=(window._sName||'').trim().toLowerCase();
  const mismatch=document.getElementById('s-mismatch');
  const consentRow=document.getElementById('s-consent-row');
  const anameVal=document.getElementById('s-aname-val');
  if(accountName.length>2&&registeredName.length>2){
    const aParts=accountName.split(' ');
    const rParts=registeredName.split(' ');
    const overlap=aParts.filter(p=>p.length>1&&rParts.some(r=>r.includes(p)||p.includes(r)));
    if(overlap.length===0){
      anameVal.textContent=document.getElementById('s-aname').value.trim();
      mismatch.style.display='flex';
      consentRow.style.display='flex';
      document.getElementById('s-aname').classList.add('warn');
    } else {
      mismatch.style.display='none';
      consentRow.style.display='none';
      document.getElementById('s-aname').classList.remove('warn');
    }
  }
}

            </div>

          <div style="background:#F0FDF8;border-radius:10px;padding:10px"><div style="font-size:10px;color:#0F6E56">This month's inflow</div><div style="font-size:15px;font-weight:700;color:#0F6E56">${fmt(ajoMonthInflow)}</div></div>
          <div style="background:#FDEDED;border-radius:10px;padding:10px"><div style="font-size:10px;color:#A32D2D">Payouts (Lifetime)</div><div style="font-size:15px;font-weight:700;color:#A32D2D">${fmt(ajoLifetimePayout)}</div></div>
          <div style="background:#FDF2F2;border-radius:10px;padding:10px"><div style="font-size:10px;color:#A32D2D">This month's payouts</div><div style="font-size:15px;font-weight:700;color:#A32D2D">${fmt(ajoMonthPayout)}</div></div>
          <div style="background:#FEF3C7;border-radius:10px;padding:10px"><div style="font-size:10px;color:#856404">Currently held</div><div style="font-size:15px;font-weight:700;color:#856404">${fmt(ajoHeld)}</div></div>
        </div>
        <div style="margin-top:12px;padding-top:10px;border-top:1px solid #f0f0ee">
          <a onclick="setAdminTab('coordinators');renderAdmin();" style="font-size:12px;color:#0F6E56;cursor:pointer;font-weight:500">View Ajo groups →</a>
        </div>`;
      pageContent.appendChild(ajoCard);
    }

    // ── UPCOMING BIRTHDAYS ──
    const bdayNow = new Date(); bdayNow.setHours(0,0,0,0);
    const upcomingBirthdays = (contributors||[]).map(c=>{
      const k = (kycAll||[]).find(x=>x.user_id===c.id);
      if(!k || !k.date_of_birth) return null;
      const dob = new Date(k.date_of_birth);
      let next = new Date(bdayNow.getFullYear(), dob.getMonth(), dob.getDate());
      if(next < bdayNow) next = new Date(bdayNow.getFullYear()+1, dob.getMonth(), dob.getDate());
      const daysAway = Math.round((next-bdayNow)/(1000*60*60*24));
      return {c, daysAway};
    }).filter(e=>e && e.daysAway<=14).sort((a,b)=>a.daysAway-b.daysAway);
    const todayBirthdays = upcomingBirthdays.filter(e=>e.daysAway===0);
    if(upcomingBirthdays.length){
      const bdayRow = document.createElement('div');
      bdayRow.style.cssText = 'background:linear-gradient(135deg,#C9961A,#0D3D2A);border-radius:16px;padding:1.25rem;margin-bottom:1.5rem;color:#fff';
      bdayRow.innerHTML = `
        <div style="font-size:14px;font-weight:700;margin-bottom:12px">${todayBirthdays.length?`🎉 ${todayBirthdays.length} birthday${todayBirthdays.length!==1?'s':''} today!`:'🎂 Upcoming birthdays'}</div>
        <div id="bday-list" style="display:flex;flex-direction:column;gap:8px"></div>`;
      pageContent.appendChild(bdayRow);
      const bdayList = bdayRow.querySelector('#bday-list');
      upcomingBirthdays.forEach(({c,daysAway})=>{
        const row = document.createElement('div');
        row.style.cssText = 'background:rgba(255,255,255,.12);border-radius:10px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px';
        const whenLabel = daysAway===0?'Today':daysAway===1?'Tomorrow':`In ${daysAway} days`;
        row.innerHTML = `<div><div style="font-size:13px;font-weight:600">${c.name}</div><div style="font-size:11px;color:rgba(255,255,255,.7)">${whenLabel}</div></div>`;
        if(daysAway===0){
          const btn = document.createElement('button');
          btn.className = 'btn btn-sm';
          btn.style.cssText = 'background:#fff;color:#0D3D2A;flex-shrink:0';
          btn.innerHTML = '<i class="ti ti-cake"></i> Send birthday wish';

    // Operations cards (built via DOM to avoid quote issues)

    ].forEach(op => {
      const card = document.createElement('div');

      card.innerHTML = `<i class="ti ${op.icon}" style="color:${op.color};font-size:18px;display:block;margin-bottom:4px"></i><div style="font-size:18px;font-weight:700;color:${op.color}">${op.val}</div><div style="font-size:10px;color:${op.color};opacity:.8">${op.label}</div>`;

    // ── CHART + ACTIVITY ──
    const chartRow = document.createElement('div');
    chartRow.style.cssText = 'display:grid;grid-template-columns:1fr 340px;gap:1.25rem;margin-bottom:1.5rem';
    chartRow.innerHTML = `
      <div style="background:#fff;border-radius:16px;padding:1.25rem;border:1px solid #e5e5e2">
        <div style="font-size:14px;font-weight:600;color:#0D1F14;margin-bottom:4px">Total value over time</div>
        <div style="font-size:24px;font-weight:800;color:#0D1F14;margin-bottom:2px">${fmt(totalValue)}</div>
        <div style="font-size:12px;color:#1D9E75;margin-bottom:16px"><i class="ti ti-trending-up"></i> Growing every weekday</div>

      </div>
      <div style="background:#0D3D2A;border-radius:16px;padding:1.25rem">

        <div id="activity-list"></div>
        <div style="margin-top:12px"><a onclick="setAdminTab('analytics');renderAdmin();" style="font-size:12px;color:#C9961A;cursor:pointer;font-weight:500">View full report →</a></div>

    // Activity items via DOM

      {icon:'ti-trending-up',label:'Interest credited',val:fmt(todayInterest),color:'#C9961A'},
      {icon:'ti-user-plus',label:'New applications',val:todayApps,color:'#60A5FA'},
      {icon:'ti-user-edit',label:'Profile requests',val:todayProfileCount,color:'#3730A3'},

      row.style.cssText = 'display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.08)';
      row.innerHTML = `<div style="display:flex;align-items:center;gap:8px"><div style="width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center"><i class="ti ${a.icon}" style="color:${a.color};font-size:14px"></i></div><span style="font-size:13px;color:rgba(255,255,255,.75)">${a.label}</span></div><span style="font-size:13px;font-weight:600;color:${a.color}">${a.val}</span>`;
      actList.appendChild(row);
    });

    // ── CONTRIBUTORS TABLE ──
    const contribSection = document.createElement('div');
    contribSection.style.cssText = 'background:#fff;border-radius:16px;padding:1.25rem;border:1px solid #e5e5e2;margin-bottom:1.5rem';

      const cP = payments.filter(p=>p.user_id===c.id);
      const prin = cP.reduce((a,p)=>a+rowPrincipal(p),0);
      const int = cP.reduce((a,p)=>a+rowIntTotal(p),0);
      const tot = prin+int;
      const lastP = [...cP].sort((a,b)=>new Date(b.date)-new Date(a.date))[0];
      const gp = c.savings_goal ? Math.min(100,Math.round((tot/c.savings_goal)*100)) : null;

      const gpHTML = gp!==null ? `<div style="display:flex;align-items:center;gap:6px"><div style="flex:1;background:#e5e5e2;border-radius:3px;height:5px;overflow:hidden"><div style="width:${gp}%;height:100%;background:${gp>=100?'#1D9E75':'#C9961A'}"></div></div><span style="font-size:11px;color:#888">${gp}%</span></div>` : '<span style="color:#ccc;font-size:12px">—</span>';
      const editBtn = !isViewOnly() ? `<button class="btn btn-sm btn-edit" data-uid="${c.id}" data-uname="${c.name}" data-email="${c.email}" onclick="openEditCredentials(this.dataset.uid,this.dataset.uname,this.dataset.email)"><i class="ti ti-pencil"></i></button>` : '';
      return `<tr>
        <td><div style="display:flex;align-items:center;gap:8px"><div style="width:32px;height:32px;border-radius:50%;background:#0D3D2A;color:#C9961A;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0">${ini}</div><div><div style="font-size:13px;font-weight:500;color:#0D1F14">${c.name}</div><div style="font-size:11px;color:#aaa">${c.email}</div></div></div></td>
        <td><span class="status-pill ${cP.length?'pill-approved':'pill-pending'}">${cP.length?'Active':'No payments'}</span></td>
        <td>${kycBadgeHTML(kycMap[c.id])}</td>
        <td>${gpHTML}</td>
        <td style="font-weight:600;color:#0D1F14">${fmt(tot)}</td>
        <td style="font-size:12px;color:#888">${lastP?fmtDate(lastP.date):'Never'}</td>
        <td><div style="display:flex;gap:4px">
          <button class="btn btn-sm" title="View KYC" data-uid="${c.id}" data-uname="${c.name}" onclick="openContributorKyc(this.dataset.uid,this.dataset.uname)" style="background:#185FA5;color:#fff"><i class="ti ti-eye"></i></button>
          <button class="btn btn-sm" title="${kycMap[c.id]==='verified'?'Already verified — no reminder needed':'Send KYC reminder'}" data-uid="${c.id}" data-uname="${c.name}" ${kycMap[c.id]==='verified'?'disabled':`onclick="sendKycNudge(this.dataset.uid,this.dataset.uname)"`} style="background:${kycMap[c.id]==='verified'?'#e5e5e2':'#856404'};color:${kycMap[c.id]==='verified'?'#aaa':'#fff'};cursor:${kycMap[c.id]==='verified'?'not-allowed':'pointer'}"><i class="ti ti-id"></i></button>

    contribSection.innerHTML = `

        <div style="font-size:15px;font-weight:600;color:#0D1F14">All contributors</div>
        <div style="display:flex;align-items:center;gap:8px">
          <div style="position:relative"><i class="ti ti-search" style="position:absolute;left:8px;top:50%;transform:translateY(-50%);color:#aaa;font-size:14px"></i><input id="contrib-search" type="text" placeholder="Search by name..." oninput="filterContributors()" style="padding:7px 10px 7px 28px;border:1px solid #e5e5e2;border-radius:8px;font-size:12px;width:220px"></div>
          <span style="font-size:12px;color:#888" id="contrib-count">${(contributors||[]).length} contributors</span>
          ${addBtn}
        </div>
      </div>
      <div class="table-wrap"><table id="contrib-table"><tr style="background:#f9f9f7"><th>Contributor</th><th>Status</th><th>KYC</th><th>Goal</th><th>Total</th><th>Last payment</th><th>Actions</th></tr>${contribRows}</table></div>
      <div style="margin-top:12px;text-align:center"><a onclick="setAdminTab('contributors');renderAdmin();" style="font-size:12px;color:#0F6E56;cursor:pointer;font-weight:500">View all contributors →</a></div>`;
    pageContent.appendChild(contribSection);

    // ── BOTTOM ROW ──
    const bottomRow = document.createElement('div');
    bottomRow.style.cssText = 'display:grid;grid-template-columns:1fr 1fr;gap:1.25rem';
    const recentAct = allPayments.slice(-5).reverse().map(p=>{
      const c=(contributors||[]).find(c=>c.id===p.user_id);
      return `<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f5f5f3"><div style="width:32px;height:32px;border-radius:50%;background:#E8F5EE;display:flex;align-items:center;justify-content:center;flex-shrink:0"><i class="ti ti-arrow-up" style="color:#0F6E56;font-size:14px"></i></div><div style="flex:1"><div style="font-size:13px;font-weight:500;color:#0D1F14">${c?c.name:'Unknown'} made a contribution</div><div style="font-size:11px;color:#aaa">${fmt(p.amount)} · ${fmtDate(p.date)}</div></div></div>`;
    }).join('');
    const recentWd = (requests||[]).slice(0,5).map(r=>{
      const c=(contributors||[]).find(c=>c.id===r.user_id);
      const pill=r.status==='approved'?'<span class="status-pill pill-approved">Approved</span>':r.status==='rejected'?'<span class="status-pill pill-rejected">Rejected</span>':'<span class="status-pill pill-pending">Pending</span>';
      const ini=c?c.name.split(' ').map(n=>n[0]).join('').substring(0,2).toUpperCase():'?';
      return `<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f5f5f3"><div style="width:32px;height:32px;border-radius:50%;background:#0D3D2A;color:#C9961A;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0">${ini}</div><div style="flex:1"><div style="font-size:13px;font-weight:500;color:#0D1F14">${c?c.name:'Unknown'}</div><div style="font-size:11px;color:#aaa">${fmt(r.amount)} · ${fmtDate(r.created_at)}</div></div>${pill}</div>`;
    }).join('');
    bottomRow.innerHTML = `
      <div style="background:#fff;border-radius:16px;padding:1.25rem;border:1px solid #e5e5e2">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem"><div style="font-size:15px;font-weight:600;color:#0D1F14">Recent activity</div><a onclick="setAdminTab('payments');renderAdmin();" style="font-size:12px;color:#0F6E56;cursor:pointer;font-weight:500">View all</a></div>
        ${recentAct||'<div class="empty">No payments yet</div>'}
      </div>
      <div style="background:#fff;border-radius:16px;padding:1.25rem;border:1px solid #e5e5e2">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem"><div style="font-size:15px;font-weight:600;color:#0D1F14">Recent withdrawals</div><a onclick="setAdminTab('requests');renderAdmin();" style="font-size:12px;color:#0F6E56;cursor:pointer;font-weight:500">View all</a></div>
        ${recentWd||'<div class="empty">No withdrawals yet</div>'}
      </div>`;
    pageContent.appendChild(bottomRow);

  } else {
    pageContent.innerHTML = tabContent;
  }

  main.appendChild(pageContent);

  // Footer
  const footer = document.createElement('div');
  footer.style.cssText = 'background:#fff;border-top:1px solid #e5e5e2;padding:12px 1.5rem;display:flex;align-items:center;justify-content:space-between';
  footer.innerHTML = `<div style="display:flex;align-items:center;gap:6px"><i class="ti ti-shield-check" style="color:#1D9E75;font-size:14px"></i><span style="font-size:11px;color:#888">Fundova is secure, transparent and trusted.</span></div><span style="font-size:11px;color:#aaa">© ${new Date().getFullYear()} Fundova Cooperative. Powered by Fundova Limited.</span>`;
  main.appendChild(footer);
  adminEl.appendChild(main);

  const app = document.getElementById('app');
  if(app){ app.innerHTML=''; app.appendChild(adminEl); }
  if(adminTab==='analytics'){
    setTimeout(()=>loadAnalyticsSections().catch(()=>{}), 300);
  }
  }catch(e){setHTML(`<div class="loading-full" style="color:#A32D2D">Failed to load: ${e.message}</div>`);
}}

function buildContributorsTab(contributors,payments,kycMap={}){
  if(!contributors.length)return`<div class="card"><div class="empty"><i class="ti ti-users" style="font-size:32px;display:block;margin-bottom:10px;color:#ccc"></i>No contributors yet.<br><br><button class="btn btn-primary" onclick="openAddContributor()"><i class="ti ti-plus"></i> Add first contributor</button></div></div>`;
  // Search bar
  const searchBar=`<div style="margin-bottom:1rem;display:flex;gap:8px;align-items:center">
    <div style="position:relative;flex:1;max-width:340px">
      <i class="ti ti-search" style="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#aaa;font-size:16px"></i>
      <input id="contrib-search" type="text" placeholder="Search by name..." oninput="filterContributors()" style="width:100%;padding:9px 12px 9px 34px;border:1.5px solid #e5e5e2;border-radius:8px;font-size:13px;box-sizing:border-box">
    </div>
    <span id="contrib-count" style="font-size:12px;color:#888">${contributors.length} contributors</span>
  </div>`;

  const rows=contributors.map(c=>{
    const pays=payments.filter(p=>p.user_id===c.id);
    const principal=pays.reduce((a,p)=>a+rowPrincipal(p),0);
    const interest=pays.reduce((a,p)=>a+rowIntTotal(p),0);
    return`<tr>
      <td><div style="display:flex;align-items:center;gap:9px"><div class="avatar">${initials(c.name)}</div><div><div style="font-weight:500">${c.name}</div><div style="font-size:11px;color:#888">${c.email}</div></div></div></td>
      <td>${kycBadgeHTML(kycMap[c.id])}</td>
      <td style="color:#888">${pays.length}</td>
      <td>${fmt(principal)}</td>
      <td class="green">${fmt(interest)}</td>
      <td><strong>${fmt(principal+interest)}</strong></td>
      <td><div style="display:flex;gap:5px;justify-content:flex-end">
        ${!isViewOnly()?`<button class="btn btn-sm" onclick="openAddPayment('${c.id}','${c.name.replace(/'/g,"\\'")}')"><i class="ti ti-plus"></i> Payment</button>`:''}
        <button class="btn btn-sm" onclick="openViewContributor('${c.id}','${c.name.replace(/'/g,"\\'")}')"><i class="ti ti-eye"></i></button>
        ${!isViewOnly()?`<button class="btn btn-sm btn-danger" onclick="deleteContributor('${c.id}')"><i class="ti ti-trash"></i></button>`:''}
      </div></td>
    </tr>`;
  }).join('');
  return`<div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem">
      <h3 style="margin:0">All contributors</h3>
      ${!isViewOnly()?`<button class="btn btn-primary btn-sm" onclick="openAddContributor()"><i class="ti ti-plus"></i> Add contributor</button>`:''}
    </div>
    ${searchBar}
    <div class="table-wrap" id="contrib-table-wrap"><table id="contrib-table">
      <tr><th>Name</th><th>KYC Status</th><th>Payments</th><th>Principal</th><th>Interest accrued</th><th>Current total</th><th></th></tr>
      ${rows}
    </table></div>
  </div>`;
}

function buildPaymentsTab(payments,contributors){
  const sorted=[...payments].sort((a,b)=>new Date(b.date)-new Date(a.date));
  if(!sorted.length)return`<div class="card"><div class="empty">No payments recorded yet.</div></div>`;
  const today=new Date();today.setHours(0,0,0,0);
  const rows=sorted.map(p=>{
    const user=contributors.find(u=>u.id===p.user_id);
    const interest=rowInterest(p,p.withdrawn_at);
    const endDate=p.withdrawn_at?new Date(p.withdrawn_at):today;
    const start=new Date(p.date);start.setHours(0,0,0,0);
    const weekdays=countWeekdays(start,endDate);
    const _food=isFoodRow(p)&&Number(p.amount)<0;
    const wBadge=(p.withdrawn?'<span style="font-size:10px;background:#FEE2E2;color:#991B1B;padding:2px 6px;border-radius:4px;margin-left:5px">Withdrawn</span>':'')+(_food?'<span style="font-size:10px;background:#FEF3C7;color:#856404;padding:2px 6px;border-radius:4px;margin-left:5px">Applied to Food Scheme</span>':'');
    return`<tr style="${p.withdrawn?'opacity:.6':''}">
      <td style="font-weight:500">${user?user.name:'Unknown'}${wBadge}</td>
      <td>${fmtDate(p.date)}</td>
      <td>${fmt(p.amount)}</td>
      <td style="color:#888;font-size:11px">${weekdays} weekdays${p.withdrawn?' (to withdrawal)':''}</td>
      <td class="green">${_food?'—':fmt(interest)}</td>
      <td><strong>${_food?'—':fmt(Number(p.amount)+interest)}</strong></td>
      <td><div style="display:flex;gap:5px;justify-content:flex-end">
        ${!p.withdrawn&&!isViewOnly()&&!_food?`<button class="btn btn-sm btn-edit" onclick="openEditPayment('${p.id}','${p.date}',${p.amount},'${user?user.name.replace(/'/g,"\\'"):"Unknown"}')"><i class="ti ti-pencil"></i></button>`:''}
        ${!p.withdrawn&&!isViewOnly()&&!_food?`<button class="btn btn-sm btn-danger" onclick="deletePayment('${p.id}')"><i class="ti ti-trash"></i></button>`:''}
      </div></td>
    </tr>`;
  }).join('');
  return`<div class="card">

async function approveSignup(id,name,email,bankName,accountName,accountNumber,phone,whatsapp){
  const err=document.getElementById('as-err');
  const btn=document.getElementById('as-btn');
  btn.innerHTML='<span class="spinner"></span> Approving…';btn.disabled=true;
  try{
    // Create user account
    // Get referred_by from signup request
    const signupReq = await sb(`signup_requests?id=eq.${id}&select=referred_by`);
    const referredBy = signupReq&&signupReq[0]?signupReq[0].referred_by:null;
    const newUsers=await sb('users',{method:'POST',body:JSON.stringify({name,email,role:'contributor',phone:phone||null,whatsapp:whatsapp||null,referred_by:referredBy||null})});
    const newUser=newUsers&&newUsers[0];
    // Save bank details
    if(newUser){
      await sb('bank_details',{method:'POST',body:JSON.stringify({user_id:newUser.id,bank_name:bankName,account_name:accountName,account_number:accountNumber})});
    }
    // Mark signup request approved
    await sb(`signup_requests?id=eq.${id}`,{method:'PATCH',body:JSON.stringify({status:'approved'})});
    // Send email
    await sendEmail({type:'approval',to:email,name});
    closeModal();
    toast('<i class="ti ti-check"></i> Approved and email sent!');
    await renderAdmin();
  }catch(e){
    err.textContent=e.message.includes('unique')||e.message.includes('duplicate')?'This email is already registered.':'Error approving. Please try again.';
    btn.innerHTML='<i class="ti ti-check"></i> Approve & send email';btn.disabled=false;
  }
}

async function rejectSignup(id){
  if(!confirm('Reject this application?'))return;
  try{
    await sb(`signup_requests?id=eq.${id}`,{method:'PATCH',body:JSON.stringify({status:'rejected'})});
    await renderAdmin();
  }catch(e){alert('Error rejecting application.');}
}

async function updateRequest(id,status){
  try{
    const requests0=await sb(`withdrawal_requests?id=eq.${id}&select=*`);
    if(!requests0||!requests0.length)throw new Error('Request not found');
    const req0=requests0[0];

    if(status==='approved' && !req0.is_account_closure){
      const req=req0;
      let remaining=Number(req.amount);

      // Fetch only active, unallocated (non-goal) payments oldest first — goal-tagged
      // money must never be touched by a regular withdrawal approval
      const payments=await sb(`payments?user_id=eq.${req.user_id}&withdrawn=eq.false&goal_id=is.null&moved_at=is.null&select=*&order=date.asc`);
      if(!payments||!payments.length)throw new Error('No active payments found');
      const availableTotal=payments.reduce((a,p)=>a+rowValue(p,null),0);
      if(availableTotal+0.01<remaining)throw new Error('Insufficient balance: member has '+fmt(availableTotal)+' available, request is '+fmt(remaining));

      await deductCapitalFirst(req.user_id,payments,remaining,'Balance carried forward after withdrawal');
    }
    const statusPatch={status};
    if(status==='approved')statusPatch.approved_at=new Date().toISOString();
    await sb(`withdrawal_requests?id=eq.${id}`,{method:'PATCH',body:JSON.stringify(statusPatch)});
    // Account closure requests: the balance was already frozen/closed at request time —
    // approval here just finalizes it by marking the account closed
    if(req0.is_account_closure && status==='approved'){
      await sb(`users?id=eq.${req0.user_id}`,{method:'PATCH',body:JSON.stringify({status:'closed',closed_at:new Date().toISOString()})});
    }
    // Send notification to contributor
    try{
      const reqArr=await sb(`withdrawal_requests?id=eq.${id}&select=*`);
      if(reqArr&&reqArr.length){
        const userArr=await sb(`users?id=eq.${reqArr[0].user_id}&select=name,email`);
        if(userArr&&userArr.length){
          await notify({type:status==='approved'?'withdrawal_approved':'withdrawal_rejected',to:userArr[0].email,name:userArr[0].name,amount:reqArr[0].amount});
        }
      }
    }catch(notifyErr){console.error('Notify error:',notifyErr);}
    await renderAdmin();
  }catch(e){alert('Error updating request: '+e.message);}
}

// ─── ACCOUNT CLOSURE ────────────────────────────────────────
// Deliberately tucked away (linked only from the KYC/profile form), not a prominent
// dashboard action — closing an account is a big, rare, irreversible-feeling decision.
function confirmRequestAccountClosure(){
  closeModal();
  openModal(`
  <h3 style="color:#A32D2D">Close your Fundova account?</h3>
  <p style="font-size:13px;color:#666;line-height:1.6">This will:</p>
  <ul style="font-size:13px;color:#666;line-height:1.8;padding-left:1.2rem">
    <li>Move any money in your goals back into your general savings automatically</li>
    <li>Stop your interest from accruing immediately</li>
    <li>Submit a request for admin to review and pay out your full balance to the bank account on file</li>
  </ul>
  <p style="font-size:13px;color:#666">You won't be able to log in again once this is approved. This can't be undone.</p>
  <div class="error" id="ac-err"></div>
  <div class="modal-footer">
    <button class="btn" onclick="closeModal()">Cancel, keep my account</button>
    <button class="btn btn-danger" id="ac-btn" onclick="requestAccountClosure()"><i class="ti ti-alert-triangle"></i> Yes, close my account</button>
  </div>`);
}

async function requestAccountClosure(){
  const err=document.getElementById('ac-err');
  const btn=document.getElementById('ac-btn');
  btn.innerHTML='<span class="spinner"></span> Processing…';btn.disabled=true;
  try{
    // 1. Auto-collapse any active goals back into general savings first
    const goals=await sb(`goals?user_id=eq.${currentUser.id}&archived=eq.false&select=*`);
    for(const g of (goals||[])){
      const gPayments=await sb(`payments?user_id=eq.${currentUser.id}&withdrawn=eq.false&goal_id=eq.${g.id}&moved_at=is.null&select=*&order=date.asc`);
      const gBalance=(gPayments||[]).reduce((a,p)=>a+rowValue(p),0);
      if(gBalance>0.5){
        const moved=await consumePaymentsFIFO(gPayments,gBalance,g.id);
        await postCarryRows(currentUser.id,moved.principal,moved.interest,null,'Moved back to savings');
      }
    }
    // 2. Freeze every remaining general-savings payment right now — this is a real
    // closure (money is genuinely leaving), so reusing withdrawn/withdrawn_at is correct here
    const generalPayments=await sb(`payments?user_id=eq.${currentUser.id}&withdrawn=eq.false&goal_id=is.null&moved_at=is.null&select=*`);
    const nowIso=new Date().toISOString();
    let frozenTotal=0;
    for(const p of (generalPayments||[])){
      frozenTotal+=rowValue(p);
      await sb(`payments?id=eq.${p.id}`,{method:'PATCH',body:JSON.stringify({withdrawn:true,withdrawn_at:nowIso})});
    }
    frozenTotal=+frozenTotal.toFixed(2);
    // 3. Submit the closure request for admin
    await sb('withdrawal_requests',{method:'POST',body:JSON.stringify({
      user_id:currentUser.id,amount:frozenTotal,note:'Account closure — full balance payout',status:'pending',is_account_closure:true
    })});
    notify({type:'admin_withdrawal_request',name:currentUser.name,amount:frozenTotal,note:'⚠️ ACCOUNT CLOSURE — full balance payout, please review'}).catch(e=>logSystemError('notify:account_closure',e));
    notifyContributorAction('Account closure requested','You requested to close your Fundova account. Your interest has stopped accruing, and your final balance of '+fmt(frozenTotal)+' is now pending admin review before payout to the bank account on file.');
    toast('<i class="ti ti-check"></i> Closure requested — admin will process your final payout.');
    closeModal();
    await renderContributor();
  }catch(e){err.textContent='Error: '+e.message;btn.innerHTML='<i class="ti ti-alert-triangle"></i> Yes, close my account';btn.disabled=false;}
}

// ─── CONTRIBUTOR DASHBOARD ────────────────────────────────
// ─── STATEMENT OF ACCOUNT ───────────────────────────────────
// Read-only, full history: every contribution (withdrawn or not) and every withdrawal.
// Display only — never touches balances or interest.
function _stEsc(t){return String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
async function openStatement(){
  openModal('<div style="padding:2rem;text-align:center;color:#888"><div class="spinner spinner-dark" style="width:20px;height:20px;display:inline-block"></div> Preparing your statement…</div>');
  try{
    const uid=currentUser.id;
    const [pays,reqs,res,fh]=await Promise.all([
      sb(`payments?user_id=eq.${uid}&select=*&order=date.asc`),
      sb(`withdrawal_requests?user_id=eq.${uid}&status=eq.approved&select=*`),
      sb(`investment_reservations?user_id=eq.${uid}&status=eq.payment_confirmed&payment_method=eq.savings&select=*`).catch(()=>[]),
      sb(`food_scheme_history?user_id=eq.${uid}&event=eq.deducted&select=*`).catch(()=>[])
    ]);
    let invMap={};
    if(res&&res.length){
      try{
        const ids=[...new Set(res.map(r=>r.investment_id))];
        const invs=await sb(`investments?id=in.(${ids.join(',')})&select=id,title,unit_price`);
        (invs||[]).forEach(i=>invMap[i.id]=i);
      }catch(e){}
    }
    const rows=[];
    let totalIn=0,totalOut=0,totalUsed=0;
    (pays||[]).forEach(p=>{
      const amt=Number(p.amount);
      if(p.is_transfer){
        // internal relabeling — except food scheme deductions, which are real money used
        if(amt<0&&p.purpose){rows.push({d:p.date,t:'used',desc:p.purpose,amt:Math.abs(amt)});totalUsed+=Math.abs(amt);}
        return;
      }
      if(amt>0){rows.push({d:p.date,t:'in',desc:p.purpose||'Savings contribution',amt});totalIn+=amt;}
    });
    (reqs||[]).forEach(r=>{
      const amt=Number(r.amount);
      rows.push({d:r.approved_at||r.created_at,t:'out',desc:r.is_account_closure?'Account closure withdrawal':(r.note||'Withdrawal'),amt});
      totalOut+=amt;
    });
    (res||[]).forEach(r=>{
      const inv=invMap[r.investment_id];
      if(!inv)return;
      const amt=r.units*inv.unit_price;
      rows.push({d:r.updated_at||r.created_at,t:'used',desc:'Investment: '+inv.title,amt});
      totalUsed+=amt;
    });
    (fh||[]).forEach(h=>{const a=Number(h.amount);if(a>0){rows.push({d:h.created_at,t:'used',desc:'Food Scheme: '+(h.option_name||'package'),amt:a});totalUsed+=a;}});
    rows.sort((a,b)=>new Date(b.d)-new Date(a.d));
    const held=(pays||[]).filter(p=>!p.withdrawn&&!p.moved_at).reduce((a,p)=>a+rowValue(p),0);
    const tag={in:['Contribution','#0F6E56'],out:['Withdrawal','#A32D2D'],used:['Applied','#856404']};
    const tbl=rows.length?rows.map(r=>`<tr>
      <td style="white-space:nowrap">${fmtDate(r.d)}</td>
      <td style="font-size:12px;color:#555">${_stEsc(r.desc)}</td>
      <td style="font-size:11px;font-weight:600;color:${tag[r.t][1]}">${tag[r.t][0]}</td>

function printStatement(){

  const amount=parseFloat(document.getElementById('wr-amt').value);
  const note=document.getElementById('wr-note').value.trim();
  const err=document.getElementById('wr-err');
  const btn=document.getElementById('wr-btn');

  btn.innerHTML='<span class="spinner" style="border-top-color:#856404"></span> Submitting…';btn.disabled=true;
  try{
    await sb('withdrawal_requests',{method:'POST',body:JSON.stringify({user_id:currentUser.id,amount,note,status:'pending'})});

// ─── GOALS (beneficiary/goal boxes) ────────────────────────
// A "goal" is just a named box under the contributor's own account — never a separate
// member, no KYC. Money moves in and out via the same oldest-first FIFO consume/split
// mechanic used for partial withdrawals: fully-consumed source payments get retired
// (moved_at set, excluding them from their old bucket), the payment that overflows gets
// split into a retired original + a fresh leftover payment left behind in the SOURCE
// bucket, and the full assigned amount lands as one brand-new payment in the DESTINATION
// bucket, dated today — so it starts earning interest fresh from the moment it moves,
// exactly like a partial-withdrawal leftover does today.

// Sends a plain confirmation email to the currently logged-in contributor for something
// they just did. Fire-and-forget — never blocks the UI on this.
function notifyContributorAction(title, detail){
  if(!currentUser||!currentUser.email)return;
  notify({type:'contributor_action',to:currentUser.email,name:currentUser.name,title,detail}).catch(e=>logSystemError('notify:contributor_action:'+title,e));
}

// Consumes `amountNeeded` worth of current value (principal+interest) from `sourcePayments`
// (already fetched, oldest-first, already filtered to the correct bucket). Returns true if
// fully consumed, false if the source bucket didn't have enough to cover it (nothing is
// changed in that case — caller should check before writing the destination payment).
async function consumePaymentsFIFO(sourcePayments, amountNeeded, sourceGoalId){
  // Moves value between buckets. Each lot is consumed interest-first; any leftover of a partly
  // used lot is carried forward as a principal row + a separate non-earning interest row so
  // interest is never earned on interest. Returns {principal,interest} actually moved, or false.
  const totalAvailable=(sourcePayments||[]).reduce((a,p)=>a+rowValue(p,p.withdrawn_at||p.moved_at||null),0);
  if(totalAvailable+0.005<amountNeeded)return false;

  let remaining=amountNeeded, movedP=0, movedI=0;
  const nowIso=new Date().toISOString();
  for(const p of sourcePayments){
    if(remaining<=0.005)break;
    const parts=lotParts(p,p.withdrawn_at||p.moved_at||null);
    const currentValue=parts.P+parts.I;
    if(currentValue<=remaining+0.005){
      await sb(`payments?id=eq.${p.id}`,{method:'PATCH',body:JSON.stringify({moved_at:nowIso})});
      movedP+=parts.P; movedI+=parts.I;
      remaining-=currentValue;
    } else {
      const sp=splitLot(parts,remaining);
      await sb(`payments?id=eq.${p.id}`,{method:'PATCH',body:JSON.stringify({moved_at:nowIso})});
      await postCarryRows(currentUser.id,sp.leftP,sp.leftI,sourceGoalId||null,'Balance carried forward');
      movedP+=sp.takeP; movedI+=sp.takeI;
      remaining=0;
    }
  }
  return {principal:+movedP.toFixed(2),interest:+movedI.toFixed(2)};
}

async function moveGoalToGeneral(goalId,goalName){
  const amount=parseFloat(document.getElementById('mg-amt').value);
  const err=document.getElementById('mg-err');
  const btn=document.getElementById('mg-btn');
  if(!amount||amount<=0){err.textContent='Please enter a valid amount.';return;}
  btn.innerHTML='<span class="spinner"></span> Moving…';btn.disabled=true;
  try{
    const goalPayments=await sb(`payments?user_id=eq.${currentUser.id}&withdrawn=eq.false&goal_id=eq.${goalId}&moved_at=is.null&select=*&order=date.asc`);
    const ok=await consumePaymentsFIFO(goalPayments,amount,goalId);
    if(!ok){err.textContent='That\'s more than this goal currently holds — nothing was moved.';btn.innerHTML='<i class="ti ti-arrow-left"></i> Move to savings';btn.disabled=false;return;}
    await postCarryRows(currentUser.id,ok.principal,ok.interest,null,'Moved back to savings');
    notifyContributorAction('Money moved from '+goalName, 'You moved '+fmt(amount)+' from "'+goalName+'" back into your unallocated savings. You can now request a withdrawal on it if you\'d like.');
    closeModal();
    toast('<i class="ti ti-check"></i> Moved back to your savings!');
    await renderContributor();
  }catch(e){err.textContent='Error: '+e.message;btn.innerHTML='<i class="ti ti-arrow-left"></i> Move to savings';btn.disabled=false;}
}

function buildGoalsCarouselSection(goals,goalPayments){
  const items=(goals||[]).map(g=>{
    const gPays=(goalPayments||[]).filter(p=>p.goal_id===g.id);
    const gPrincipal=gPays.reduce((a,p)=>a+rowPrincipal(p),0);

    const pct=g.target_amount?Math.min(100,Math.round((gTotal/g.target_amount)*100)):null;
    return{g,gTotal,pct};
  });
  items.push({isPrompt:true});
  window._goalsCarouselList=items;
  goalsCarouselIndex=0;
  return`<div id="goals-carousel-track">${buildGoalCarouselCard(items[0])}</div>

  <div class="modal-footer">

async function savePayment(userId){
  const date=document.getElementById('np-date').value;
  const amount=parseFloat(document.getElementById('np-amt').value);
  const err=document.getElementById('np-err');
  const btn=document.getElementById('np-btn');
  if(!date||!amount){err.textContent='All fields required.';return;}
  if(amount<=0){err.textContent='Amount must be greater than 0.';return;}
  btn.innerHTML='<span class="spinner"></span> Saving…';btn.disabled=true;
  try{
    await sb('payments',{method:'POST',body:JSON.stringify({user_id:userId,amount,date,withdrawn:false})});
    // Check if this is first payment and process referral bonus
    const prevPayments = await sb('payments?user_id=eq.'+userId+'&select=id');
    if(prevPayments && prevPayments.length === 1){
      // This was the first payment - process referral bonus
      processReferralBonus(userId).catch(e=>logSystemError('processReferralBonus',e));
    }
    // Send payment notification email
    try{
      const contribs=await sb('users?id=eq.'+userId+'&select=name,email');
      if(contribs&&contribs.length){
        const fmtAmt=Number(amount).toLocaleString('en-NG',{minimumFractionDigits:2});
        const fmtDt=new Date(date).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
        await sendEmail({type:'payment',to:contribs[0].email,name:contribs[0].name,amount:fmtAmt,date:fmtDt});
      }
    }catch(emailErr){console.error('Payment email error:',emailErr);}
    closeModal();await renderAdmin();
  }catch(e){err.textContent='Error saving payment.';btn.innerHTML='<i class="ti ti-device-floppy"></i> Save payment';btn.disabled=false;}
}

    const today=new Date();today.setHours(0,0,0,0);
    const _net=netFoodRows(pays);
    const rows=_net.rows.length?_net.rows.map(p=>{
      const int=rowInterest(p);
      const start=new Date(p.date);start.setHours(0,0,0,0);
      const weekdays=countWeekdays(start,today);
      const lock=p._virtual?'Interest on amounts applied to Food Scheme':p._locked?'Part applied to Food Scheme':isFoodRow(p)?'Food Scheme':'';
      return`<tr>
        <td>${fmtDate(p.date)}</td><td>${fmt(p.amount)}</td>
        <td style="color:#888">${p._virtual?'—':weekdays+'d'}</td>
        <td class="green">${fmt(int)}</td>

        </div>`}</td>

    const bankSection=bank?`
    <div style="background:#F0FDF8;border:1px solid #BBF7D0;border-radius:10px;padding:14px 16px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px">

      <div><div class="stat-label">Account number</div><div style="font-weight:500;font-family:monospace;margin-top:3px">${bank.account_number}</div></div>
    </div>
    <div style="text-align:right;margin-top:-4px">
      <button class="btn btn-sm btn-edit" onclick="openEditBankDetails('${userId}','${userName.replace(/'/g,"\\'")}','${bank.id}','${bank.bank_name.replace(/'/g,"\\'")}','${bank.account_name.replace(/'/g,"\\'")}','${bank.account_number}')"><i class="ti ti-pencil"></i> Edit bank details</button>
    </div>`:`
    <div style="background:#FFFBEB;border:1px solid #FDE68A;border-radius:10px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px">
      <span style="font-size:13px;color:#92400E"><i class="ti ti-alert-triangle"></i> No bank details yet</span>
      <button class="btn btn-sm btn-primary" onclick="openEditBankDetails('${userId}','${userName.replace(/'/g,"\\'")}',null,'','','')"><i class="ti ti-plus"></i> Add</button>
    </div>`;

    openModal(`
    <h3>${userName}</h3>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
      <div class="stat"><div class="stat-label">Principal</div><div style="font-size:16px;font-weight:600">${fmt(principal)}</div></div>
      <div class="stat"><div class="stat-label">Interest</div><div style="font-size:16px;font-weight:600" class="green">${fmt(interest)}</div></div>
      <div class="stat"><div class="stat-label">Total</div><div style="font-size:16px;font-weight:600">${fmt(principal+interest)}</div></div>
    </div>
    <hr class="divider">
    <div style="font-size:12px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">Payout bank details</div>
    ${bankSection}
    <hr class="divider">
    <div style="font-size:12px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">Payment history</div>
    <div class="table-wrap"><table>
      <tr><th>Date</th><th>Amount</th><th>Weekdays</th><th>Interest</th><th></th></tr>
      ${rows}
    </table></div>
    ${_net.netted?'<div style="font-size:11px;color:#888;margin-top:6px">Amounts applied to the Food Scheme are taken from the oldest payments and are listed in the contributor\'s statement. The totals above are unchanged.</div>':''}
    <div class="modal-footer">
      <button class="btn" onclick="openAddPayment('${userId}','${userName.replace(/'/g,"\\'")}')"><i class="ti ti-plus"></i> Add payment</button>
      <button class="btn" onclick="closeModal()">Close</button>
    </div>`);

  openModal(`

  <p style="font-size:13px;color:#666;margin-top:-6px">${userName}</p>

  <div class="field"><label>Account number</label><input id="bd-anum" type="text" maxlength="10" placeholder="e.g. 0123456789" value="${accountNumber}"></div>
  <div class="error" id="bd-err"></div>
  <div class="modal-footer">
    <button class="btn" onclick="openViewContributor('${userId}','${userName.replace(/'/g,"\\'")}')">Cancel</button>
    <button class="btn btn-primary" id="bd-btn" onclick="saveBankDetails('${userId}','${userName.replace(/'/g,"\\'")}','${bankId}')"><i class="ti ti-device-floppy"></i> Save details</button>
  </div>`);

async function saveBankDetails(userId,userName,bankId){
  const bank_name=document.getElementById('bd-bank').value.trim();
  const account_name=document.getElementById('bd-aname').value.trim();
  const account_number=document.getElementById('bd-anum').value.trim();
  const err=document.getElementById('bd-err');
  const btn=document.getElementById('bd-btn');
  if(!bank_name||!account_name||!account_number){err.textContent='All fields are required.';return;}
  if(!/^\d{10}$/.test(account_number)){err.textContent='Account number must be exactly 10 digits.';return;}
  btn.innerHTML='<span class="spinner"></span> Saving…';btn.disabled=true;
  try{
    if(bankId&&bankId!=='null'){
      await sb(`bank_details?id=eq.${bankId}`,{method:'PATCH',body:JSON.stringify({bank_name,account_name,account_number})});
    } else {
      await sb('bank_details',{method:'POST',body:JSON.stringify({user_id:userId,bank_name,account_name,account_number})});
    }
    await openViewContributor(userId,userName);
  }catch(e){err.textContent='Error saving.';btn.innerHTML='<i class="ti ti-device-floppy"></i> Save details';btn.disabled=false;}
}

async function deletePaymentFromView(payId,userId,userName){
  if(await _foodRowGuard(payId))return;
  if(!confirm('Delete this payment?'))return;
  try{await sb(`payments?id=eq.${payId}`,{method:'DELETE'});await openViewContributor(userId,userName);}
  catch(e){alert('Error deleting payment.');}
}

async function buildInvestmentsAdminTab(investments,contributors){
  const reservations=await sb('investment_reservations?select=*');
  if(!investments||!investments.length){

  const cards=investments.map(inv=>{
    const invRes=reservations.filter(r=>r.investment_id===inv.id);

    const pendingRes=invRes.filter(r=>r.status==='pending'||r.status==='approved'||r.status==='payment_made');
    const unitsSold=confirmedRes.reduce((a,r)=>a+r.units,0);
    const unitsPending=pendingRes.reduce((a,r)=>a+r.units,0);
    const pct=Math.min(100,Math.round((unitsSold/inv.total_units)*100));
    const statusColors={coming_soon:'#856404|#FFF3CD',open:'#065F46|#D1FAE5',funded:'#185FA5|#E6F1FB',closed:'#666|#f5f5f3'};

    return`<div class="card" style="margin-bottom:1rem">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px">
        <div style="flex:1">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
            <h3 style="margin:0;font-size:15px">${inv.title}</h3>
            <span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;background:${bg};color:${sc}">${inv.status.replace('_',' ').toUpperCase()}</span>
          </div>
          <p style="font-size:13px;color:#888;margin-bottom:0">${inv.description||''}</p>
        </div>
        <div style="display:flex;gap:6px;flex-shrink:0">
          <button class="btn btn-sm btn-edit" onclick="openEditInvestment('${inv.id}')"><i class="ti ti-pencil"></i></button>
          <button class="btn btn-sm" onclick="openInvestmentDetail('${inv.id}')"><i class="ti ti-eye"></i> Details</button>
          ${inv.status!=='closed'?`<button class="btn btn-sm btn-warn" onclick="refundFailedInvestment('${inv.id}')"><i class="ti ti-refresh"></i> Refund all</button>`:''}
          <button class="btn btn-sm btn-danger" onclick="deleteInvestment('${inv.id}')"><i class="ti ti-trash"></i></button>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:12px">
        <div class="stat" style="padding:10px 12px"><div class="stat-label">Unit price</div><div style="font-size:15px;font-weight:600">${fmt(inv.unit_price)}</div></div>
        <div class="stat" style="padding:10px 12px"><div class="stat-label">Total units</div><div style="font-size:15px;font-weight:600">${inv.total_units}</div></div>
        <div class="stat" style="padding:10px 12px"><div class="stat-label">Units sold</div><div style="font-size:15px;font-weight:600;color:#0F6E56">${unitsSold}</div></div>
        <div class="stat" style="padding:10px 12px"><div class="stat-label">Pending</div><div style="font-size:15px;font-weight:600;color:#856404">${unitsPending}</div></div>
        <div class="stat" style="padding:10px 12px"><div class="stat-label">Available</div><div style="font-size:15px;font-weight:600">${inv.total_units-unitsSold-unitsPending}</div></div>
        <div class="stat" style="padding:10px 12px"><div class="stat-label">Amount raised</div><div style="font-size:15px;font-weight:600">${fmt(unitsSold*inv.unit_price)}</div></div>
      </div>
      <div style="background:#f5f5f3;border-radius:8px;height:8px;overflow:hidden;margin-bottom:6px">
        <div style="height:100%;background:#1D9E75;width:${pct}%;transition:width .3s"></div>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:12px;color:#888;margin-bottom:12px">
        <span>${pct}% funded</span>

      </div>
      ${pendingRes.length?`<div style="display:flex;align-items:center;justify-content:space-between;background:#FFF8E6;border:1px solid #FDEFC3;border-radius:8px;padding:10px 14px">

    </div>`;

  return`<div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem">
      <h3 style="margin:0">Investment opportunities</h3>
      <button class="btn btn-primary btn-sm" onclick="openAddInvestment()"><i class="ti ti-plus"></i> Create investment</button>
    </div>
    ${cards}
  </div>`;
}

function previewUnitPrice(){
  const cost=parseFloat(document.getElementById('ni-cost')?.value||document.getElementById('ei-cost')?.value);
  const units=parseFloat(document.getElementById('ni-units')?.value||document.getElementById('ei-units')?.value);
  const preview=document.getElementById('ni-preview');
  const upriceEl=document.getElementById('ni-uprice');
  if(cost&&units&&units>0&&preview&&upriceEl){
    upriceEl.textContent=fmt(cost/units);
    preview.style.display='block';
  }
}

async function saveInvestment(id){
  const isEdit=!!id;
  const title=(document.getElementById(isEdit?'ei-title':'ni-title')||{}).value?.trim();
  const description=(document.getElementById(isEdit?'ei-desc':'ni-desc')||{}).value?.trim();
  const total_cost=parseFloat((document.getElementById(isEdit?'ei-cost':'ni-cost')||{}).value);
  const total_units=parseInt((document.getElementById(isEdit?'ei-units':'ni-units')||{}).value);
  const deadline=(document.getElementById(isEdit?'ei-deadline':'ni-deadline')||{}).value||null;
  const status=(document.getElementById(isEdit?'ei-status':'ni-status')||{}).value;
  const err=document.getElementById(isEdit?'ei-err':'ni-err');
  const btn=document.getElementById(isEdit?'ei-btn':'ni-btn');
  if(!title||!total_cost||!total_units){err.textContent='Title, cost and units are required.';return;}
  const unit_price=+(total_cost/total_units).toFixed(2);
  btn.innerHTML='<span class="spinner"></span> Saving…';btn.disabled=true;
  try{
    if(isEdit){
      await sb(`investments?id=eq.${id}`,{method:'PATCH',body:JSON.stringify({title,description,total_cost,total_units,unit_price,deadline,status})});
    } else {
      await sb('investments',{method:'POST',body:JSON.stringify({title,description,total_cost,total_units,unit_price,deadline,status})});
    }
    closeModal();await renderAdmin();
  }catch(e){err.textContent='Error saving.';btn.innerHTML='<i class="ti ti-device-floppy"></i> '+( isEdit?'Save changes':'Create');btn.disabled=false;}
}

async function updateReservation(resId,status,invId){
  try{
    if(status==='payment_confirmed'){
      // Payment confirmed - now deduct from savings if payment method is savings
      const resArr=await sb(`investment_reservations?id=eq.${resId}&select=*`);
      const res=resArr[0];
      if(res.payment_method==='savings'){
        const invArr=await sb(`investments?id=eq.${res.investment_id}&select=*`);
        const inv=invArr[0];
        const totalCost=res.units*inv.unit_price;
        const pays=await sb(`payments?user_id=eq.${res.user_id}&withdrawn=eq.false&goal_id=is.null&moved_at=is.null&select=*&order=date.asc`);
        let remaining=totalCost;
        const availableTotal=pays.reduce((a,p)=>a+rowValue(p,null),0);
        if(availableTotal+0.01<totalCost)throw new Error('Insufficient savings balance: member has '+fmt(availableTotal)+', investment costs '+fmt(totalCost));
        await deductCapitalFirst(res.user_id,pays,remaining,'Balance carried forward after investment');
      }
    }
    await sb(`investment_reservations?id=eq.${resId}`,{method:'PATCH',body:JSON.stringify({status})});
    // Notify investor
    try{
      const resArr=await sb(`investment_reservations?id=eq.${resId}&select=*`);
      if(resArr&&resArr.length){
        const userArr=await sb(`users?id=eq.${resArr[0].user_id}&select=name,email`);
        const invArr=await sb(`investments?id=eq.${resArr[0].investment_id}&select=title,unit_price`);
        if(userArr&&userArr.length&&invArr&&invArr.length){
          const notifType=status==='approved'?'investment_approved':status==='payment_confirmed'?'investment_payment_confirmed':status==='cancelled'?'investment_cancelled':null;
          if(notifType){
            await notify({type:notifType,to:userArr[0].email,name:userArr[0].name,investment:invArr[0].title,units:resArr[0].units,amount:resArr[0].units*invArr[0].unit_price,payment_method:resArr[0].payment_method});
          }
        }
      }
    }catch(e){console.error('Investment notify error:',e);}
    await openInvestmentDetail(invId);
  }catch(e){alert('Error updating reservation: '+e.message);}
}

function previewNetIncome(){
  const gross=parseFloat(document.getElementById('ri-gross')?.value||0);
  const exp=parseFloat(document.getElementById('ri-exp')?.value||0);
  const preview=document.getElementById('ri-preview');
  if(gross>0&&preview){
    const net=gross-exp;
    document.getElementById('ri-net').textContent=fmt(net);
    document.getElementById('ri-per').textContent=fmt(net);
    preview.style.display='block';
  }
}

async function saveIncome(invId,confirmedUnits){
  const month=document.getElementById('ri-month').value.trim();
  const gross_income=parseFloat(document.getElementById('ri-gross').value);
  const expenses=parseFloat(document.getElementById('ri-exp').value||0);
  const err=document.getElementById('ri-err');
  const btn=document.getElementById('ri-btn');
  if(!month||!gross_income){err.textContent='Month and gross income are required.';return;}
  const net_income=+(gross_income-expenses).toFixed(2);
  btn.innerHTML='<span class="spinner"></span> Distributing…';btn.disabled=true;
  try{
    // Save income record
    await sb('investment_income',{method:'POST',body:JSON.stringify({investment_id:invId,month,gross_income,expenses,net_income})});
    // Get confirmed reservations
    const reservations=await sb(`investment_reservations?investment_id=eq.${invId}&status=eq.payment_confirmed&select=*`);
    const totalUnits=reservations.reduce((a,r)=>a+r.units,0);
    const today=new Date().toISOString().split('T')[0];
    // Distribute to each investor by crediting savings
    for(const r of reservations){
      const share=+((r.units/totalUnits)*net_income).toFixed(2);
      if(share>0){
        await sb('payments',{method:'POST',body:JSON.stringify({
          user_id:r.user_id,
          amount:share,
          date:today,
          withdrawn:false
        })});
      }
    }
    closeModal();
    toast('<i class="ti ti-check"></i> Income recorded and distributed to '+reservations.length+' investors!');
    await renderAdmin();
  }catch(e){err.textContent='Error saving income.';btn.innerHTML='<i class="ti ti-device-floppy"></i> Record & distribute';btn.disabled=false;}
}

async function approveInvestmentRefund(refundId,invId){
  if(!confirm('Approve this refund request? The invested amount will be returned to their savings balance.'))return;
  try{
    // Get the refund request
    const reqArr=await sb(`investment_refund_requests?id=eq.${refundId}&select=*`);
    const req=reqArr[0];
    // Get the reservation
    const resArr=await sb(`investment_reservations?investment_id=eq.${invId}&user_id=eq.${req.user_id}&status=eq.payment_confirmed&select=*`);
    if(resArr&&resArr.length){
      const res=resArr[0];
      const invArr=await sb(`investments?id=eq.${invId}&select=*`);
      const inv=invArr[0];
      const refundAmount=+(res.units*inv.unit_price).toFixed(2);
      const today=new Date().toISOString().split('T')[0];
      // Credit back to savings
      await sb('payments',{method:'POST',body:JSON.stringify({user_id:req.user_id,amount:refundAmount,date:today,withdrawn:false,is_transfer:true})});
      // Cancel the reservation
      await sb(`investment_reservations?id=eq.${res.id}`,{method:'PATCH',body:JSON.stringify({status:'cancelled'})});
    }
    await sb(`investment_refund_requests?id=eq.${refundId}`,{method:'PATCH',body:JSON.stringify({status:'approved'})});
    toast('<i class="ti ti-check"></i> Refund approved and credited to savings.');
    // Notify investor
    try{
      const reqArr2=await sb(`investment_refund_requests?id=eq.${refundId}&select=*`);
      if(reqArr2&&reqArr2.length){
        const userArr=await sb(`users?id=eq.${reqArr2[0].user_id}&select=name,email`);
        const invArr=await sb(`investments?id=eq.${reqArr2[0].investment_id}&select=title`);
        if(userArr&&userArr.length){
          await notify({type:'investment_refund_approved',to:userArr[0].email,name:userArr[0].name,investment:invArr&&invArr.length?invArr[0].title:'your investment'});
        }
      }
    }catch(e){console.error('Refund notify error:',e);}
    await openInvestmentDetail(invId);
  }catch(e){alert('Error approving refund: '+e.message);}
}

async function updateInvestmentRefund(refundId,status,invId){

async function updateDeal(id,status,newExpiry){

    if(newExpiry)patchBody.expires_at=newExpiry;
    await sb(`deals?id=eq.${id}`,{method:'PATCH',body:JSON.stringify(patchBody)});

        if(userArr&&userArr.length){

// Featured deals quietly expire back to "approved" (never deleted) once their date passes.
// No server cron exists, so this runs client-side whenever deals are loaded — checked on
// every admin/homepage/dashboard deals fetch, so it self-corrects within one page load of
// the expiry date passing, without needing a backend job.
async function expireOldFeaturedDeals(deals){
  const today=new Date();today.setHours(0,0,0,0);
  const expired=(deals||[]).filter(d=>d.status==='featured'&&d.expires_at&&new Date(d.expires_at)<today);
  for(const d of expired){
    try{
      await sb(`deals?id=eq.${d.id}`,{method:'PATCH',body:JSON.stringify({status:'approved'})});
      d.status='approved'; // reflect immediately in the in-memory list passed in
    }catch(e){logSystemError('expireOldFeaturedDeals',e);}
  }
  return deals;
}

// Manual navigation (also resets the autoplay timer so it doesn't jump right after a click)
function dealsCarouselGoTo(trackId,idx){
  const list=window._dealsCarouselList||[];
  if(!list.length)return;
  dealsCarouselIndex=((idx%list.length)+list.length)%list.length;
  renderDealsCarouselFrame(trackId);
  startDealsCarouselAutoplay(trackId);
}
function dealsCarouselNav(trackId,dir){
  dealsCarouselGoTo(trackId,dealsCarouselIndex+dir);
}
function renderDealsCarouselFrame(trackId){
  const list=window._dealsCarouselList||[];
  const el=document.getElementById(trackId);
  if(!el||!list.length)return;
  el.innerHTML=buildDealCard(list[dealsCarouselIndex]);
  const dotsEl=document.getElementById(trackId+'-dots');
  if(dotsEl)dotsEl.innerHTML=list.map((_,i)=>`<div onclick="dealsCarouselGoTo('${trackId}',${i})" style="width:7px;height:7px;border-radius:50%;cursor:pointer;background:${i===dealsCarouselIndex?'#0D3D2A':'#e5e5e2'}"></div>`).join('');
}
// Auto-advances every 5s; self-clears if the carousel's container has left the DOM
// (e.g. the user navigated away), so it never keeps ticking on a page that's gone.
function startDealsCarouselAutoplay(trackId){
  if(dealsCarouselTimer)clearInterval(dealsCarouselTimer);
  const list=window._dealsCarouselList||[];
  if(list.length<=1)return;
  dealsCarouselTimer=setInterval(()=>{
    const el=document.getElementById(trackId);
    if(!el){clearInterval(dealsCarouselTimer);dealsCarouselTimer=null;return;}
    dealsCarouselIndex=(dealsCarouselIndex+1)%list.length;
    renderDealsCarouselFrame(trackId);
  },5000);
}
